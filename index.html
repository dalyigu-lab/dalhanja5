<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>달달맘한자 5급 모의고사</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="대한검정회 5급 기출 80~96회 750문항을 분석해 매번 새 50문항 모의고사를 실제 시험지 모양으로 만들어 주는 연습 앱">
<meta property="og:title" content="달달맘한자 5급 모의고사">
<meta property="og:description" content="매번 새로 나오는 대한검정회 5급 모의고사 · 채점 · 오답노트 · 인쇄">
<meta property="og:type" content="website">
<meta name="theme-color" content="#E0A526">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 56 56'%3E%3Ccircle cx='28' cy='28' r='26' fill='%23E0A526'/%3E%3Ccircle cx='20' cy='24' r='3' fill='%233E2A14'/%3E%3Ccircle cx='36' cy='24' r='3' fill='%233E2A14'/%3E%3Cpath d='M19 34 Q28 43 37 34' fill='none' stroke='%233E2A14' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Gowun+Dodum&family=Jua&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@700;900&family=Noto+Serif+KR:wght@400;600;700;900&display=swap">
<style>
/* Layout: 책상 위 시험지 — 크림색 책상(앱) 위에 흰 시험지 한 장. 시험지는 실제 검정시험지 문법(명조, 2단, 네모 지시문), 표시는 연필, 채점은 빨간 펜. */
:root{
  --desk:#FFF8E7; --panel:#FFFFFF; --ink:#3E2A14; --muted:#8A6F4E; --line:#EADBB8;
  --gold:#E0A526; --gold-ink:#3E2A14; --gold-soft:#F8E6B4; --brown:#6B4520;
  --red:#D6322B; --red-soft:#FCE3DF; --green:#2F8A55; --green-soft:#DDF2E4;
  --paper:#FFFFFF; --paper-ink:#111111; --paper-rule:#222222; --pencil:#4B4F58; --redpen:#D8231B;
  --shadow:0 2px 0 rgba(107,69,32,.14);
  --f-brand:"Baloo 2","Jua",system-ui,sans-serif;
  --f-disp:"Jua","Gowun Dodum",system-ui,sans-serif;
  --f-body:"Gowun Dodum","Noto Serif KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-paper:"Noto Serif KR","Batang","AppleMyungjo","Noto Serif CJK KR",serif;
  --f-head:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif;
  --f-hand:"Nanum Pen Script","Gowun Dodum",cursive;
  --r-s:8px; --r-m:16px; --r-l:24px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#1D160E; --panel:#2A2016; --ink:#F6E9CF; --muted:#BFA784; --line:#4A3B26;
  --gold:#F0B93A; --gold-ink:#2A1E0E; --gold-soft:#4A3A1A; --brown:#E9C98E;
  --red:#FF6B5E; --red-soft:#4A221E; --green:#6CC38A; --green-soft:#1F3A29;
  --paper:#F7F3EA; --shadow:0 2px 0 rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#1D160E; --panel:#2A2016; --ink:#F6E9CF; --muted:#BFA784; --line:#4A3B26;
  --gold:#F0B93A; --gold-ink:#2A1E0E; --gold-soft:#4A3A1A; --brown:#E9C98E;
  --red:#FF6B5E; --red-soft:#4A221E; --green:#6CC38A; --green-soft:#1F3A29;
  --paper:#F7F3EA; --shadow:0 2px 0 rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--desk)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;padding-inline:16px;padding-block:0 120px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.wrap.wide{max-width:980px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--f-disp);font-weight:400;margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:28px}h2{font-size:22px}h3{font-size:18px}
.muted{color:var(--muted)}.small{font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--desk);display:flex;align-items:center;gap:8px;padding-block:12px;border-bottom:2px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.brand b{font-family:var(--f-brand);font-weight:800;font-size:20px}
.brand small{font-family:var(--f-disp);color:var(--muted);font-size:14px}
.sp{flex:1}
.pill{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:14px;transition:transform .12s}
.pill:hover{transform:translateY(-1px)}.pill:active{transform:translateY(1px)}
.pill.on{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn{border:2px solid var(--brown);background:var(--panel);border-radius:var(--r-m);padding:12px 16px;font-family:var(--f-disp);font-size:17px;box-shadow:var(--shadow);transition:transform .12s,background-color .12s}
.btn:hover{transform:translateY(-2px);background:var(--gold-soft)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.mom{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{border-color:var(--line);box-shadow:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.card{background:var(--panel);border:2px solid var(--line);border-radius:var(--r-l);padding:16px}
.note{font-size:14px;color:var(--muted);background:var(--gold-soft);border-radius:var(--r-m);padding:12px 16px;margin:0}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--desk);padding:8px 16px;border-radius:999px;z-index:40;font-size:15px;max-width:calc(100% - 32px);text-align:center}

/* ---------- 홈 ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;background:var(--panel);border:2px solid var(--brown);border-radius:var(--r-l);padding:20px;box-shadow:var(--shadow)}
.hero h1 span{color:var(--gold)}
.hero p{margin:4px 0 12px}
.minipaper{width:112px;aspect-ratio:210/297;max-width:100%;background:#fff;border:1.5px solid #222;border-radius:2px;padding:8px 7px;display:flex;flex-direction:column;gap:4px;transform:rotate(4deg);box-shadow:4px 6px 0 rgba(107,69,32,.18)}
.minipaper .c{display:flex;align-items:center;gap:3px}
.minipaper .c b{width:16px;height:16px;border-radius:50%;background:#111;color:#fff;font:900 11px/16px var(--f-head);text-align:center}
.minipaper i{display:block;height:3px;background:#bbb;border-radius:2px}
.minipaper .dbl{height:3px;border-top:1.5px solid #222;border-bottom:.8px solid #222}
.minipaper .cols{display:grid;grid-template-columns:1fr 1fr;gap:5px;flex:1}
.minipaper .cols div{display:flex;flex-direction:column;gap:4px}
.minipaper .score{position:absolute}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:2px solid var(--line);border-radius:var(--r-m);padding:12px;display:flex;flex-direction:column}
.stat b{font-family:var(--f-brand);font-weight:800;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tool{text-align:left;border:2px solid var(--line);background:var(--panel);border-radius:var(--r-l);padding:16px;display:flex;flex-direction:column;gap:4px;transition:transform .12s,border-color .12s}
.tool:hover{transform:translateY(-2px);border-color:var(--gold)}
.tool b{font-family:var(--f-disp);font-weight:400;font-size:19px}
.tool .cnt{font-family:var(--f-brand);font-weight:800;font-size:22px;color:var(--red)}
.tool.mom-tool{border-color:var(--red)}
.hist{display:flex;gap:6px;align-items:flex-end;height:72px;padding-top:8px}
.hist i{flex:1;max-width:28px;border-radius:4px 4px 0 0;background:var(--red);transform-origin:bottom}
.hist i.p{background:var(--green)}
.reply{background:var(--gold-soft);border-radius:var(--r-l);padding:16px;display:flex;gap:12px;align-items:flex-start}
.reply p{margin:0}
.real{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.real button{border:2px solid var(--line);background:var(--panel);border-radius:var(--r-m);padding:8px 12px;text-align:left;transition:transform .12s}
.real button:hover{transform:translateY(-2px);border-color:var(--gold)}
.real b{font-family:var(--f-brand);font-weight:800;font-size:20px}
.real span{display:block;font-size:12px;color:var(--muted)}

/* ---------- 시험지 ---------- */
.desk{padding-block:8px 0}
.sheet{background:var(--paper);color:var(--paper-ink);font-family:var(--f-paper);font-size:15px;line-height:1.75;border:1px solid #cfc6b3;box-shadow:0 1px 0 rgba(0,0,0,.05),0 12px 28px -12px rgba(62,42,20,.35);padding:28px 28px 24px;position:relative;margin-bottom:20px}
.sheet + .sheet{margin-top:4px}
.ph{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding-bottom:6px}
.lv{display:flex;align-items:flex-end;gap:2px}
.lv .num{width:62px;height:62px;border-radius:50%;background:#111;color:#fff;font:900 50px/62px var(--f-head);text-align:center}
.lv .gb{font:900 30px/1 var(--f-head);margin-bottom:2px}
.ttl{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.ttl .t1{font:700 21px/1.3 var(--f-paper);letter-spacing:.5px;text-align:center}
.ttl .t2{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;font:700 16px/1.4 var(--f-paper)}
.ttl .t2 span{display:inline-flex;align-items:baseline;gap:6px}
.hand{font-family:var(--f-hand);font-weight:400;color:var(--pencil);font-size:24px;line-height:1}
.dbl{border-top:3px solid var(--paper-rule);border-bottom:1px solid var(--paper-rule);height:6px;margin-bottom:10px}
.p2h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;border-bottom:1.5px solid var(--paper-rule);padding-bottom:6px}
.p2h span{border:1.5px solid var(--paper-rule);padding:1px 10px;font-weight:700;font-size:14px}
.cols{column-count:2;column-gap:28px;column-rule:1px solid var(--paper-rule)}
.intro{margin:0 0 10px;padding-left:18px;text-indent:-18px}
.box{break-inside:avoid;border:1.5px solid var(--paper-rule);padding:4px 12px;margin:12px 0 10px;font-weight:700;font-size:14.5px;letter-spacing:.3px}
.q{break-inside:avoid;margin:0 0 12px;position:relative}
.q .hd{padding-left:24px;text-indent:-24px;position:relative}
.q .hd .bl,.q .hd .op-grid,.q .hd .op,.q .hd .op *{text-indent:0}
.q .n{font-weight:400;display:inline-block;min-width:22px;text-indent:0;position:relative}
.q .st{font-weight:400}
.q .st.hz{font-weight:600;font-size:17px}
.bl{white-space:nowrap;display:inline-block;min-width:54px;text-align:center;position:relative}
.bl.r{float:right}
.bl .hand{position:absolute;left:50%;top:50%;transform:translate(-50%,-55%);font-size:26px}
.op-grid{display:grid;gap:2px 10px;padding-left:18px;margin-top:2px}
.g4{grid-template-columns:repeat(4,max-content);column-gap:22px}
.g2{grid-template-columns:1fr 1fr}
.g1{grid-template-columns:1fr}
.inl{display:inline}
.inl .op-grid{display:inline-grid;padding-left:8px}
.hun .op-grid{grid-template-columns:repeat(2,minmax(0,9.5em));column-gap:18px;padding-left:0}
.hunrow{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.op{all:unset;cursor:pointer;display:inline-flex;align-items:baseline;gap:1px;position:relative;border-radius:4px;padding:0 3px;margin:0 -3px;transition:background-color .12s}
.op:hover{background:rgba(224,165,38,.18)}
.op:focus-visible{outline:2px solid var(--gold)}
.op .k{position:relative;display:inline-block;width:1.15em;text-align:center}
.op .tx{position:relative}
.op .hj{font-weight:600;font-size:16.5px}
.hun .op{display:flex;justify-content:space-between;gap:8px}
.hun .op .tx{display:flex;justify-content:space-between;flex:1;gap:8px}
.pen{position:absolute;pointer-events:none;overflow:visible}
.pen.pc{left:-5px;top:-3px;width:calc(100% + 10px);height:calc(100% + 6px)}
.pen path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.pen.pencil path{stroke:var(--pencil);stroke-width:1.7;opacity:.9}
.pen.red path{stroke:var(--redpen);stroke-width:2.6}
.mark{position:absolute;left:-14px;top:-10px;width:44px;height:44px;pointer-events:none}
.mark path{fill:none;stroke:var(--redpen);stroke-width:3;stroke-linecap:round}
.fix{font-family:var(--f-hand);color:var(--redpen);font-size:24px;line-height:1;margin-left:4px;white-space:nowrap}
.exp{margin:6px 0 0 18px;border-left:3px solid var(--redpen);padding:4px 10px;font-family:var(--f-body);font-size:13.5px;line-height:1.55;color:#5a2a26;background:#FFF1EE}
.exp b{color:var(--redpen);font-weight:400;font-family:var(--f-hand);font-size:20px;margin-right:4px}
.src{font-family:var(--f-body);font-size:11px;color:#8a8a8a;margin-left:6px;white-space:nowrap}
.cont{text-align:right;margin-top:8px;font-weight:700;font-size:14px}
.fin{text-align:right;margin-top:12px;font-weight:700}
.score-mark{position:absolute;right:22px;top:14px;transform:rotate(-8deg);pointer-events:none;text-align:center;color:var(--redpen);font-family:var(--f-hand);line-height:.9}
.score-mark b{display:block;font-size:64px;font-weight:400}
.score-mark span{font-size:26px}
.score-mark svg{position:absolute;left:-18px;top:-12px;width:calc(100% + 36px);height:calc(100% + 24px)}
.score-mark path{fill:none;stroke:var(--redpen);stroke-width:3}
.stampx{position:absolute;right:130px;top:24px;border:3px double var(--redpen);color:var(--redpen);font:900 18px/1 var(--f-head);padding:6px 10px;transform:rotate(-12deg);letter-spacing:3px;opacity:.9;background:rgba(255,255,255,.4)}
@media (prefers-reduced-motion:no-preference){
  .graded .mark path,.graded .score-mark path{stroke-dasharray:200;stroke-dashoffset:200;animation:draw .5s ease-out forwards}
  .pen.pencil path{stroke-dasharray:160;stroke-dashoffset:160;animation:draw .28s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .stampx{animation:stamp .4s cubic-bezier(.2,1.6,.4,1) both .3s}
  @keyframes stamp{from{transform:rotate(-12deg) scale(1.8);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:.9}}
}
/* 하단 답안 바 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--panel);border-top:2px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.dock .in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dock .meter{flex:1;min-width:120px;display:flex;flex-direction:column;gap:4px}
.dock .meter small{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog{height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold);transform-origin:left;transition:transform .25s}
.dock .btn{padding:8px 14px;font-size:16px}
/* OMR */
.scrim{position:fixed;inset:0;background:rgba(30,20,8,.5);display:grid;place-items:end center;z-index:30;padding:16px}
@media (min-width:640px){.scrim{place-items:center}}
.sheetm{width:100%;max-width:620px;background:var(--panel);border-radius:var(--r-l);padding:20px 16px;display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow:auto}
.omr{background:#FFF5F3;border:2px solid #E05A4F;border-radius:6px;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:2px 12px;color:#B8342B;font-family:var(--f-head)}
.omr .r{display:flex;align-items:center;gap:4px;font-size:13px;border-bottom:1px dotted #E9A29B;padding:3px 0}
.omr .r em{font-style:normal;width:22px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.omr button{all:unset;cursor:pointer;width:20px;height:26px;border:1.4px solid #D9534A;border-radius:10px;display:grid;place-items:center;font-size:10px;color:#C8453C}
.omr button.on{background:#1b1b1b;border-color:#1b1b1b;color:#1b1b1b}
.omr button:focus-visible{outline:2px solid var(--gold)}
.omr .r.w em{color:#fff;background:var(--redpen);border-radius:4px}
textarea,input[type=text]{width:100%;border:2px solid var(--line);border-radius:var(--r-m);padding:12px;font:inherit;background:var(--desk);color:var(--ink)}
.preview{max-height:30vh;overflow:auto;white-space:pre-wrap;font-size:14px;background:var(--desk);border-radius:var(--r-m);padding:12px;margin:0;border:1.5px dashed var(--line)}
/* 결과 패널 */
.result{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:96px;height:96px;border-radius:50%;border:4px double var(--red);color:var(--red);display:grid;place-items:center;font-family:var(--f-brand);font-weight:800;font-size:34px;transform:rotate(-8deg)}
.ring.pass{border-color:var(--green);color:var(--green)}
.bars{display:flex;flex-direction:column;gap:6px}
.brow{display:grid;grid-template-columns:96px 1fr 44px;gap:8px;align-items:center;font-size:14px}
.btrack{height:10px;border-radius:999px;background:var(--red-soft);overflow:hidden}
.btrack i{display:block;height:100%;background:var(--green);transform-origin:left}
.brow .v{text-align:right;font-variant-numeric:tabular-nums}
/* 오답노트·엄마판 */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.wlist{display:flex;flex-direction:column;gap:12px}
.witem{background:var(--panel);border:2px solid var(--line);border-radius:var(--r-m);padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.witem .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.witem .srcx{font-family:var(--f-disp);color:var(--red)}
.badge{font-size:12px;border:1.5px solid currentColor;border-radius:999px;padding:0 8px}
.badge.m{color:var(--red)}.badge.f{color:var(--green)}.badge.t{color:var(--muted)}
.witem .qq{font-family:var(--f-paper);font-size:17px}
.ans{display:flex;gap:16px;flex-wrap:wrap;font-size:15px}
.ans .mine{color:var(--red);text-decoration:line-through}
.ans .cor{color:var(--green);font-weight:700}
.ex-t{font-size:14px;color:var(--muted);margin:0}
.rep .top{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.mini{width:56px;height:56px;border-radius:50%;border:3px double var(--red);color:var(--red);display:grid;place-items:center;font-family:var(--f-brand);font-weight:800;font-size:20px;transform:rotate(-8deg)}
.mini.pass{border-color:var(--green);color:var(--green)}
.new{font-size:12px;background:var(--red);color:#fff;border-radius:999px;padding:0 8px}
.msg{background:var(--gold-soft);border-radius:var(--r-m);padding:8px 12px;margin:0}
/* 분석 */
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th,.table td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.table th{font-family:var(--f-disp);font-weight:400;color:var(--muted)}
.tw{overflow-x:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:4px 8px;display:flex;flex-direction:column;align-items:center;min-width:64px}
.chip b{font-family:var(--f-paper);font-size:22px;font-weight:700;line-height:1.2}
.chip span{font-size:11px;color:var(--muted)}
.chip i{font-style:normal;font-size:11px;color:var(--red)}
.gen{color:var(--green)} .mix{color:var(--gold)}

"信用",["언용","언주","신용","신주"],3,"◎信用(신용):「1」사람이나 사물이 틀림없다고믿어 의심하지 아니함. 또는 그런 믿음성의 정도. 「2」『경제』거래한 재화의 대가를 앞으로 치를 수있음을 보이는 능력. 외상값, 빚, 급부 따위를 감당할 수 있는 지급 능력으로 소유 재산의 화폐적 기능을이른다."],["言語",["언오","언어","어언","언문"],2,"◎言語(언어): 생각, 느낌 따위를 나타내거나 전달하는 데에 쓰는 음성, 문자 따위의 수단. 또는 그음성이나 문자 따위의 사회 관습적인 체계."],["銀魚",["북어","한어","인어","은어"],4,"◎銀魚(은어): 바다빙엇과의 민물고기. 몸의 길이는 20～30cm이고 모양이 가늘고 길며, 어두운 녹황색 바탕에 배 쪽으로 갈수록 연한 흰색이고 눈 위는 누런색, 위턱은 흰색, 아래턱은 녹색이다."],["不急",["불황","불응","불급","불심"],3,"◎不急(불급):「1」속도 따위가 빠르지 아니함. 「2」일 따위가 긴급하지 아니함."],["古詩",["고시","명시","고론","명론"],1,"◎古詩(고시): 고대의 시. 한시(漢詩)에서는 주로 후한 이전의 시, 시경(詩經)이나 문선(文選)에 딸린시를 이른다."],["分明",["일월","월명","분백","분명"],4,"◎分明(분명): 틀림없이 확실하게."],["開所",["문소","폐소","개소","개근"],3,"◎開所(개소): 사무소나 연구소 따위와 같이 이름이 ‘소(所)’ 자로 끝나는 기관을 세워 처음으로 일을 시작함. 또는 그런 기관이 하루의 업무를 시작함."],["英才",["영재","양촌","양재","영수"],1,"◎英才(영재): 뛰어난 재주. 또는 그런 사람."],["日新",["날과 때","날마다 새로워짐","며칠 전","한 가지의 이치"],2,"◎日新(일신)."],["東海",["간절히 그리워함","같은 나라","동쪽에 있는 바다","겨울 바다"],3,"◎東海(동해)."],["首位",["경비 아저씨","물의 높이","머리에 들어있는 지식이 많음","첫째가는 자리나 우두머리가 되는 자리"],4,"◎首位(수위)."],["당면: 일이 바로 눈앞에 닥침.",["當目","長目","長面","當面"],4,""],["직선: 꺾이거나 굽은 데가 없는 곧은 선.",["植線","直線","植成","直成"],2,""],["선금: 무엇을 사거나 세낼 때에 먼저 치르는 돈.",["先金","大金","十金","千金"],1,""],["<u>白米</u>와(과) 잡곡을 적절하게 섞어 먹는 것이 좋다.",["백야","백옥","백미","일미"],3,"◎白米(백미): 흰쌀."],["<u>民話</u>에는 서민의 의식이 반영되어 있다.",["인화","동화","언어","민화"],4,"◎民話(민화): 민간에 전해 내려오는 옛날이야기."],["컴퓨터로 <u>文書</u> 작성을 하였다.",["문서","언서","문화","독회"],1,"◎文書(문서): 글이나 기호 따위로 일정한 의사나 관념 또는 사상을 나타낸 것."],["친구들과 <u>校門</u> 앞에서 만나기로 하였다.",["교문","정문","학교","교정"],1,"◎校門(교문): 학교의 문."],["부모님의 <u>의견</u>에 따르다.",["衣見","意見","衣身","意身"],2,"◎意見(의견): 어떤 대상에 대하여 가지는 생각."],["그는 <u>매사</u>에 신중한 성격이다.",["毛市","每事","毛事","每市"],2,"◎每事(매사):「명사」하나하나의 모든 일.「부사」하나하나의 일마다."],["<u>차도</u>로 걸어 다니는 것은 위험한 일이다.",["道車","車馬","馬車","車道"],4,"◎車道(차도): 찻길. 사람이 다니는 길 따위와 구분하여 자동차만 다니게 한 길."],["비슷한 뜻의 한자로 이루어진 어휘는?",["自力","會社","南向","南北"],2,"◎會社(회사, 모일 회․모일 사): 상행위 또는 그밖의 영리 행위를 목적으로 하는 사단 법인. 이는 서로 비슷한 뜻의 한자로 이루어진 ‘유사병렬관계’이다. ◎自力(자력, 스스로 자·힘 력): 자기 혼자의 힘. ◎南向(남향, 남녘 남․향할 향): 남쪽으로 향함. 또는 그 방향."],["‘一代’의 유의어는?",["一世","一生","一家","一同"],1,"◎一代(일대): 한 시대나 한 세대 전체. = ◎一世(일세):「1」한 사람의 일생.「2」한 시대나 한 세대. / = ◎一生(일생): 세상에 태어나서 죽을 때까지의 동안. ◎一生一代(일생일대): 한 사람이 나서 죽을 때까지의 동안. ◎一生一大(일생일대): 일생을 통하여가장 중요함을 이르는 말."],["‘入口’의 반의어는?",["八口","人口","出口","食口"],3,"◎入口(입구): 들어가는 통로. ↔ ◎出口(출구):밖으로 나갈 수 있는 통로."],["“死後功名”의 속뜻으로 알맞은 것은?",["죽은 뒤에 내리는 벼슬","공적인 일을 뒤에 함","산과 물을 좋아함","죽을 고비를 여러 차례 겪음"],1,"◎死後功名(사후공명): 죽은 뒤에 내리는 벼슬이나 시호(諡號)."],["“부모님께 행해야 할 덕목”으로 가장 알맞은 것은?",["學","孝","友","永"],2,"◎孝(효도 효)."],["우리나라의 전통 놀이가 <u>아닌</u> 것은?",["널뛰기","윷놀이","연날리기","빙고게임"],4,""]]},{"id":"81","t":"제81회","ty":"가형","off":true,"qs":[["米",["일만 만","쌀 미","학교 교","농사 농"],2,"◎萬(일만 만), 校(학교 교), 農(농사 농)."],["友",["벗 우","가을 추","무거울 중","아우 제"],1,"◎秋(가을 추), 重(무거울 중), 弟(아우 제)."],["區",["안 내","향할 향","나눌 구","서녘 서"],3,"◎內(안 내), 向(향할 향), 西(서녘 서)."],["對",["다닐 행","수건 건","대답 답","대답할 대"],4,"◎行(다닐 행), 巾(수건 건), 答(대답 답)."],["信",["몸 신","믿을 신","편안할 안","말씀 언"],2,"◎身(몸 신), 安(편안할 안), 言(말씀 언)."],["意",["한가지 동","화할 화","뜻 의","죽을 사"],3,"◎同(한가지 동), 和(화할 화), 死(죽을 사)."],["竹",["대 죽","자리 위","세상 세","여섯 륙"],1,"◎位(자리 위), 世(세상 세), 六(여섯 륙)."],["部",["나눌 분","줄 선","가운데 앙","거느릴 부"],4,"◎分(나눌 분), 線(줄 선), 央(가운데 앙)."],["공 공",["功","共","軍","牛"],1,"◎共(함께 공), 軍(군사 군), 牛(소 우)."],["칼 도",["石","九","利","刀"],4,"◎石(돌 석), 九(아홉 구), 利(이로울 리)."],["때 시",["時","別","來","古"],1,"◎別(다를 별), 來(올 래), 古(예 고)."],["겨울 동",["工","開","冬","等"],3,"◎工(장인 공), 開(열 개), 等(무리 등)."],["갈 거",["士","去","千","才"],2,"◎士(선비 사), 千(일천 천), 才(재주 재)."],["온전할 전",["前","命","全","林"],3,"◎前(앞 전), 命(목숨 명), 林(수풀 림)."],["클 태",["元","央","活","太"],4,"◎元(으뜸 원), 央(가운데 앙), 活(살 활)."],["‘사람 인’에 ‘나무 목’을 합친 자로 ‘쉬다’는 뜻의 한자는?",["木","休","植","男"],2,"◎休(쉴 휴)."],["“박물관으로 <u>見</u>學을 갔다”에서 밑줄 친 ‘見’의 훈음으로 가장 알맞은 것은?",["만날 현","지금 현","당할 견","볼 견"],4,"◎見(견․현): 볼, 보일, 당할, 견해 (견) / 보일, 소개할, 만날, 현재, 지금 (현). ◎見學(견학): 실지(實地)로 보고 학식(學識)을 넓힘."],["“靑<u>年</u>”에서 밑줄 친 ‘年’의 훈음으로 가장 알맞은 것은?",["나이 년","끌 연","그럴 연","익을 년"],1,"◎年(년, 연·녕, 영): 나이, 해, 때, 시대, 새해, 신년, 연령, 잘 익은 오곡, 콧마루, 사격의 하나, 사람이름, 익다, 오곡이 잘 익다. (년, 연) / 아첨하다 (녕, 영). ◎靑年(청년):「1」신체적ㆍ정신적으로 한창 성장하거나 무르익은 시기에 있는 사람.「2」성년 남자."],["‘事’을(를) 자전에서 찾을 때의 방법으로 바르지 <u>않은</u> 것은?",["총획으로 찾을 때는 ‘8획’에서 찾는다.","부수로 찾을 때는 ‘亅’부수 7획에서 찾는다.","부수로 찾을 때는 ‘一’부수 7획에서 찾는다.","자음으로 찾을 때는 ‘사’음에서 찾는다."],3,"◎事(일 사): 亅(갈고기 궐, 1획)부수의 7획, 총8획."],["‘社’의 유의자는?",["科","會","計","月"],2,"◎社(모일 사) = 會(모일 회)."],["‘南’의 반의자는?",["方","西","四","北"],4,"◎南(남녘 남) ↔ 北(북녘 북)."],["“□聞□讀”에서 □안에 공통으로 들어갈 알맞은 한자는?",["每","目","室","多"],4,"◎多聞多讀(다문다독): 많이 듣고, 많이 읽음."],["英國",["영왕","영작","영국","훈국"],3,"◎英國(영국): 유럽 서부 대서양 가운데 있는 입헌 군주국."],["漢江",["한성","한강","탄강","탄성"],2,"◎漢江(한강): 우리나라 중부를 흐르는 강. 태백산맥에서 시작하여 황해로 흘러든다. 북한강ㆍ남한강의 두 물줄기가 남양주시에서 합류하며, 이 유역은 삼국 시대부터 중요시되어 왔다."],["神話",["신화","신언","시화","심화"],1,"◎神話(신화):「1」『문학』고대인의 사유나 표상이 반영된 신성한 이야기. 우주의 기원, 신이나 영웅의 사적(事績), 민족의 태고 때의 역사나 설화 따위가 주된 내용이다.「2」신비스러운 이야기."],["詩文",["언문","시문","작문","시어"],2,"◎詩文(시문): 시가와 산문을 아울러 이르는 말."],["交通",["개통","원활","교통","소통"],3,"◎交通(교통):「1」자동차ㆍ기차ㆍ배ㆍ비행기 따위를 이용하여 사람이 오고 가거나, 짐을 실어 나르는 일.「2」서로 오고 감. 또는 소식이나 정보를 주고받음.「3」나라 사이에 관계를 맺어 오고 가고 함."],["新書",["신서","신련","신도","새해"],1,"◎新書(신서): 새로 나온 책."],["敎理",["서리","교리","학리","수리"],2,"◎敎理(교리): 종교적인 원리나 이치. 각 종교의 종파가 진리라고 규정한 신앙의 체계를 이른다."],["不便",["불사","불신","불편","부편"],3,"◎不便(불편):「1」어떤 것을 사용하거나 이용하는 것이 거북하거나 괴로움.「2」몸이나 마음이 편하지 아니하고 괴로움.「3」다른 사람과의 관계 따위가 편하지 않음."],["東海",["차매","차해","동매","동해"],4,"◎東海(동해):「1」동쪽에 있는 바다.「2」『지명』우리나라 동쪽의 바다. 우리나라와 러시아의 연해주, 일본 열도 사이에 있는 바다를 이른다. 대한 해협으로부터 난류가 올라오고 연해주로부터 한류가 내려와 만나기 때문에 여러 종류의 물고기가 산다."],["花田",["꽃앞","논밭을 갊","꽃밭","풀과 나무"],3,"◎花田(화전)."],["合班",["반을 다시 나눔","둘 이상의 학급을 합침","깨어진 옥을 다시 붙임","둘 이상의 학급을 반으로 나눔"],2,"◎合班(합반)."],["强弱",["강함과 약함","힘이 센 사람","강자가 약자를 괴롭힘","약자가 강자를 이김"],1,"◎强弱(강약)."],["지형: 땅의 생긴 모양이나 형세.",["土形","地向","地形","土向"],3,""],["당직: 근무하는 곳에서 숙직이나 일직 따위의 당번이 됨. 그런 차례가 된 사람.",["萬直","當直","萬色","當色"],2,""],["영주: 한곳에 오래 삶.",["水主","永主","水住","永住"],4,""],["누구에게나 <u>長短</u>점은 있기 마련이다.",["호감","수단","장단","장수"],3,"◎長短(장단):「1」길고 짧음.「2」장단점."],["<u>先祖</u>들의 뜻을 받들다.",["선사","선조","조부","증조"],2,"◎先祖(선조): 먼 윗대의 조상."],["끝없이 펼쳐진 <u>草原</u> 위에 소떼들이 풀을 뜯고 있다.",["초원","평지","평원","초지"],1,"◎草原(초원):「1」풀이 나 있는 들판.「2」『지리』초본 식물 위주로 이루어진 식물 군락. 습기가 많거나, 저온이고 건조하여 환경 조건이 나쁘며, 삼림을 이룰 수 없는 곳에 분포한다. 육생 초원, 수생 초원 등으로 구분되고 온대의 스텝ㆍ프레리, 열대의 사바나 등이 있다."],["에너지를 외부로 <u>放出</u>한다.",["송출","방면","송면","방출"],4,"◎放出(방출):「1」비축하여 놓은 것을 내놓음.「2」 『물리』입자나 전자기파의 형태로 에너지를 내보냄."],["아버지는 <u>노후</u>를 편안히 보내고 계신다.",["老後","孝後","孝子","老少"],1,"◎老後(노후): 늙어진 뒤."],["우리 선수단이 <u>기수</u>를 앞세우고 입장하였다.",["記首","旗首","旗手","記手"],3,"◎旗手(기수):「1」행사 때 대열의 앞에 서서 기를 드는 일을 맡은 사람.「2」기를 들고 신호하는 일을 맡은 사람."],["허파에 <u>공동</u>이 생겼다.",["空洞","京同","京洞","空同"],1,"◎空洞(공동):「1」아무것도 없이 텅 비어 있는 굴.「2」아무것도 없이 텅 빈 큰 골짜기.「3」물체 속에 아무것도 없이 빈 것. 또는 그런 구멍.「4」『의 학』상하거나 염증을 일으킨 조직이 밖으로 배출되거나 흡수되어 장기(臟器)에 생긴 빈 공간."],["앞 글자가 뒤 글자를 꾸며주는 어휘가 <u>아닌</u> 것은?",["人性","本末","火力","兄夫"],2,"◎人性(인성, 사람 인·성품 성): 사람의 성품. ◎火力(화력, 불 화·힘 력): 불이 탈 때에 내는 열의 힘. ◎兄夫(형부, 맏 형·지아비 부): 언니의 남편을 이르거나 부르는 말. 이상은 모두 앞 글자가 뒤 글자를 꾸며주는 ‘수식관계’이다. ◎本末(본말, 근본 본·끝말): 사물이나 일의 처음과 끝."],["‘名門’의 유의어는?",["名答","名分","名物","名家"],4,"◎名門(명문):「1」이름 있는 문벌. 또는 훌륭한집안.「2」이름난 좋은 학교. = ◎名家(명가):「1」명망이 높은 가문.「2」어떤 전문 분야에서 이름이 난사람. 또는 그런 집."],["‘上衣’의 반의어는?",["白衣","玉衣","下衣","內衣"],3,"◎上衣(상의): 윗옷. 위에 입는 옷. ↔ ◎下衣(하의): 아래옷. 아래에 입는 옷."],["“一日三秋”의 속뜻으로 알맞은 것은?",["삼십년 세월을 이르는 말","몹시 애태우며 기다림을 이르는 말","세월의 흐름이 빠르다는 말","시간을 헛되이 보내지 말라는 말"],2,"◎一日三秋(일일삼추): 하루가 삼 년 같다는 뜻으로, 몹시 애태우며 기다림을 이르는 말."],["한자문화권에 속하지 않는 나라는?",["미국","한국","일본","중국"],1,""],["전화를 받는 예절로 바르지 <u>않은</u> 것은?",["메모를 준비하고 용건을 듣는다.","부드럽고 밝은 목소리로 받는다.","잘못 걸린 전화의 경우 화를 낸다.","상대방을 존중해 공손하게 받는다."],3,""]]},{"id":"82","t":"제82회","ty":"가형","off":true,"qs":[["永",["날 출","모 방","길 영","화할 화"],3,"◎出(날 출), 方(모 방), 和(화할 화)."],["半",["낮 오","쌀 미","절반 반","소 우"],3,"◎午(낮 오), 米(쌀 미), 牛(소 우)."],["前",["친할 친","뒤 후","무리 등","앞 전"],4,"◎親(친할 친), 後(뒤 후), 等(무리 등)."],["頭",["곧을 직","주인 주","읽을 독","머리 두"],4,"◎直(곧을 직), 主(주인 주), 讀(읽을 독)."],["首",["길 도","수건 건","피 혈","머리 수"],4,"◎道(길 도), 巾(수건 건), 血(피 혈)."],["答",["오를 등","걸음 보","남녘 남","대답 답"],4,"◎登(오를 등), 步(걸음 보), 南(남녘 남)."],["書",["글 서","낮 주","글월 문","세상 세"],1,"◎晝(낮 주), 文(글월 문), 世(세상 세)."],["來",["올 래","털 모","수풀 림","평평할 평"],1,"◎毛(털 모), 林(수풀 림), 平(평평할 평)."],["빌 공",["所","空","無","向"],2,"◎所(바 소), 無(없을 무), 向(향할 향)."],["다스릴 리",["理","利","弟","食"],1,"◎利(이로울 리), 弟(아우 제), 食(먹을 식)."],["들을 문",["問","每","面","聞"],4,"◎問(물을 문), 每(매양 매), 面(낯 면)."],["소리 음",["音","貝","百","小"],1,"◎貝(조개 패), 百(일백 백), 小(작을 소)."],["가르칠 교",["强","校","左","敎"],4,"◎强(강할 강), 校(학교 교), 左(왼 좌)."],["으뜸 원",["七","元","末","口"],2,"◎七(일곱 칠), 末(끝 말), 口(입 구)."],["기를 육",["育","形","休","植"],1,"◎形(모양 형), 休(쉴 휴), 植(심을 식)."],["자식이 늙은 부모를 업고 있는 모양으로 어버이를 잘 모시고 섬김의 뜻을 나타내는 한자는?",["孝","見","開","班"],1,"◎孝(효도 효)."],["“靑<u>少</u>年”에서 밑줄 친 ‘少’의 훈음으로 알맞은 것은?",["줄 소","젊을 소","약간 소","조금 소"],2,"◎少(소): 적다, 많지 아니하다, 작다, 줄다, 적어지다, 적다고 여기다, 부족하다고 생각하다, 젊다, 비난하다, 헐뜯다, 경멸하다, 빠지다, 젊은이, 어린이, 버금, 장에 버금가는 벼슬에 붙이는 말, 잠시, 잠깐, 조금 지난 뒤에. ◎靑少年(청소년): 청년과 소년을 아울러 이르는 말."],["밑줄 친 “十”의 독음이 <u>다른</u> 것은?",["<u>十</u>日","<u>十</u>月","<u>十</u>萬","二<u>十</u>"],2,"◎十(십): 열, 열 번, 열 배, 전부, 일체, 완전, 열배하다 (십). ◎十日(십일): 그 달의 열째 날. 열 날. ◎十萬(십만): 만의 열 배가 되는 수. 또는 그런 수의. ◎二十(이십): 십의 두 배가 되는 수. 이상은 모두‘十’의 독음이 ‘십’이다."],["‘京’을(를) 자전에서 찾을 때의 방법으로 바른 것은?",["부수로 찾을 때는 ‘口’ 부수 5획에서 찾는다.","부수로 찾을 때는 ‘小’ 부수 5획에서 찾는다.","부수로 찾을 때는 ‘亠’ 부수 6획에서 찾는다.","자음으로 찾을 때는 ‘영’음에서 찾는다."],3,"◎京(서울 경): 亠(돼지해머리, 2획)부수의 6획, 총8획."],["‘便’의 유의자는?",["成","自","友","安"],4,"◎便(편할 편) = 安(편안할 안)."],["‘遠’의 반의자는?",["神","放","別","近"],4,"◎遠(멀 원) ↔ 近(가까울 근)."],["“□魚, 水□, □色”에서 □안에 공통으로 들어갈 알맞은 한자는?",["位","銀","用","玉"],2,"◎銀魚(은어):『동물』바다빙엇과의 민물고기. 몸의 길이는 20∼30cm이고 모양이 가늘고 길며, 어두운 녹황색 바탕에 배 쪽으로 갈수록 연한 흰색이고눈 위는 누런색, 위턱은 흰색, 아래턱은 녹색이다. 어릴 때에는 바다에서 지내고 이른 봄에 강을 거슬러올라 급류에서 살다가 다시 하류로 가 알을 낳는다."],["詩人",["언사","사인","시사","시인"],4,"◎詩人(시인): 시를 전문적으로 짓는 사람."],["共同",["공동","광동","공통","광통"],1,"◎共同(공동): 둘 이상의 사람이나 단체가 함께일을 하거나, 같은 자격으로 관계를 가짐."],["立冬",["육각","입각","입동","입춘"],3,"◎立冬(입동): 이십사절기의 하나. 상강(霜降)과 소설(小雪) 사이에 들며, 이때부터 겨울이 시작된다고한다. 11월 8일경이다."],["太祖",["대구","태구","대조","태조"],4,"◎太祖(태조): 한 왕조를 세운 첫째 임금에게 붙이던 묘호."],["古物",["고물","구물","구문","고문"],1,"◎古物(고물):「1」옛날 물건.「2」헐거나 낡은 물건.「3」쓸모없이 된 사람을 비유적으로 이르는 말."],["不時",["공사","불시","공시","동사"],2,"◎不時(불시):「1」제철이 아닌 때.「2」뜻하지 아니한 때."],["計上",["허상","십상","계상","개상"],3,"◎計上(계상): 계산하여 올림."],["通信",["송신","소통","통신","소신"],3,"◎通信(통신):「1」소식을 전함.「2」우편이나 전신, 전화 따위로 정보나 의사를 전달함.「3」신문이나잡지에 실을 기사의 자료를 보냄. 또는 그 자료.「4」 『통신』정보 전달을 다루는 과학 기술."],["肉重",["내종","육종","내동","육중"],4,"◎肉重(육중): 투박하고 무거움."],["民意",["국민의 의사","신하는 의리가 있어야 함","의지가 강한 사람","백성의 의사가 반영이 안 됨"],1,"◎民意(민의)."],["火急",["불에 익힌 음식을 먹음","사물의 가장 중요한 곳","급한 일을 알리는 전보","걷잡을 수 없이 타는 불과 같이 매우 급함"],4,"◎火急(화급)."],["明月",["초하루에 뜨는 달","지난달","밝은 달","달 그림자"],3,"◎明月(명월)."],["전선: 전류가 흐르도록 하는 도체로서 쓰는 선.",["電線","電先","全線","全先"],1,""],["초본: 시문의 초를 잡음. 또는 그런 원고.",["草木","草本","原木","原本"],2,""],["천성: 선천적으로 타고난 성질.",["天性","千性","千姓","天姓"],1,""],["우리나라는 태평양의 <u>北西</u>쪽에 있다.",["남동","북동","북서","남서"],3,"◎北西(북서): 북서쪽. 북쪽을 기준으로 북쪽과서쪽 사이의 방위."],["<u>秋夜</u>에 달이 밝다.",["춘외","추야","추외","주야"],2,"◎秋夜(추야): 가을밤. 가을철의 밤."],["이번 주 청소 <u>當番</u>은(는) 내 차례다.",["친척","당반","친구","당번"],4,"◎當番(당번): 어떤 일을 책임지고 돌보는 차례가 됨. 또는 그 차례가 된 사람."],["그는 <u>學生</u>들에게 역사를 가르친다.",["학생","교생","학도","학우"],1,"◎學生(학생):「1」학예를 배우는 사람.「2」학교에 다니면서 공부하는 사람.「3」생전에 벼슬을 하지아니하고 죽은 사람의 명정, 신주, 지방 따위에 쓰는 존칭.「4」『역사』신라 때에, 국학에서 가르침을 받던 사람."],["내가 좋아하는 <u>과목</u>은 한문이다.",["科目","耳木","科木","耳目"],1,"◎科目(과목): 가르치거나 배워야 할 지식 및 경험의 체계를 세분하여 계통을 세운 영역."],["경찰의 수사는 다시 <u>활기</u>를 띠었다.",["活己","活旗","活記","活氣"],4,"◎活氣(활기): 활동력이 있거나 활발한 기운."],["그는 시골마을 <u>촌장</u>으로 추대되었다.",["才長","寸場","村長","村場"],3,"◎村長(촌장): 한 마을의 우두머리."],["앞 글자가 뒤 글자를 꾸며주는 어휘는?",["水火","洞里","朝夕","竹馬"],4,"◎水火(수화): 물과 불. ◎洞里(동리):「1」마을. 「2」지방 행정 구역의 최소 구획인 동(洞)과 이(里) 를 아울러 이르는 말. ◎朝夕(조석): 아침과 저녁을 아울러 이르는 말. 이상은 모두 ‘병렬 관계’이다. ◎竹馬(죽마): 대말."],["‘女子’의 반의어는?",["男子","男女","母子","父子"],1,"◎女子(여자):「1」여성으로 태어난 사람.「2」한남자의 아내나 애인을 이르는 말. ↔ ◎男子(남자):「1」남성으로 태어난 사람.「2」한 여자의 남편이나애인을 이르는 말."],["‘室內’의 유의어는?",["內外","家內","室外","家外"],2,"◎室內(실내): 방이나 건물 따위의 안. = ◎家內(가내): 집안. 가족을 구성원으로 하여 살림을 꾸려나가는 공동체. 또는 가까운 일가."],["“一口二言”의 속뜻으로 알맞은 것은?",["스스로 묻고 스스로 대답함","한 번 물음에 대하여 한 번 대답함","한 가지 일에 대하여 말을 이랬다저랬다 함","변명할 말이 없거나 변명을 못함을 이르는 말"],3,"◎一口二言(일구이언): 한 입으로 두 말을 한다는 뜻으로, 한 가지 일에 대하여 말을 이랬다저랬다함을 이르는 말."],["우리의 민속 명절이 <u>아닌</u> 것은?",["단오","성탄절","대보름","한식"],2,"◎단오: 우리나라 명절의 하나. 음력 5월 5일로, 단오떡을 해 먹고 여자는 창포물에 머리를 감고 그네를 뛰며 남자는 씨름을 한다. ◎대보름: 음력 정월보름날을 명절로 이르는 말. 새벽에 귀밝이술을 마시고 부럼을 깨물며 약밥, 오곡밥 따위를 먹는다. ◎한식: 우리나라 명절의 하나."],["평소 예절의 실천으로 바르지 <u>않은</u> 것은?",["장난삼아 친구에게 발을 걸어 넘어뜨린다.","전화를 잘못 걸었을 때에는 정중히 사과한다.","상대방의 인격을 존중하고 겸손한 태도를 갖는다.","상대방에게 이야기할 때에는 알아듣기 좋은 속도로 이야기한다."],1,""]]},{"id":"83","t":"제83회","ty":"가형","off":true,"qs":[["交",["벗 우","양 양","사귈 교","머리 수"],3,"◎友(벗 우), 羊(양 양), 首(머리 수)."],["記",["있을 유","장인 공","성씨 성","기록할 기"],4,"◎有(있을 유), 工(장인 공), 姓(성씨 성)."],["直",["날 일","곧을 직","쌀 미","수건 건"],2,"◎日(날 일), 米(쌀 미), 巾(수건 건)."],["京",["빛 광","예 고","서울 경","소리 음"],3,"◎光(빛 광), 古(예 고), 音(소리 음)."],["急",["급할 급","짧을 단","겨울 동","대답 답"],1,"◎短(짧을 단), 冬(겨울 동), 答(대답 답)."],["利",["가을 추","마을 촌","대신할 대","이로울 리"],4,"◎秋(가을 추), 村(마을 촌), 代(대신할 대)."],["別",["때 시","다를 별","놓을 방","강할 강"],2,"◎時(때 시), 放(놓을 방), 强(강할 강)."],["示",["보일 시","털 모","조개 패","근본 본"],1,"◎毛(털 모), 貝(조개 패), 本(근본 본)."],["걸음 보",["銀","步","朝","夏"],2,"◎銀(은 은), 朝(아침 조), 夏(여름 하)."],["긴 장",["長","物","身","電"],1,"◎物(물건 물), 身(몸 신), 電(번개 전)."],["살 주",["永","祖","主","住"],4,"◎永(길 영), 祖(할아비 조), 主(주인 주)."],["함께 공",["共","靑","世","明"],1,"◎靑(푸를 청), 世(세상 세), 明(밝을 명)."],["차례 번",["前","牛","魚","番"],4,"◎前(앞 전), 牛(소 우), 魚(물고기 어)."],["말씀 화",["近","話","班","漢"],2,"◎近(가까울 근), 班(나눌 반), 漢(한수 한)."],["각각 각",["各","命","石","民"],1,"◎命(목숨 명), 石(돌 석), 民(백성 민)."],["“입을 벌리고 노래를 부른다”는 데서 ‘노래하다, 읊조리다’의 뜻을 나타내는 한자는?",["自","家","歌","當"],3,"◎歌(노래 가)."],["“고려는 <u>開</u>國한 뒤에 도읍을 옮겼다”에서 밑줄 친 ‘開’의 훈음으로 알맞은 것은?",["열 개","다시 개","고칠 개","깨우칠 개"],1,"◎開(개): 열, 필, 펼, 개척할, 시작할, 깨우칠(개). ◎開國(개국):「1」새로 나라를 세움.「2」나라의 문호를 열어 다른 나라와 교류함."],["밑줄 친 ‘樂’의 독음이 <u>다른</u> 것은?",["和<u>樂</u>","<u>樂</u>水","行<u>樂</u>","道<u>樂</u>"],2,"◎樂(낙․락․악․요): 즐길, 즐거워할, 즐겁게할, 즐거움 (낙․락) / 노래, 풍류, 아뢸, 연주할 (악) / 좋아할 (요). ◎和樂(화락): 화평하고 즐거움. ◎行樂(행락): 재미있게 놀고 즐겁게 지냄. ◎道樂(도락):「1」도를 깨달아 스스로 즐기는 일.「2」재미나 취미로 하는 일."],["‘對’을(를) 자전에서 찾을 때의 방법으로 바른 것은?",["자음으로 찾을 때는 ‘도’음에서 찾는다.","총획으로 찾을 때는 ‘13획’에서 찾는다.","부수로 찾을 때는 ‘寸’ 부수 11획에서 찾는다.","부수로 찾을 때는 ‘玉’ 부수 10획에서 찾는다."],3,"◎對(대답할 대): 寸(마디 촌, 3획)부수의 11획, 총14획."],["‘洞’의 유의자는?",["字","里","中","時"],2,"◎洞(고을, 마을 동) = 里(마을 리)."],["‘先’의 반의자는?",["川","文","北","後"],4,"◎先(먼저 선) ↔ 後(뒤 후)."],["“大□, 育□, □立”에서 □안에 공통으로 들어갈 알맞은 한자는?",["農","末","成","植"],3,"◎大成(대성): 크게 이룸. 또는 그런 성과. ◎育成(육성): 길러 자라게 함. ◎成立(성립): 일이나 관계따위가 제대로 이루어짐."],["半旗",["반절","반기","분절","분기"],2,"◎半旗(반기): 조기. 조의를 표하기 위하여 깃봉에서 기의 한 폭만큼 내려서 다는 국기."],["百萬",["백만","백번","수백","수만"],1,"◎百萬(백만): 만의 백배가 되는 수."],["頭部",["두목","부두","두부","부수"],3,"◎頭部(두부):「1」동물의 머리가 되는 부분. 「2」어떤 물체의 위쪽 부분."],["空軍",["육지","육군","공지","공군"],4,"◎空軍(공군): 주로 공중에서 공격과 방어의 임무를 수행하는 군대."],["英語",["영어","잉어","영언","잉언"],1,"◎英語(영어): 인도ㆍ유럽 어족 게르만 어파의서게르만 어군에 속한 언어. 미국, 영국, 캐나다, 오스트레일리아 등을 비롯하여 세계 여러 나라에서 사용하는 국제어의 구실을 하고 있다."],["小邑",["소각","소읍","소식","소면"],2,"◎小邑(소읍): 주민과 산물이 적고 땅이 작은 고을."],["等位",["사위","사립","등위","등립"],3,"◎等位(등위):「1」등급.「2」같은 위치."],["男性",["여성","남성","역성","남생"],2,"◎男性(남성): 성(性)의 측면에서 남자를 이르는 말. 특히, 성년(成年)이 된 남자를 이른다."],["書面",["면전","면화","서원","서면"],4,"◎書面(서면):「1」글씨를 쓴 지면.「2」일정한내용을 적은 문서."],["所信",["믿음을 갖지 못함","성급한 믿음","자기가 믿고 생각하는 바","자신이 아끼는 물건"],3,"◎所信(소신)."],["重用",["치우침이 없음","용도에 맞지 않음","물건이 너무 무거움","중요한 자리에 임용함"],4,"◎重用(중용)."],["子弟",["남의 아들의 높임말","나이가 많은 사람","활동이 아주 적은 사람","스승에게 가르침을 받음"],1,"◎子弟(자제)."],["신입: 새로 들어옴.",["新入","親入","親八","新八"],1,""],["지구: 일정한 기준에 따라 여럿으로 나눈 땅의 한구획.",["地九","地區","土區","土九"],2,""],["야간: 밤사이. 밤 동안.",["夕間","夕聞","夜聞","夜間"],4,""],["<u>花草</u>에 물을 주니 더욱 생기가 났다.",["목초","약초","화초","수초"],3,"◎花草(화초): 꽃이 피는 풀과 나무 또는 꽃이 없더라도 관상용이 되는 모든 식물을 통틀어 이르는 말."],["내가 좋아하는 <u>科目</u>은(는) 수학이다.",["학과","과목","공부","분야"],2,"◎科目(과목): 가르치거나 배워야 할 지식 및 경험의 체계를 세분하여 계통을 세운 영역."],["오늘 친구들과 <u>會食</u>을(를) 하기로 했다.",["회합","토의","회식","토론"],3,"◎會食(회식): 여러 사람이 모여 함께 음식을 먹음. 또는 그런 모임."],["텃밭의 야채를 <u>市場</u>에 내다 팔았다.",["시장","광장","식당","식장"],1,"◎市場(시장):「1」여러 가지 상품을 사고파는 일정한 장소.「2」상품으로서의 재화와 서비스의 거래가 이루어지는 추상적인 영역."],["전쟁이 끝나고 <u>학교</u>가 다시 문을 열었다.",["孝敎","孝校","學敎","學校"],4,"◎學校(학교): 일정한 목적ㆍ교과 과정ㆍ설비ㆍ제도 및 법규에 의하여 교사가 계속적으로 학생에게교육을 실시하는 기관."],["나는 슬며시 그녀의 <u>의향</u>을 떠보았다.",["心同","意向","心向","意同"],2,"◎意向(의향): 마음이 향하는 바. 또는 무엇을 하려는 생각."],["그의 눈앞에 드넓은 <u>평원</u>이 펼쳐졌다.",["午遠","午原","平原","平遠"],3,"◎平原(평원): 평평한 들판."],["비슷한 뜻의 한자로 이루어진 어휘는?",["天地","車道","作名","便安"],4,"◎天地(천지, 하늘 천·땅 지): 하늘과 땅을 아울러 이르는 말. 이는 서로 반대되는 뜻의 한자로 이루어진 ‘상대 병렬 관계’이다. ◎車道(차도, 수레 차·길도): 찻길. 사람이 다니는 길 따위와 구분하여 자동차만 다니게 한 길. 이는 앞 글자가 뒤 글자를 꾸며주는 ‘수식 관계’이다."],["‘生氣’의 유의어는?",["全死","全力","生死","活氣"],4,"◎生氣(생기): 싱싱하고 힘찬 기운. = ◎活氣(활기): 활동력이 있거나 활발한 기운."],["‘來年’의 반의어는?",["中年","出年","去年","每年"],3,"◎來年(내년): 올해의 바로 다음 해. ↔ ◎去年(거년): 지난해."],["“人山人海”의 속뜻으로 알맞은 것은?",["경치 좋은 산과 바다","사람이 살지 않는 곳","사람들이 많이 찾는 유명한 산과 바다","사람이 수없이 많이 모인 상태"],4,"◎人山人海(인산인해): 사람이 산을 이루고 바다를 이루었다는 뜻으로, 사람이 수없이 많이 모인 상태를 이르는 말."],["우리의 전통 놀이가 <u>아닌</u> 것은?",["제기차기","썰매타기","로데오","씨름"],3,"◎로데오: 길들이지 아니한 말이나 소를 탄 채버티거나 길들이는 경기. 미국 서부의 카우보이들이서로 솜씨를 겨룬 데서 시작되었다."],["우리의 평소 행동으로 바르지 <u>않은</u> 것은?",["다른 사람이 말할 때에는 끼어들지 않도록 한다.","복도를 지나갈 때에는 가능한 뛰지 않도록 한다.","다른 사람을 배려할 수 있는 넉넉한 마음을 갖는다.","실수로 남의 발을 밟으면 모르는 척 하고 지나간다."],4,""]]},{"id":"84","t":"제84회","ty":"가형","off":true,"qs":[["孝",["친할 친","효도 효","늙을 로","함께 공"],2,"◎親(친할 친), 老(늙을 로), 共(함께 공)."],["道",["길 도","마땅할 당","마당 장","걸음 보"],1,"◎當(마땅할 당), 場(마당 장), 步(걸음 보)."],["村",["마디 촌","마을 촌","재주 재","수풀 림"],2,"◎寸(마디 촌), 才(재주 재), 林(수풀 림)."],["科",["대 죽","모일 사","과목 과","이로울 리"],3,"◎竹(대 죽), 社(모일 사), 利(이로울 리)."],["花",["불 화","쌀 미","꽃부리 영","꽃 화"],4,"◎火(불 화), 米(쌀 미), 英(꽃부리 영)."],["强",["번개 전","배울 학","고을 읍","강할 강"],4,"◎電(번개 전), 學(배울 학), 邑(고을 읍)."],["民",["이룰 성","백성 민","밝을 명","목숨 명"],2,"◎成(이룰 성), 明(밝을 명), 命(목숨 명)."],["多",["많을 다","읽을 독","저녁 석","아침 조"],1,"◎讀(읽을 독), 夕(저녁 석), 朝(아침 조)."],["놓을 방",["方","班","敎","放"],4,"◎方(모 방), 班(나눌 반), 敎(가르칠 교)."],["물을 문",["問","同","開","門"],1,"◎同(한가지 동), 開(열 개), 門(문 문)."],["보일 시",["時","詩","市","示"],4,"◎時(때 시), 詩(글 시), 市(저자 시)."],["심을 식",["直","植","形","計"],2,"◎直(곧을 직), 形(모양 형), 計(셀 계)."],["여름 하",["冬","秋","夏","意"],3,"◎冬(겨울 동), 秋(가을 추), 意(뜻 의)."],["오를 등",["原","登","京","近"],2,"◎原(언덕 원), 京(서울 경), 近(가까울 근)."],["군사 군",["家","軍","車","急"],2,"◎家(집 가), 車(수레 거), 急(급할 급)."],["‘칼의 모양’을 본떠 만든 한자는?",["用","刀","力","巾"],2,"◎刀(칼 도)."],["“<u>洞</u>口 밖 과 "今"],3,"◎旗(기 기), 己(몸 기), 今(이제 금)."],["‘벼 이삭’을 본뜬 글자로 ‘쌀’을 뜻하게 된 한자는?",["田","米","毛","食"],2,"◎米(쌀 미)."],["밑줄 친 ‘樂’의 독음이 <u>다른</u> 것은?",["音<u>樂</u>","安<u>樂</u>","軍<u>樂</u>","農<u>樂</u>"],2,"◎樂(락·악·요): 즐기다, 즐거워하다, 즐겁게 하다, 즐거움(락) /노래, 풍류, 아뢰다, 연주하다 (악) /좋아하다, 바라다 (요). ◎音樂(음악): 박자, 가락, 음성 따위를 갖가지 형식으로 조화하고 결합하여, 목소리나 악기를 통하여 사상 또는 감정을 나타내는 예술."],["“그는 친구들 사이에서 <u>信</u>用을(를) 잃었다”에서 밑줄 친 ‘信’의 훈음으로 알맞은 것은?",["편지 신","알다 신","소식 신","믿을 신"],4,"◎信(신): 믿다, 신임하다, 맡기다, 신봉하다, 성실하다, ～에 맡기다, 확실하다, 마음대로 하다, 알다, 신의, 신용, 신표(信標: 증거가 되게 ,하기 위하여 서로 주고받는 물건), 편지, 서신, 정보, 증거, 기호(記號), 서류, 소식, 소식을 전하는 사람, 확실히, 정말로."],["‘弱’을(를) 자전에서 찾을 때의 방법으로 바르지 <u>않은</u> 것은?",["독음으로 찾을 때는 ‘약’음에서 찾는다.","총획으로 찾을 때는 ‘10획’에서 찾는다.","총획으로 찾을 때는 ‘12획’에서 찾는다.","부수로 찾을 때는 ‘弓’부수 7획에서 찾는다."],3,"◎弱(약할 약): 弓(활 궁, 3획)부수의 7획, 총10획."],["‘首’의 유의자는?",["央","正","頭","寸"],3,"◎首(머리 수) = 頭(머리 두)."],["‘短’의 반의자는?",["長","本","道","末"],1,"◎短(짧을 단) ↔ 長(긴 장)."],["“文□, □示, 光□ ”에서 □안에 공통으로 들어갈 알맞은 한자는?",["言","話","命","明"],4,"◎文明(문명): 인류가 이룩한 물질적, 기술적, 사회 구조적인 발전. 자연 그대로의 원시적 생활에 상대하여 발전되고 세련된 삶의 양태를 뜻한다. ◎明示(명시): 분명하게 드러내 보임. ◎光明(광명): 밝고 환함. 또는 밝은 미래나 희망을 상징하는 밝고 환한 빛."],["空間",["공문","공한","공간","공덕"],3,"◎空間(공간):「1」아무것도 없는 빈 곳.「2」물리적으로나 심리적으로 널리 퍼져 있는 범위. 어떤 물질이나 물체가 존재할 수 있거나 어떤 일이 일어날 수있는 자리가 된다.「3」영역이나 세계를 이르는 말."],["開放",["폐방","폐쇄","개간","개방"],4,"◎開放(개방):「1」문이나 어떠한 공간 따위를 열어 자유롭게 드나들고 이용하게 함.「2」금하거나 경계하던 것을 풀고 자유롭게 드나들거나 교류하게 함."],["當代",["당대","부대","전대","상대"],1,"◎當代(당대):「1」일이 있는 바로 그 시대.「2」 지금 이 시대.「3」사람의 한평생."],["朝夕",["조야","조숙","조다","조석"],4,"◎朝夕(조석):「1」아침과 저녁을 아울러 이르는 말.「2」썩 가까운 앞날. 또는 어떤 일이 곧 결판나거나끝장날 상황.「3」아침밥과 저녁밥을 아울러 이르는 말"],["正直",["정도","정직","정언","정종"],2,"◎正直(정직): 마음에 거짓이나 꾸밈이 없이 바르고 곧음."],["水銀",["수금","수근","수은","수석"],3,"◎水銀(수은): 상온에서 유일하게 액체 상태로 있는 은백색의 금속 원소. 천연으로 산출되는 진사(辰沙)를 불에 녹여서 얻는 물질로, 독성이 있으며 질산에 쉽게 녹는다. 어떤 금속과도 쉽게 합금을 만들어 아말감이 된다. 금을 정련하거나, 의약ㆍ화약ㆍ살충제ㆍ온도계ㆍ기압계 따위를 만드는 데 쓴다."],["作別",["이별","작별","사별","송별"],2,"◎作別(작별): 인사를 나누고 헤어짐. 또는 그 인 사."],["黃色",["금색","황색","동색","적색"],2,"◎黃色(황색): 익은 벼의 빛깔과 같이 다소 어둡고 탁한 색."],["後漢書",["전한서","후한서","후한화","우한서"],2,"◎後漢書(후한서): 중국 남북조 시대에, 송나라의 범엽(范曄)이 펴낸 후한의 정사(正史). 중국 이십오사(二十五史)의 하나로, 기전체를 썼고 본기(本紀) 10권, 열전(列傳) 80권, 지(志) 30권으로 되어 있다. 양나라의 유소(劉昭)가 보충하였고, 지(志)는 진나라의 사마표(司馬彪)가 지었다."],["共有",["공로가 있음","공공의 목적으로 씀","둘 이상의 사람이나 단체가 함께 일을 함","두 사람 이상이 한 물건을 공동으로 소유함"],4,"◎共有(공유)."],["外面",["비밀로 덮어 둠","세상일을 피하여 숨음","밖으로 드러나지 아니하는 사람의 속마음","마주치기를 꺼리어 피하거나 얼굴을 돌림"],4,"◎外面(외면)."],["衣食住",["국가의 3요소","몹시 밀접한 관계","옷과 음식과 집을 통틀어 이르는 말","좋은 옷을 입고 맛있는 음식을 먹음"],3,"◎衣食住(의식주)."],["명중: 화살이나 총알 따위가 겨냥한 곳에 바로 맞음.",["命中","明中","名中","所中"],1,""],["원로: 한 가지 일에 오래 종사하여 경험과 공로가 많은 사람.",["元老","遠老","古老","王老"],1,""],["시급: 시각을 다툴 만큼 몹시 절박하고 급하다.",["不急","性急","時急","多急"],3,""],["약속 <u>場所</u>(을)를 그곳으로 정했다.",["장소","시간","처소","양소"],1,"◎場所(장소): 어떤 일이 이루어지거나 일어나는 곳."],["그는 얼굴에 <u>會心</u>의 미소를 지었다.",["흑심","사심","쾌심","회심"],4,"◎會心(회심): 마음에 흐뭇하게 들어맞음. 또는 그런 상태의 마음."],["일식과 월식은 태양과 달 그리고 지구가 복잡한 <u>力學</u> 관계에 얽혀 있기 때문에 발생하는 현상이다.",["공생","공학","역학","구학"],3,"◎力學(역학):「1」물체의 운동에 관한 법칙을 연구하는 학문. 물리학의 한 분야이다. 힘의 평형을다루는 정역학, 힘과 운동의 관계를 다루는 동역학, 운동만을 다루는 운동학이 있다.「2」부분을 이루는요소가 서로 의존적 관계를 가지고 서로 제약하는 현상."],["정부는 사회적 거리두기를 5단계로 <u>區分</u>했다.",["구분","구별","균분","분할"],1,"◎區分(구분): 일정한 기준에 따라 전체를 몇 개로 갈라 나눔."],["선생님은 <u>사리</u>에 맞는 말만 하셨다.",["事理","事利","士理","士利"],1,"◎事理(사리): 일의 이치."],["그녀는 세계 여러 나라를 돌면서 <u>견문</u>을 넓혔다.",["見文","見門","見問","見聞"],4,"◎見聞(견문):「1」보고 들음.「2」보거나 듣거나하여 깨달아 얻은 지식."],["올해만 지나면 <u>형편</u>이 나아질 것 같다.",["兄便","形便","行便","形平"],2,"◎形便(형편):「1」일이 되어 가는 상태나 경로 또는 결과.「2」살림살이의 형세.「3」이익을 차리는 생각.「4」땅이 생긴 형상."],["앞 글자가 뒤 글자를 꾸며주는 수식 관계가 <u>아닌</u> 것은?",["兄夫","白晝","人性","登山"],4,"◎兄夫(형부, 맏 형·지아비 부): 언니의 남편을이르거나 부르는 말. ◎白晝(백주, 흰 백·낮 주): 환히밝은 낮. ◎人性(인성, 사람 인·성품 성): 사람의 성품. 이상은 모두 앞 글자가 뒤 글자를 꾸며주는 ‘수식관계’이다."],["‘國民’의 유의어는?",["國家","百姓","百國","民主"],2,"◎國民(국민): 국가를 구성하는 사람. 또는 그 나라의 국적을 가진 사람. = ◎百姓(백성):「1」나라의 근본을 이루는 일반 국민을 예스럽게 이르는 말. 「2」예전에, 사대부가 아닌 일반 평민을 이르던 말."],["‘遠方’의 반의어는?",["近來","近理","方外","近方"],4,"◎遠方(원방): 먼 지방. 또는 먼 곳. ↔ ◎近方(근방): 가까운 곳."],["“電光石火”의 속뜻으로 알맞은 것은?",["조급한 성질을 이르는 말","거짓말을 쉽게 잘함을 이르는 말","전기를 매우 아껴 씀을 이르는 말","매우 짧은 시간이나 매우 재빠른 움직임 따위를 비유적으로 이르는 말"],4,"◎電光石火(전광석화): 번갯불이나 부싯돌의 불이 번쩍거리는 것과 같이 매우 짧은 시간이나 매우재빠른 움직임 따위를 비유적으로 이르는 말."],["“<u>입동</u>은 이십사절기의 하나로 상강과 소설 사이에 들며, 이때부터 겨울이 시작된다고 한다” 에서 밑줄 친 입동을 한자로 바르게 쓴 것은?",["入冬","立冬","入同","立同"],2,"◎立冬(입동): 이십사절기의 하나. 상강(霜降)과 소설(小雪) 사이에 들며, 이때부터 겨울이 시작된다고한다. 11월 8일경이다."],["학교에서의 행동으로 바르지 <u>않은</u> 것은?",["숙제는 밀리지 않도록 미리미리 한다.","수업시간에는 선생님 말씀에 집중한다.","선생님을 만나면 항상 공손하게 인사를 드린다.","친구가 잘못을 저지르면 여기저기 소문을 낸다."],4,""]]},{"id":"89b","t":"제89회","ty":"가-1형","off":true,"qs":[["對",["대답할 대","셀 계","대신할 대","학교 교"],1,"◎計(셀 계), 代(대신할 대), 校(학교 교)."],["朝",["할아비 조","기를 육","가운데 앙","아침 조"],4,"◎祖(할아비 조), 育(기를 육), 央(가운데 앙)."],["光",["으뜸 원","빛 광","함께 공","구슬 옥"],2,"◎元(으뜸 원), 共(함께 공), 玉(구슬 옥)."],["當",["집 실","마땅 당","집 가","세상 세"],2,"◎室(집 실), 家(집 가), 世(세상 세)."],["漢",["바다 해","향할 향","한수 한","고을 동"],3,"◎海(바다 해), 向(향할 향), 洞(고을 동)."],["語",["말씀 언","말씀 화","기록할 기","말씀 어"],4,"◎言(말씀 언), 話(말씀 화), 記(기록할 기)."],["貝",["임금 왕","목숨 명","조개 패","나눌 구"],3,"◎王(임금 왕), 命(목숨 명), 區(나눌 구)."],["功",["몸 기","공 공","힘 력","강 강"],2,"◎己(몸 기), 力(힘 력), 江(강 강)."],["꽃 화",["科","農","花","意"],3,"◎科(과목 과), 農(농사 농), 意(뜻 의)."],["성품 성",["性","孝","姓","村"],1,"◎孝(효도 효), 姓(성씨 성), 村(마을 촌)."],["군사 군",["夫","車","軍","高"],3,"◎夫(지아비 부), 車(수레 거), 高(높을 고)."],["낮 오",["小","午","牛","巾"],2,"◎小(작을 소), 牛(소 우), 巾(수건 건)."],["거느릴 부",["步","登","理","部"],4,"◎步(걸음 보), 登(오를 등), 理(다스릴 리)."],["심을 식",["直","道","首","植"],4,"◎直(곧을 직), 道(길 도), 首(머리 수)."],["겨울 동",["交","英","冬","去"],3,"◎交(사귈 교), 英(꽃부리 영), 去(갈 거)."],["“길고 털이 달린 짐승의 꼬리”를 본 뜬 글자에서 ‘털’을 뜻하는 한자는?",["正","衣","巾","毛"],4,"◎毛(털 모)."],["“대통령의 <u>親</u>書를 전달하다” 에서 밑줄 친 ‘親’의 훈음으로 가장 알맞은 것은?",["어버이 친","몸소 친","친할 친","혼인 친"],2,"◎親(친): 친하다, 가깝다, 사랑하다, 가까이하다, 사이 좋다, 손에 익다, 숙달되다, 어버이, 친척, 혼인, 신부, 몸소, 친히(親-) (친). ◎親書(친서):「1」몸소글씨를 씀. 또는 그 글씨.「2」몸소 쓴 편지."],["“진시황은 <u>不</u>老草를 구하기 위해 사방에 사람들을 보냈다”에서 밑줄 친 ‘不’의 훈음으로 가장 알맞은 것은?",["꽃받침 부","아니할 불","재촉할 불","크다 불"],2,"◎不(불·부): 아니다, 아니하다, 못하다, 없다, 말라, 아니하냐, 이르지 아니하다, 크다, 불통(不通: 과 거에서 불합격의 등급), 꽃받침, 꽃자루 (불) / 아니다, 아니하다, 못하다, 없다, 말라, 아니하냐, 이르지아니하다, 크다 (부). ◎不老草(불로초): 먹으면 늙지않는다고 하는 풀."],["‘血’을(를) 자전에서 찾을 때의 방법으로 바르지 <u>않은</u> 것은?",["부수로 찾을 때는 ‘皿’부수 1획에서 찾는다.","자음으로 찾을 때는 ‘혈’음에서 찾는다.","총획으로 찾을 때는 ‘6획’에서 찾는다.","부수로 찾을 때는 ‘血’부수 0획에서 찾는다."],1,"◎血(피 혈): 血(피 혈, 6획)부수의 0획, 총6획."],["‘里’의 유의자는?",["理","同","村","向"],3,"◎里(마을 리) = 村(마을 촌)."],["‘學’의 반의자는?",["林","行","米","敎"],4,"◎學(배울 학) ↔ 敎(가르칠 교)."],["“□世, □遠, □住”에서 □안에 공통으로 들어갈 알맞은 한자는?",["銀","永","英","古"],2,"◎永世(영세): 세월이 오램. 또는 그런 세월이나세대. ◎永遠(영원): 어떤 상태가 끝없이 이어짐. 또는 시간을 초월하여 변하지 아니함. ◎永住(영주): 한곳에 오래 삶."],["古詩",["고전","고사","고시","고수"],3,"◎古詩(고시): 고대의 시. 한시(漢詩)에서는 주로 후한 이전의 시, 시경(詩經)이나 문선(文選)에 딸린시를 이른다."],["銀行",["은항","은수","은형","은행"],4,"◎銀行(은행): 어떠한 현상을 일으키거나 영향을 미침."],["所聞",["소문","수문","소민","소수"],1,"◎所聞(소문): 사람들 입에 오르내려 전하여 들리는 말."],["問答",["답문","문합","문갑","문답"],4,"◎問答(문답): 물음과 대답. 또는 서로 묻고 대답함."],["東京",["도경","동경","동도","경도"],2,"◎東京(동경):「1」발해 때에 둔 오경(五京)의 하나.「2」고려 시대에 둔 사경(四京) 가운데 지금의 경주에 해당하는 행정 구역「3」‘도쿄’를 우리 한자음으로 읽은 이름."],["自力",["자력","자구","자수","자강"],1,"◎自力(자력): 자기 혼자의 힘."],["正面",["측면","정면","양면","수면"],2,"◎正面(정면):「1」똑바로 마주 보이는 면.「2」 사물에서, 앞쪽으로 향한 면.「3」에두르지 아니하고직접 마주 대함."],["原來",["원래","원체","원양","원미"],1,"◎原來(원래): 사물이 전하여 내려온 그 처음."],["高空",["고간","고강","고공","고가"],3,"◎高空(고공): 높은 공중. 흔히 높이 1,500～2,000미터 위의 하늘을 이른다."],["無時",["아무런 일이 없음","제철이 아닌 때","일정한 때가 없음","사람을 깔보거나 업신여김"],3,"◎無時(무시)."],["各別",["별도의 이름","서로 갈리어 떨어짐","사람이나 물건의 하나하나","마음가짐이나 자세 따위가 유달리 특별함"],4,"◎各別(각별)."],["見利",["이익을 봄","날카로운 칼","평소와는 다른 상태","실현하려고 하는 일이나 나아가는 방향"],1,"◎見利(견리)."],["야반 : 밤이 깊은 때.",["夜分","夜半","夜班","夜氣"],2,""],["가수 : 노래 부르는 것이 직업인 사람.",["歌家","歌水","歌首","歌手"],4,""],["하일 : 여름철의 날. 또는 그날의 날씨.",["春日","下日","夏日","秋日"],3,""],["부지런히 <u>新出</u>한자를 익히다.",["친출","근출","신생","신출"],4,"◎新出(신출):「1」새로 세상에 나옴. 또는 그런인물이나 물건.「2」곡식이나 과일 따위에서 그해에 들어 처음 거두어들인 것."],["항구의 새벽은 <u>活氣</u>에 넘쳤다.",["살기","설기","활기","활발"],3,"◎活氣(활기): 활동력이 있거나 활발한 기운."],["나는 그 <u>作家</u>의 소설을 전부 읽었다.",["작사","작품","작전","작가"],4,"◎作家(작가): 문학 작품, 사진, 그림, 조각 따위의 예술품을 창작하는 사람."],["그는 길눈이 어두워 <u>每番</u> 헤매곤 한다.",["매번","배번","양번","모번"],1,"◎每番(매번):「1」각각의 차례.「2」매 때마다."],["얼굴에 차츰 <u>화색</u>이 돌기 시작했다.",["死色","火色","花色","和色"],4,"◎和色(화색): 얼굴에 드러나는 온화하고 환한 빛."],["<u>전선</u>이 전봇대 사이에 복잡하게 걸쳐 있다.",["全線","前線","電線","田線"],3,"◎電線(전선): 전류가 흐르도록 하는 도체(導體) 로서 쓰는 선."],["검찰은 수사에 성역이 없다는 <u>입장</u>을 분명히 했다.",["立場","入場","立長","入長"],1,"◎立場(입장): 당면하고 있는 상황."],["‘앞 글자가 뒤 글자를 꾸며주는’ 어휘는?",["强弱","朝夕","有用","竹馬"],4,"◎强弱(강약, 강할 강·약할 약): 강하고 약함. 또는 그런 정도. ◎朝夕(조석): 아침과 저녁을 아울러이르는 말. 이상은 ‘병렬 관계’이다. ◎有用(유용, 있을 유·쓸 용): 쓸모가 있음. 이는 ～에～하다로 술보관계이다. ◎竹馬(죽마): 대말."],["‘休心’의 유의어는?",["民心","信心","安心","先心"],3,"◎休心(휴심): 모든 걱정을 떨쳐 버리고 마음을 편히 가짐 = ◎安心(안심): 모든 걱정을 떨쳐 버리고마음을 편히 가짐."],["‘長身’의 반의어는?",["人身","心身","短身","國人"],3,"◎長身(장신): 키가 큰 몸. ↔ ◎短身(단신): 작은 키의 몸"],["“九死一生”의 뜻으로 알맞은 것은?",["죽을 고비를 여러 차례 넘기고 겨우 살아남","외롭고 곤란한 지경에 빠진 형편을 이르는 말","매우 많은 것 가운데 극히 적은 수를 이르는 말","열 가운데 여덟이나 아홉 정도로 거의 대부분이거나 거의 틀림없음"],1,"◎九死一生(구사일생): 아홉 번 죽을 뻔하다 한번 살아난다는 뜻으로, 죽을 고비를 여러 차례 넘기고 겨우 살아남을 이르는 말."],["겨울에 해당하는 절기가 <u>아닌</u> 것은?",["소설","한로","동지","소한"],2,"◎한로(寒露)는 추분과 상강 사이에 들며, 가을의 절기에 해당한다. 태양의 황경(黃經)이 195도인 때이다. 10월 8일경이다."],["평소의 태도로 바르지 <u>않은</u> 것은?",["주어진 일에 책임 의식을 갖는다.","형제간에 우애있게 지내려고 노력한다.","부모님께서 걱정하실 일은 하지 않는다.","수업시간에 피곤하면 하품을 크게 한다."],4,""]]},{"id":"92","t":"제92회","ty":"가형","off":true,"qs":[["登",["이름 명","임금 왕","편할 편","오를 등"],4,"◎登(오를 등). 名(이름 명), 王(임금 왕), 便(편할 편)."],["場",["언덕 원","마당 장","마을 촌","집 실"],2,"◎場(마당 장). 原(언덕 원), 村(마을 촌), 室(집 실)."],["親",["줄 선","이제 금","친할 친","할아비 조"],3,"◎親(친할 친). 線(줄 선), 今(이제 금), 祖(할아비 조)."],["示",["조개 패","예 고","보일 시","끝 말"],3,"◎示(보일 시). 貝(조개 패), 古(예 고), 末(끝 말)."],["夏",["장인 공","몸 기","무거울 중","여름 하"],4,"◎夏(여름 하). 工(장인 공), 己(몸 기), 重(무거울 중)."],["計",["셀 계","절반 반","사귈 교","짧을 단"],1,"◎計(셀 계). 半(절반 반), 交(사귈 교), 短(짧을 단)."],["植",["수풀 림","심을 식","근본 본","쉴 휴"],2,"◎植(심을 식). 林(수풀 림), 本(근본 본), 休(쉴 휴)."],["太",["클 태","온전할 전","개 견","이로울 리"],1,"◎太(클 태). 全(온전할 전), 犬(개 견), 利(이로울 리)."],["쌀 미",["所","友","米","巾"],3,"◎米(쌀 미). 所(바 소), 友(벗 우), 巾(수건 건)."],["일만 만",["地","衣","川","萬"],4,"◎萬(일만 만). 地(땅 지), 衣(옷 의), 川(내 천)."],["각각 각",["各","左","冬","夕"],1,"◎各(각각 각). 左(왼 좌), 冬(겨울 동), 夕(저녁 석)."],["편안할 안",["央","室","弟","安"],4,"◎安(편안할 안). 央(가운데 앙), 室(집 실), 弟(아우 제)."],["갈 거",["士","去","毛","千"],2,"◎去(갈 거). 士(선비 사), 毛(털 모), 千(일천 천)."],["고을 읍",["邑","右","羊","今"],1,"◎邑(고을 읍). 右(오른 우), 羊(양 양), 今(이제 금)."],["몸 신",["足","耳","身","百"],3,"◎身(몸 신). 足(발 족), 耳(귀 이), 百(일백 백)."],["사람의 모습과 나무의 모습을 더한 글자로 ‘쉬다’가 본뜻인 한자는?",["大","休","林","竹"],2,"◎休(쉴 휴): 사람(亻)이 나무(木) 곁에서 쉬는 모습이에요."],["“自<u>白</u>”에서 밑줄 친 ‘白’의 훈음으로 알맞은 것은?",["희다 백","비단 백","말하다 백","부질없다 백"],3,"◎白은 ‘희다’ 외에 ‘아뢰다(말하다)’라는 뜻도 있어요. ◎自白(자백): 자기가 저지른 잘못을 스스로 털어놓음."],["“<u>校</u>正을 보다”에서 밑줄 친 ‘校’의 훈음으로 가장 알맞은 것은?",["빠르다 교","학교 교","갚다 교","바로잡다 교"],4,"◎校는 ‘학교’ 외에 ‘바로잡다, 헤아리다’의 뜻도 있어요. ◎校正(교정): 원고와 대조해 틀린 글자를 바르게 고침."],["‘意’을(를) 자전에서 찾을 때의 방법으로 바르지 <u>않은</u> 것은?",["총획으로 찾을 때는 ‘13획’에서 찾는다.","자음으로 찾을 때는 ‘의’음에서 찾는다.","부수로 찾을 때는 ‘立’부수 8획에서 찾는다.","부수로 찾을 때는 ‘心’부수 9획에서 찾는다."],3,"◎意(뜻 의): 心(마음 심, 4획)부수의 9획, 총 13획."],["‘洞’의 유의자는?",["古","口","力","里"],4,"◎洞(고을·마을 동) = 里(마을 리)."],["‘弱’의 반의자는?",["石","强","老","貝"],2,"◎弱(약할 약) ↔ 强(강할 강)."],["“日□, □作, □世代”에서 □안에 공통으로 들어갈 알맞은 한자는?",["明","詩","月","新"],4,"◎日新(일신): 날마다 새로워짐. ◎新作(신작): 새로 지은 작품. ◎新世代(신세대): 새로운 세대."],["古語",["고언","고어","구어","고시"],2,"◎古語(고어): 오늘날은 쓰지 않는 옛날의 말."],["草食",["조식","조반","초식","초가"],3,"◎草食(초식): 주로 풀이나 푸성귀만 먹고 삶."],["和合",["화급","화회","화합","구급"],3,"◎和合(화합): 화목하게 어울림."],["交信",["교신","교언","수신","수화"],1,"◎交信(교신): 우편·전화 따위로 정보나 의견을 주고받음."],["血氣",["혈색","열혈","혈맥","혈기"],4,"◎血氣(혈기): 힘을 쓰고 활동하게 하는 원기."],["軍歌",["거가","찬가","군가","가요"],3,"◎軍歌(군가): 군대의 사기를 북돋우기 위해 부르는 노래."],["科目",["과목","안목","안일","과일"],1,"◎科目(과목): 가르치거나 배워야 할 지식을 나눈 영역."],["同等",["동당","동등","동료","동창"],2,"◎同等(동등): 등급이나 정도가 같음."],["近來",["근자","근대","근시","근래"],4,"◎近來(근래): 가까운 요즈음."],["夜半",["초저녁","밤을 새우다","밤하늘","밤이 깊은 때"],4,"◎夜半(야반): 밤 야, 절반 반 → 밤이 깊은 때(한밤중)."],["放水",["물을 끌어다 댐","물을 흘려보냄","흐르는 물을 막음","물이 흘러가는 방향"],2,"◎放水(방수): 놓을 방, 물 수 → 물을 흘려보냄."],["多讀",["큰소리로 읽음","많이 읽음","처음부터 끝까지 훑어 읽음.","뜻을 새겨 가며 자세히 읽음."],2,"◎多讀(다독): 많을 다, 읽을 독 → 많이 읽음."],["시서: 시와 글씨를 아울러 이르는 말.",["時書","詩書","市西","首書"],2,"◎詩書(시서): 詩(시 시) + 書(글 서)."],["영원: 어떤 상태가 끝없이 이어짐.",["英遠","永原","英原","永遠"],4,"◎永遠(영원): 永(길 영) + 遠(멀 원)."],["공부: 학문이나 기술을 배우고 익힘.",["共夫","工父","工夫","共父"],3,"◎工夫(공부): 工(장인 공) + 夫(지아비 부)."],["고대 <u>文明</u>의 발상지.",["문자","문화","문명","문학"],3,"◎文明(문명): 인류가 이룩한 물질적·기술적·사회적 발전."],["무성한 <u>所聞</u>이 돌고 있다.",["소문","풍문","근문","소송"],1,"◎所聞(소문): 사람들 입에 오르내려 전하여 들리는 말."],["여름철이 되자 <u>電力</u> 소비량이 급격히 증가했다.",["전자","전기","전공","전력"],4,"◎電力(전력): 단위 시간에 사용되는 전기 에너지의 양."],["일제는 운요호 사건을 계기로 우리나라에 <u>開國</u>을 강요하였다.",["쇄국","개국","폐국","건국"],2,"◎開國(개국): 나라의 문을 열어 다른 나라와 교류함."],["<u>형편</u>이 여의치 않게 되었다.",["兄便","形色","兄色","形便"],4,"◎形便(형편): 일이 되어 가는 상태나 결과. 形(모양 형) + 便(편할 편)."],["맑던 하늘이 <u>오후</u>가 되면서 흐려졌다.",["玉後","五後","午後","牛後"],3,"◎午後(오후): 午(낮 오) + 後(뒤 후)."],["어린아이가 어찌나 고집<u>불통</u>인지 부모 말도 치불입이야.",["不通","不洞","分通","本洞"],1,"◎不通(불통): 서로 통하지 아니함. ◎固執不通(고집불통): 조금도 융통성 없이 자기주장만 내세움."],["앞 글자가 뒤 글자를 꾸며주는 것은?",["全心","出入","大小","男女"],1,"◎全心(전심): 온 마음 → 수식관계. 出入·大小·男女는 반대되는 뜻의 한자로 이루어진 병렬관계예요."],["‘高手’의 유의어는?",["中手","先手","下手","上手"],4,"◎高手(고수) = 上手(상수): 남보다 뛰어난 솜씨를 가진 사람."],["‘無言’의 반의어는?",["直言","手話","有心","有言"],4,"◎無言(무언): 말이 없음 ↔ 有言(유언): 말이 있음."],["“24절기는 기온이 아닌 <u>晝夜長短</u>에 따라 정해진 것이다”에서 밑줄 친 晝夜長短의 뜻으로 알맞은 것은?",["밤과 낮의 길고 짧음","밤낮으로 쉬지 아니함","길고 짧은 것은 대어 보아야 안다","아침에 일찍 일어나고 밤에 늦게 잠"],1,"◎晝夜長短(주야장단): 낮 주, 밤 야, 길 장, 짧을 단 → 밤과 낮의 길고 짧음."],["여름에 해당하는 절기가 <u>아닌</u> 것은?",["하지","소서","말복","망종"],3,"◎여름 절기: 입하, 소만, 망종, 하지, 소서, 대서. 말복은 절기가 아니라 삼복 중 마지막 복날이에요."],["앞으로 계승 발전시켜야 할 우리의 고유 민속놀이로 알맞지 <u>않은</u> 것은?",["강강술래","줄다리기","씨름","카드놀이"],4,"◎카드놀이는 우리 고유의 민속놀이가 아니에요."]]},{"id":"93","t":"제93회","ty":"가-1형","off":true,"qs":[["意",["설 립","밝을 명","뜻 의","많을 다"],3,"◎意(뜻 의). 立(설 립), 明(밝을 명), 多(많을 다)."],["氣",["클 태","기운 기","놓을 방","사귈 교"],2,"◎氣(기운 기). 太(클 태), 放(놓을 방), 交(사귈 교)."],["每",["친할 친","기 기","어머니 모","매양 매"],4,"◎每(매양 매). 親(친할 친), 旗(기 기), 母(어머니 모)."],["時",["일만 만","말씀 언","때 시","한수 한"],3,"◎時(때 시). 萬(일만 만), 言(말씀 언), 漢(한수 한)."],["光",["밤 야","앞 전","빛 광","볼 견"],3,"◎光(빛 광). 夜(밤 야), 前(앞 전), 見(볼 견)."],["草",["가을 추","풀 초","아침 조","다를 별"],2,"◎草(풀 초). 秋(가을 추), 朝(아침 조), 別(다를 별)."],["家",["배울 학","집 가","오를 등","가르칠 교"],2,"◎家(집 가). 學(배울 학), 登(오를 등), 敎(가르칠 교)."],["村",["봄 춘","살 주","없을 무","마을 촌"],4,"◎村(마을 촌). 春(봄 춘), 住(살 주), 無(없을 무)."],["목숨 명",["名","命","形","當"],2,"◎命(목숨 명). 名(이름 명), 形(모양 형), 當(마땅할 당)."],["무리 등",["學","等","形","當"],2,"◎等(무리 등). 學(배울 학), 形(모양 형), 當(마땅할 당)."],["약할 약",["所","林","弱","神"],3,"◎弱(약할 약). 所(바 소), 林(수풀 림), 神(귀신 신)."],["집 실",["室","別","死","色"],1,"◎室(집 실). 別(다를 별), 死(죽을 사), 色(빛 색)."],["사이 간",["聞","便","間","分"],3,"◎間(사이 간). 聞(들을 문), 便(편할 편), 分(나눌 분)."],["차례 번",["無","番","才","後"],2,"◎番(차례 번). 無(없을 무), 才(재주 재), 後(뒤 후)."],["벗 우",["太","毛","肉","友"],4,"◎友(벗 우). 太(클 태), 毛(털 모), 肉(고기 육)."],["“조개의 모습”을 본떠 만든 한자는?",["各","貝","示","血"],2,"◎貝(조개 패): 조개 모양을 본뜬 글자예요."],["다음 중 밑줄 친 ‘車’의 독음이 <u>다른</u> 것은?",["馬<u>車</u>","人力<u>車</u>","下<u>車</u>","<u>車</u>主"],2,"◎車는 ‘차’ 또는 ‘거’로 읽어요. 馬車(마차)·下車(하차)·車主(차주)는 ‘차’, 人力車(인력거)만 ‘거’로 읽어요."],["“農<u>樂</u>에는 우리 민족의 정서가 배어 있다”에서 밑줄 친 ‘樂’의 훈음으로 가장 알맞은 것은?",["즐거울 락","노래 악","좋아할 요","아뢸 악"],2,"◎樂은 즐거울 락 / 노래 악 / 좋아할 요. ◎農樂(농악): 농부들이 연주하는 우리 고유의 음악 → ‘노래 악’."],["‘本’을(를) 자전에서 찾을 때의 방법으로 바르지 <u>않은</u> 것은?",["부수로 찾을 때는 ‘木’ 부수 1획에서 찾는다.","자음으로 찾을 때는 ‘본’음에서 찾는다.","부수로 찾을 때는 ‘一’부수 4획에서 찾는다.","총획으로 찾을 때는 ‘5획’에서 찾는다."],3,"◎本(근본 본): 木(나무 목, 4획)부수의 1획, 총 5획."],["‘班’의 유의자는?",["川","月","天","分"],4,"◎班(나눌 반) = 分(나눌 분)."],["‘夜’의 반의자는?",["耳","先","晝","食"],3,"◎夜(밤 야) ↔ 晝(낮 주)."],["“上□, □日, 無主□山”에서 □안에 들어갈 한자는?",["七","中","千","空"],4,"◎上空(상공), 空日(공일), 無主空山(무주공산: 임자 없는 빈산)."],["電線",["전철","전천","전선","전기"],3,"◎電線(전선): 전류가 흐르도록 하는 선."],["活魚",["강어","혈색","활력","활어"],4,"◎活魚(활어): 살아 있는 물고기."],["社長",["시장","사장","사방","사퇴"],2,"◎社長(사장): 회사의 책임자."],["信用",["신의","신용","신호","신뢰"],2,"◎信用(신용): 틀림없다고 믿어 의심하지 않음."],["共同",["공구","공감","공동","공통"],3,"◎共同(공동): 둘 이상이 함께 일을 하거나 같은 자격으로 관계를 가짐."],["刀工",["도강","역강","역공","도공"],4,"◎刀工(도공): 칼을 만드는 사람. 刀(칼 도)."],["心性",["심의","심성","심기","심정"],2,"◎心性(심성): 타고난 마음씨."],["銀行",["금행","은항","간행","은행"],4,"◎銀行(은행): 예금을 받고 대출 등을 하는 금융 기관. 行은 여기서 ‘항’이 아니라 ‘행’."],["書面",["서면","주면","서안","주안"],1,"◎書面(서면): 일정한 내용을 적은 문서. 書(글 서)와 晝(낮 주)를 헷갈리지 않기!"],["開花",["새로 나라를 세움","풀이나 나무의 꽃이 핌","행동이나 일 따위를 시작함","새로 가게를 내어 처음으로 영업을 시작함"],2,"◎開花(개화): 열 개, 꽃 화 → 꽃 /* ===== 사전 ===== */

  return r; }

/* ===== 문제 만들기 ===== */
function seenW(key){ return 1 / (1 + (S.seen[key] || 0) * 2); }

}
function mkQ(slot, stem, opts, ansIdx, ex, key, src){ return { slot, q:stem, o:opts, a:ansIdx+1, ex, key, src }; }
function placeAns(r, correct, dis){ const o = r.shuf([correct, ...dis]); return [o, o.indexOf(correct)]; }

function gHun(r, used){

}
function gHanja(r, used){
  const c = r.wpick(CHARS.filter(x => !used.has(x)), x => (CH[x][1]+1) * seenW("j:"+x)); used.add(c);

}
function gPair(r, kind){

  return mkQ(kind, `‘${a}’의 ${kind}는?`, o, i, `◎${a}(${hunOf(a)}) ${kind==="유의자"?"=":"↔"} ${b}(${hunOf(b)}).`, "p:"+p.join(""), "새 문제");

function gRead(r, used){
  const pool = VOC.filter(v => !used.has(v.w) && v.w.length <= 3);
  const v = r.wpick(pool, x => seenW("r:"+x.w)); used.add(v.w);
  const dis = readDistract(v, r); if (dis.length < 3) return null;

function gMean(r, used){

function gWrite(r, used){

    let opts;

      const [i, j] = r.shuf(pos).slice(0, 2).sort();
      const A = W.slice(); A[i] = alts[i]; const B = W.slice(); B[j] = alts[j]; const C = W.slice(); C[i] = alts[i]; C[j] = alts[j];

function gIdiom(r){

function fallbackEx(q){

function gBank(r, slot, usedB){

/* 한 장의 시험지 = 50문항 */

let saving = Promise.resolve();
function persist(){
  LS.set("notes", S.notes); LS.set("hist", S.hist); LS.set("seen", S.seen);
  if (!S.db) return;
  const body = { items:S.notes, hist:S.hist.slice(-40), serial:S.serial, updatedAt:Date.now() };
  saving = saving.then(() => S.db.doc("wrongnote/main").set(body)).catch(() => {});
}
async function connect(){
  if (!window.claude || !window.claude.use) return;
  try {
    const [db, dl] = await Promise.all([window.claude.use("db"), window.claude.use("downloads")]);
    S.dl = dl;
    if (db){
      S.db = db;
      db.doc("wrongnote/main").onSnapshot(snap => {
        if (snap.exists){ const d = snap.data() || {}; S.notes = d.items || {}; S.hist = d.hist || S.hist; if (d.serial > S.serial){ S.serial = d.serial; LS.set("serial", S.serial); } LS.set("notes", S.notes); LS.set("hist", S.hist); }
        else if (Object.keys(S.notes).length || S.hist.length) persist();
        if (S.view !== "paper") render();
      }, () => {});

/* ===== 채점 ===== */
function grade(){
  const P = S.paper; if (!P || P.graded) return;
  const empty = P.qs.length - Object.keys(P.ans).length;
  if (empty && !P.confirmEmpty){ P.confirmEmpty = true; toast(`${empty}문제를 아직 안 골랐어요. 한 번 더 누르면 채점해요`); return; }
  let correct = 0; const byTag = {}, wrong = [];
  P.qs.forEach((q, i) => {
    const tag = (secOf(q.origN || q.n) || {}).tag || "기타";
    byTag[tag] = byTag[tag] || { c:0, t:0 }; byTag[tag].t++;
    S.seen[q.key] = (S.seen[q.key] || 0) + 1;
    const p = P.ans[i] || 0;
    const nk = "n" + hashKey(strip(q.q) + "|" + strip(q.o[q.a-1]));
    if (p === q.a){ correct++; byTag[tag].c++; if (S.notes[nk] && !S.notes[nk].fixed) S.notes[nk] = Object.assign({}, S.notes[nk], { fixed:true, fixedAt:Date.now() }); }
    else {
      wrong.push(i);
      const old = S.notes[nk] || { miss:0 };
      S.notes[nk] = { q:q.q, o:q.o, a:q.a, ex:q.ex || "", tag, origN:q.origN || q.n, src:q.src || `${P.title} ${q.n}번`, miss:(old.miss||0)+1, last:p, at:Date.now(), fixed:false };
    }
  });
  // 오답노트는 최근 400개까지
  const keys = Object.keys(S.notes); if (keys.length > 400) keys.sort((a,b) => (S.notes[a].at||0) - (S.notes[b].at||0)).slice(0, keys.length - 400).forEach(k => delete S.notes[k]);
  const score = Math.round(correct / P.qs.length * 100);
  P.graded = { score, correct, total:P.qs.length, byTag, wrong, sec:Math.floor((Date.now() - P.at)/1000), at:Date.now() };
  S.hist.push({ t:P.title + (P.kind === "mock" ? " 모의" : ""), s:score, k:P.kind, at:Date.now() }); S.hist = S.hist.slice(-40);
  S.showEx = true;
  persist(); LS.set("paper", P); render(); window.scrollTo({ top:0, behavior:"smooth" });
}
function hashKey(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }

function packPaper(){
  const P = S.paper, g = P.graded;
  const wrong = g.wrong.map(i => { const q = P.qs[i]; return { q:q.q, o:q.o, a:q.a, ex:q.ex || "", tag:(secOf(q.origN||q.n)||{}).tag || "", src:`${i+1}번`, origN:q.origN || q.n, last:P.ans[i] || 0 }; });
  return { title:`${P.title} ${P.type}${P.kind === "mock" ? " 모의고사" : P.kind === "real" ? " 기출" : ""}`, kind:P.kind, score:g.score, correct:g.correct, total:g.total, sec:g.sec, byTag:g.byTag, wrong };
}
function packNotes(){
  const open = noteArr().filter(n => !n.fixed).slice(0, 60);
  return { title:"오답노트", kind:"notes", score:null, correct:0, total:open.length, wrong:open.map(n => ({ q:n.q, o:n.o, a:n.a, ex:n.ex, tag:n.tag, src:n.src, last:n.last || 0, miss:n.miss })) };
}
function summaryText(r){
  const L = [`[달달맘한자 5급] ${S.kid}의 ${r.title} 결과`];
  if (r.kind !== "notes") L.push(`점수: ${r.score}점 (${r.total}문제 중 ${r.correct}개 정답)${r.kind !== "retry" ? (r.score >= PASS ? " · 합격권!" : " · 합격까지 조금 더") : ""}`);
  else L.push(`남은 오답 ${r.total}문제`);
  (r.wrong || []).filter(w => w && w.q && w.o).slice(0, 15).forEach(w => L.push(` - ${w.src} ${strip(w.q).slice(0, 24)} → 정답 ${MK[w.a-1]} ${strip(w.o[w.a-1])}`));
  if ((r.wrong || []).length > 15) L.push(` 외 ${r.wrong.length - 15}문제`);
  if (r.msg) L.push(`${S.kid}의 한마디: ${r.msg}`);
  return L.join("\n");
}

/* ===== 라우팅 ===== */
function render(){
  const v = S.view;
  const wide = v === "paper";
  $app.className = "wrap" + (wide ? " wide" : "");
  $app.innerHTML = v === "paper" && S.paper ? viewPaper() : v === "notes" ? viewNotes() : v === "analysis" ? viewAnalysis() : v === "mom" ? viewMom() : v === "print" ? viewPrint() : viewHome();
  $dock.innerHTML = dockHTML();
  tick();
}
function go(v){ S.view = v; render(); window.scrollTo(0, 0); }
function openPaper(P){ S.paper = P; S.showEx = false; LS.set("paper", P); go("paper"); }
function notesToItems(list){ return list.slice(0, 50).map(n => ({ q:n.q, o:n.o, a:n.a, ex:n.ex, origN:n.origN || 45, src:n.src, key:"note:" + n.key })); }

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act, P = S.paper;
  switch (a){
    case "home": go("home"); break;
    case "resume": go("paper"); break;
    case "newmock": openPaper(newMock()); break;
    case "real": openPaper(realPaper(+b.dataset.i)); break;
    case "setname": { const v = (document.getElementById("kidname").value || "").trim(); if (v){ S.kid = v; LS.set("kid", v); toast("이름을 바꿨어요"); render(); } break; }
    case "pick": case "omrpick": {
      if (!P || P.graded) break; const i = +b.dataset.i, k = +b.dataset.k;
      if (P.ans[i] === k) delete P.ans[i]; else P.ans[i] = k; P.confirmEmpty = false; LS.set("paper", P);
      const el = document.getElementById("q" + i); if (el){ const tmp = document.createElement("div"); tmp.innerHTML = qHTML(P.qs[i], i, P, { interactive:true, showEx:S.showEx }); el.replaceWith(tmp.firstElementChild); }
      $dock.innerHTML = dockHTML(); tick();
      if (a === "omrpick"){ document.querySelectorAll(`#omrs [data-i="${i}"]`).forEach(x => x.classList.toggle("on", P.ans[i] === +x.dataset.k)); }
      else { const nx = document.getElementById("q" + (i+1)); if (nx && !P.ans[i+1] && P.ans[i]) {} }
      break; }
    case "omr": openOMR(); break;
    case "closeomr": document.getElementById("omrs")?.remove(); break;
    case "grade": document.getElementById("omrs")?.remove(); grade(); break;
    case "toggleex": S.showEx = !S.showEx; render(); break;
    case "retrythis": { const items = P.graded.wrong.map(i => Object.assign({}, P.qs[i], { origN:P.qs[i].origN || P.qs[i].n, src:P.qs[i].src || `${P.title} ${i+1}번` })); openPaper(retryPaper(items, `${P.title} 오답`)); break; }
    case "printgraded": saveFile(`${P.title}_${P.type}_채점`.replace(/\s/g,"_"), printDoc(P.title, paperHTML(P, { interactive:false, showEx:true }))); break;
    case "notes": S.filter = "all"; go("notes"); break;
    case "filter": S.filter = b.dataset.v; render(); break;
    case "retrynotes": { const f = S.filter; const list = noteArr().filter(n => !n.fixed && (f === "all" || n.tag === f)); openPaper(retryPaper(notesToItems(list), "오답 재시험")); break; }
    case "printnotes": { const list = noteArr().filter(n => !n.fixed); const RP = retryPaper(notesToItems(list), `${S.kid} 오답노트`); saveFile(`${S.kid}_오답노트_풀이`, printDoc("오답노트", paperHTML(RP, { interactive:false, forceEx:true, showSrc:true }) + answerKey(RP))); break; }
    case "pnotesq": { const list = noteArr().filter(n => !n.fixed); const RP = retryPaper(notesToItems(list), `${S.kid} 오답 재시험`); saveFile(`${S.kid}_오답_재시험지`, printDoc("오답 재시험지", paperHTML(RP, { interactive:false }) + answerKey(RP))); break; }
    case "analysis": go("analysis"); break;
    case "print": go("print"); break;
    case "pset": printSets(+b.dataset.n); break;
    case "preal": { const RP = realPaper(+b.dataset.i); saveFile(`5급_${RP.title}_${RP.type}_기출`, printDoc(RP.title, paperHTML(RP, { interactive:false }) + answerKey(RP))); break; }
    case "mom": go("mom"); break;
    case "send": if (P && P.graded) openSend(packPaper()); break;
    case "sendnotes": openSend(packNotes()); break;
    case "dosend": doSend(); break;
    case "copysend": copyText(document.getElementById("sendprev").textContent); break;
    case "sharesend": navigator.share({ title:"달달맘한자 5급 결과", text:document.getElementById("sendprev").textContent }).then(() => document.getElementById("sendsheet")?.remove()).catch(() => {}); break;
    case "closesheet": document.getElementById("sendsheet")?.remove(); break;
    case "momtoggle": { const id = b.dataset.id; S.momOpen[id] = !S.momOpen[id]; render(); const r = S.reports.find(x => x.id === id); if (S.momOpen[id] && r && !r.momSeen) momUpdate(id, { momSeen:true }); break; }
    case "seen": momUpdate(b.dataset.id, { momSeen:true }); break;
    case "reply": { const id = b.dataset.id, t = (document.getElementById("rp-" + id).value || "").trim(); if (!t) return toast("칭찬 한마디를 적어 주세요"); momUpdate(id, { reply:t, replyAt:Date.now(), momSeen:true }); break; }
    case "copyrep": { const r = S.reports.find(x => x.id === b.dataset.id); if (r) copyText(summaryText(r)); break; }
    case "retryrep": { const r = S.reports.find(x => x.id === b.dataset.id); if (r) openPaper(retryPaper((r.wrong || []).map(w => ({ q:w.q, o:w.o, a:w.a, ex:w.ex, origN:w.origN || 45, src:w.src, key:"rep:" + hashKey(strip(w.q)) })), `${r.title} 오답`)); break; }
    case "printrep": { const r = S.reports.find(x => x.id === b.dataset.id); if (!r) break; const RP = retryPaper((r.wrong || []).map(w => ({ q:w.q, o:w.o, a:w.a, ex:w.ex, origN:w.origN || 45, src:w.src })), `${r.title} 오답`); saveFile(`${r.title}_오답`.replace(/\s/g,"_"), printDoc(RP.title, paperHTML(RP, { interactive:false, forceEx:true, showSrc:true }))); break; }
  }
});
window.claude?.hot?.snapshot?.(() => ({ view:S.view, paper:S.paper }));
function boot(saved){
  if (saved && saved.paper){ S.paper = saved.paper; S.view = saved.view || "home"; }
  render(); connect();
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>
