function packPaper(){
  const P = S.paper, g = P.graded;
  const wrong = g.wrong.map(i => { const q = P.qs[i]; return { q:q.q, o:q.o, a:q.a, ex:q.ex || "", tag:(secOf(q.origN||q.n)||{}).tag || "", src:`${i+1}번`, origN:q.origN || q.n, last:P.ans[i] || 0 }; });
  return { title:`${P.title} ${P.type}${P.kind === "mock" ? " 모의고사" : P.kind === "real" ? " 기출" : ""}`, kind:P.kind, score:g.score, correct:g.correct, total:g.total, sec:g.sec, byTag:g.byTag, wrong };
}
function packNotes(){
  const open = noteArr().filter(n => !n.fixed).slice(0, 60);
  return { title:"오답노트", kind:"notes", score:null, correct:0, total:open.length, wrong:open.map(n => ({ q:n.q, o:n.o, a:n.a, ex:n.ex, tag:n.tag, src:n.src, last:n.last || 0, miss:n.miss })) };
}
function summaryText(r){
  const L = [`[달달맘한자 5급] ${S.kid}의 ${r.title} 결과`];
  if (r.kind !== "notes") L.push(`점수: ${r.score}점 (${r.total}문제 중 ${r.correct}개 정답)${r.kind !== "retry" ? (r.score >= PASS ? " · 합격권!" : " · 합격까지 조금 더") : ""}`);
  else L.push(`남은 오답 ${r.total}문제`);
  (r.wrong || []).filter(w => w && w.q && w.o).slice(0, 15).forEach(w => L.push(` - ${w.src} ${strip(w.q).slice(0, 24)} → 정답 ${MK[w.a-1]} ${strip(w.o[w.a-1])}`));
  if ((r.wrong || []).length > 15) L.push(` 외 ${r.wrong.length - 15}문제`);
  if (r.msg) L.push(`${S.kid}의 한마디: ${r.msg}`);
  return L.join("\n");
}

document.addEventListener("click", e => {

    case "pnotesq": { const list = noteArr().filter(n => !n.fixed); const RP = retryPaper(notesToItems(list), `${S.kid} 오답 재시험`); saveFile(`${S.kid}_오답_재시험지`, printDoc("오답 재시험지", paperHTML(RP, { interactive:false }) + answerKey(RP))); break; }
    case "analysis": go("analysis"); break;
    case "cards": S.deck.type = b.dataset.v || S.deck.type; if (b.dataset.v) { S.deck.f = S.deck.type === "hanja" ? "준4급" : "전체"; S.deck.idx = 0; } LS.set("deck", S.deck); go("cards"); break;

    case "ctstart": { S.ctF[S.deck.type] = S.deck.f; const m = S.deck.type === "hanja" ? "hun" : "read"; const T = makeCardTest(m, getDeck()); if (!T) return toast("카드가 없어요"); S.ct = T; go("ct"); break; }
    case "cardtest": go("cardtest"); break;
    case "ctf": S.ctF[b.dataset.t] = b.dataset.v; render(); break;
    case "ctgo": { const m = b.dataset.m, t = CTM[m].type; const T = makeCardTest(m, deckKeys(t, S.ctF[t])); if (!T || !T.items.length) return toast("이 묶음에 카드가 없어요"); S.ct = T; go("ct"); break; }
    case "ctpick": { const T = S.ct; if (T.ans[T.idx] != null) break; T.ans[T.idx] = +b.dataset.k; render(); break; }
    case "ctnext": { const T = S.ct; if (T.idx < T.items.length - 1){ T.idx++; render(); } else ctFinish(); break; }
    case "ctsend": openSend(packCardTest()); S.ct.sent = true; break;
    case "ctretry": { const T = S.ct; const keys = T.done.wrong.map(i => T.items[i].key); const N = makeCardTest(T.mode, keys, keys.length); S.ct = N; go("ct"); break; }
    case "ctagain": { const T = S.ct, t = CTM[T.mode].type; S.ct = makeCardTest(T.mode, deckKeys(t, S.ctF[t])); go("ct"); break; }
    case "print": go("print"); break;
    case "pset": printSets(+b.dataset.n); break;
    case "preal": { const RP = realPaper(+b.dataset.i); saveFile(`준4급_${RP.title}_${RP.type}_기출`, printDoc(RP.title, paperHTML(RP, { interactive:false }) + answerKey(RP))); break; }
    case "mom": go("mom"); break;
    case "send": if (P && P.graded) openSend(packPaper()); break;
    case "sendnotes": openSend(packNotes()); break;
    case "dosend": doSend(); break;
    case "copysend": copyText(document.getElementById("sendprev").textContent); break;
    case "sharesend": navigator.share({ title:"달달맘한자 5급 결과", text:document.getElementById("sendprev").textContent }).then(() => document.getElementById("sendsheet")?.remove()).catch(() => {}); break;
    case "closesheet": document.getElementById("sendsheet")?.remove(); break;
    case "momtoggle": { const id = b.dataset.id; S.momOpen[id] = !S.momOpen[id]; render(); const r = S.reports.find(x => x.id === id); if (S.momOpen[id] && r && !r.momSeen) momUpdate(id, { momSeen:true }); break; }
    case "seen": momUpdate(b.dataset.id, { momSeen:true }); break;
    case "reply": { const id = b.dataset.id, t = (document.getElementById("rp-" + id).value || "").trim(); if (!t) return toast("칭찬 한마디를 적어 주세요"); momUpdate(id, { reply:t, replyAt:Date.now(), momSeen:true }); break; }
    case "copyrep": { const r = S.reports.find(x => x.id === b.dataset.id); if (r) copyText(summaryText(r)); break; }
    case "retryrep": { const r = S.reports.find(x => x.id === b.dataset.id); if (r) openPaper(retryPaper((r.wrong || []).map(w => ({ q:w.q, o:w.o, a:w.a, ex:w.ex, origN:w.origN || 45, src:w.src, key:"rep:" + hashKey(strip(w.q)) })), `${r.title} 오답`)); break; }
    case "printrep": { const r = S.reports.find(x => x.id === b.dataset.id); if (!r) break; const RP = retryPaper((r.wrong || []).map(w => ({ q:w.q, o:w.o, a:w.a, ex:w.ex, origN:w.origN || 45, src:w.src })), `${r.title} 오답`); saveFile(`${r.title}_오답`.replace(/\s/g,"_"), printDoc(RP.title, paperHTML(RP, { interactive:false, forceEx:true, showSrc:true }))); break; }
  }
});
document.addEventListener("keydown", e => { if (S.view !== "cards" || e.target.matches("input,textarea")) return; if (e.key === "ArrowRight") document.querySelector('[data-act="cnext"]')?.click(); else if (e.key === "ArrowLeft") document.querySelector('[data-act="cprev"]')?.click(); else if (e.key === " "){ e.preventDefault(); document.getElementById("flash")?.classList.toggle("on"); } });
window.claude?.hot?.snapshot?.(() => ({ view:S.view, paper:S.paper }));
function boot(saved){
  if (saved && saved.paper){ S.paper = saved.paper; S.view = saved.view || "home"; }
  render(); connect();
}
window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
</script>

</body>
