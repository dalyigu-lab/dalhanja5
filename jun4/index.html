<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>달달맘한자 준4급 모의고사</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="대한검정회 준4급 기출 101~110회와 배정한자 400자를 분석해 매번 새 시험지를 만들고, 한자·낱말 플래시카드와 카드 시험까지 하는 연습 앱">
<meta property="og:title" content="달달맘한자 준4급 모의고사">
<meta property="og:description" content="대한검정회 준4급 기출 101~110회와 배정한자 400자를 분석해 매번 새 시험지를 만들고, 한자·낱말 플래시카드와 카드 시험까지 하는 연습 앱">
<meta property="og:type" content="website">
<meta name="theme-color" content="#E0A526">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 56 56'%3E%3Ccircle cx='28' cy='28' r='26' fill='%23E0A526'/%3E%3Ccircle cx='20' cy='24' r='3' fill='%233E2A14'/%3E%3Ccircle cx='36' cy='24' r='3' fill='%233E2A14'/%3E%3Cpath d='M19 34 Q28 43 37 34' fill='none' stroke='%233E2A14' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Gowun+Dodum&family=Jua&family=Nanum+Pen+Script&family=Noto+Sans+KR:wght@700;900&family=Noto+Serif+KR:wght@400;600;700;900&display=swap">
<style>
/* Layout: 책상 위 시험지 — 크림색 책상(앱) 위에 흰 시험지 한 장. 시험지는 실제 검정시험지 문법(명조, 2단, 네모 지시문), 표시는 연필, 채점은 빨간 펜. */
:root{
  --desk:#FFF8E7; --panel:#FFFFFF; --ink:#3E2A14; --muted:#8A6F4E; --line:#EADBB8;
  --gold:#E0A526; --gold-ink:#3E2A14; --gold-soft:#F8E6B4; --brown:#6B4520;
  --red:#D6322B; --red-soft:#FCE3DF; --green:#2F8A55; --green-soft:#DDF2E4;
  --paper:#FFFFFF; --paper-ink:#111111; --paper-rule:#222222; --pencil:#4B4F58; --redpen:#D8231B;
  --shadow:0 2px 0 rgba(107,69,32,.14);
  --f-brand:"Baloo 2","Jua",system-ui,sans-serif;
  --f-disp:"Jua","Gowun Dodum",system-ui,sans-serif;
  --f-body:"Gowun Dodum","Noto Serif KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-paper:"Noto Serif KR","Batang","AppleMyungjo","Noto Serif CJK KR",serif;
  --f-head:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif;
  --f-hand:"Nanum Pen Script","Gowun Dodum",cursive;
  --r-s:8px; --r-m:16px; --r-l:24px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --desk:#1D160E; --panel:#2A2016; --ink:#F6E9CF; --muted:#BFA784; --line:#4A3B26;
  --gold:#F0B93A; --gold-ink:#2A1E0E; --gold-soft:#4A3A1A; --brown:#E9C98E;
  --red:#FF6B5E; --red-soft:#4A221E; --green:#6CC38A; --green-soft:#1F3A29;
  --paper:#F7F3EA; --shadow:0 2px 0 rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#1D160E; --panel:#2A2016; --ink:#F6E9CF; --muted:#BFA784; --line:#4A3B26;
  --gold:#F0B93A; --gold-ink:#2A1E0E; --gold-soft:#4A3A1A; --brown:#E9C98E;
  --red:#FF6B5E; --red-soft:#4A221E; --green:#6CC38A; --green-soft:#1F3A29;
  --paper:#F7F3EA; --shadow:0 2px 0 rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--desk)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;padding-inline:16px;padding-block:0 120px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.wrap.wide{max-width:980px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
h1,h2,h3{font-family:var(--f-disp);font-weight:400;margin:0;line-height:1.3;text-wrap:balance}
h1{font-size:28px}h2{font-size:22px}h3{font-size:18px}
.muted{color:var(--muted)}.small{font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--desk);display:flex;align-items:center;gap:8px;padding-block:12px;border-bottom:2px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;background:none;border:0;padding:0}
.brand b{font-family:var(--f-brand);font-weight:800;font-size:20px}
.brand small{font-family:var(--f-disp);color:var(--muted);font-size:14px}
.sp{flex:1}
.pill{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px;font-size:14px;transition:transform .12s}
.pill:hover{transform:translateY(-1px)}.pill:active{transform:translateY(1px)}
.pill.on{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn{border:2px solid var(--brown);background:var(--panel);border-radius:var(--r-m);padding:12px 16px;font-family:var(--f-disp);font-size:17px;box-shadow:var(--shadow);transition:transform .12s,background-color .12s}
.btn:hover{transform:translateY(-2px);background:var(--gold-soft)}
.btn:active{transform:translateY(1px);box-shadow:none}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.mom{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{border-color:var(--line);box-shadow:none}
.btn[disabled]{opacity:.45;pointer-events:none}
.card{background:var(--panel);border:2px solid var(--line);border-radius:var(--r-l);padding:16px}
.note{font-size:14px;color:var(--muted);background:var(--gold-soft);border-radius:var(--r-m);padding:12px 16px;margin:0}
.empty{text-align:center;padding:32px 16px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--desk);padding:8px 16px;border-radius:999px;z-index:40;font-size:15px;max-width:calc(100% - 32px);text-align:center}

/* ---------- 홈 ---------- */
.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center;background:var(--panel);border:2px solid var(--brown);border-radius:var(--r-l);padding:20px;box-shadow:var(--shadow)}
.hero h1 span{color:var(--gold)}
.hero p{margin:4px 0 12px}
.minipaper{width:112px;aspect-ratio:210/297;max-width:100%;background:#fff;border:1.5px solid #222;border-radius:2px;padding:8px 7px;display:flex;flex-direction:column;gap:4px;transform:rotate(4deg);box-shadow:4px 6px 0 rgba(107,69,32,.18)}
.minipaper .c{display:flex;align-items:center;gap:3px}
.minipaper .c b{width:16px;height:16px;border-radius:50%;background:#111;color:#fff;font:900 11px/16px var(--f-head);text-align:center}
.minipaper i{display:block;height:3px;background:#bbb;border-radius:2px}
.minipaper .dbl{height:3px;border-top:1.5px solid #222;border-bottom:.8px solid #222}
.minipaper .cols{display:grid;grid-template-columns:1fr 1fr;gap:5px;flex:1}
.minipaper .cols div{display:flex;flex-direction:column;gap:4px}
.minipaper .score{position:absolute}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--panel);border:2px solid var(--line);border-radius:var(--r-m);padding:12px;display:flex;flex-direction:column}
.stat b{font-family:var(--f-brand);font-weight:800;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.tools{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tool{text-align:left;border:2px solid var(--line);background:var(--panel);border-radius:var(--r-l);padding:16px;display:flex;flex-direction:column;gap:4px;transition:transform .12s,border-color .12s}
.tool:hover{transform:translateY(-2px);border-color:var(--gold)}
.tool b{font-family:var(--f-disp);font-weight:400;font-size:19px}
.tool .cnt{font-family:var(--f-brand);font-weight:800;font-size:22px;color:var(--red)}
.tool.mom-tool{border-color:var(--red)}
.hist{display:flex;gap:6px;align-items:flex-end;height:72px;padding-top:8px}
.hist i{flex:1;max-width:28px;border-radius:4px 4px 0 0;background:var(--red);transform-origin:bottom}
.hist i.p{background:var(--green)}
.reply{background:var(--gold-soft);border-radius:var(--r-l);padding:16px;display:flex;gap:12px;align-items:flex-start}
.reply p{margin:0}
.real{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:8px}
.real button{border:2px solid var(--line);background:var(--panel);border-radius:var(--r-m);padding:8px 12px;text-align:left;transition:transform .12s}
.real button:hover{transform:translateY(-2px);border-color:var(--gold)}
.real b{font-family:var(--f-brand);font-weight:800;font-size:20px}
.real span{display:block;font-size:12px;color:var(--muted)}

/* ---------- 시험지 ---------- */
.desk{padding-block:8px 0}
.sheet{background:var(--paper);color:var(--paper-ink);font-family:var(--f-paper);font-size:15px;line-height:1.75;border:1px solid #cfc6b3;box-shadow:0 1px 0 rgba(0,0,0,.05),0 12px 28px -12px rgba(62,42,20,.35);padding:28px 28px 24px;position:relative;margin-bottom:20px}
.sheet + .sheet{margin-top:4px}
.ph{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding-bottom:6px}
.lv{display:flex;align-items:flex-end;gap:2px}
.lv .num{width:62px;height:62px;border-radius:50%;background:#111;color:#fff;font:900 50px/62px var(--f-head);text-align:center}
.lv .gb{font:900 30px/1 var(--f-head);margin-bottom:2px}
.lv .j4{font:900 54px/1 var(--f-head);letter-spacing:-2px}
.ttl{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.ttl .t1{font:700 21px/1.3 var(--f-paper);letter-spacing:.5px;text-align:center}
.ttl .t2{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;font:700 16px/1.4 var(--f-paper)}
.ttl .t2 span{display:inline-flex;align-items:baseline;gap:6px}
.hand{font-family:var(--f-hand);font-weight:400;color:var(--pencil);font-size:24px;line-height:1}
.dbl{border-top:3px solid var(--paper-rule);border-bottom:1px solid var(--paper-rule);height:6px;margin-bottom:10px}
.p2h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;border-bottom:1.5px solid var(--paper-rule);padding-bottom:6px}
.p2h span{border:1.5px solid var(--paper-rule);padding:1px 10px;font-weight:700;font-size:14px}
.cols{column-count:2;column-gap:28px;column-rule:1px solid var(--paper-rule)}
.intro{margin:0 0 10px;padding-left:18px;text-indent:-18px}
.box{break-inside:avoid;border:1.5px solid var(--paper-rule);padding:4px 12px;margin:12px 0 10px;font-weight:700;font-size:14.5px;letter-spacing:.3px}
.q{break-inside:avoid;margin:0 0 12px;position:relative}
.q .hd{padding-left:24px;text-indent:-24px;position:relative}
.q .hd .bl,.q .hd .op-grid,.q .hd .op,.q .hd .op *{text-indent:0}
.q .n{font-weight:400;display:inline-block;min-width:22px;text-indent:0;position:relative}
.q .st{font-weight:400}
.q .st.hz{font-weight:600;font-size:17px}
.bl{white-space:nowrap;display:inline-block;min-width:54px;text-align:center;position:relative}
.bl.r{float:right}
.bl .slot{display:inline-block;width:36px;text-align:center;line-height:1}
.bl .hand{font-size:26px;line-height:.8;display:inline-block;vertical-align:baseline}
.op-grid{display:grid;gap:2px 10px;padding-left:18px;margin-top:2px}
.g4{grid-template-columns:repeat(4,max-content);column-gap:22px}
.g2{grid-template-columns:1fr 1fr}
.g1{grid-template-columns:1fr}
.inl{display:inline}
.inl .op-grid{display:inline-grid;padding-left:8px}
.hun .op-grid{grid-template-columns:repeat(2,minmax(0,9.5em));column-gap:18px;padding-left:0}
.hunrow{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.op{all:unset;cursor:pointer;display:inline-flex;align-items:baseline;gap:1px;position:relative;border-radius:4px;padding:0 3px;margin:0 -3px;transition:background-color .12s}
.op:hover{background:rgba(224,165,38,.18)}
.op:focus-visible{outline:2px solid var(--gold)}
.op .k{position:relative;display:inline-block;width:1.15em;text-align:center}
.op .tx{position:relative}
.op .hj{font-weight:600;font-size:16.5px}
.hun .op{display:flex;justify-content:space-between;gap:8px}
.hun .op .tx{display:flex;justify-content:space-between;flex:1;gap:8px}
.pen{position:absolute;pointer-events:none;overflow:visible}
.pen.pc{left:-5px;top:-3px;width:calc(100% + 10px);height:calc(100% + 6px)}
.pen path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.pen.pencil path{stroke:var(--pencil);stroke-width:1.7;opacity:.9}
.pen.red path{stroke:var(--redpen);stroke-width:2.6}
.mark{position:absolute;left:-14px;top:-10px;width:44px;height:44px;pointer-events:none}
.mark path{fill:none;stroke:var(--redpen);stroke-width:3;stroke-linecap:round}
.fix{font-family:var(--f-hand);color:var(--redpen);font-size:24px;line-height:1;margin-left:4px;white-space:nowrap}
.exp{margin:6px 0 0 18px;border-left:3px solid var(--redpen);padding:4px 10px;font-family:var(--f-body);font-size:13.5px;line-height:1.55;color:#5a2a26;background:#FFF1EE}
.exp b{color:var(--redpen);font-weight:400;font-family:var(--f-hand);font-size:20px;margin-right:4px}
.src{font-family:var(--f-body);font-size:11px;color:#8a8a8a;margin-left:6px;white-space:nowrap}
.cont{text-align:right;margin-top:8px;font-weight:700;font-size:14px}
.fin{text-align:right;margin-top:12px;font-weight:700}
.score-mark{position:absolute;right:22px;top:14px;transform:rotate(-8deg);pointer-events:none;text-align:center;color:var(--redpen);font-family:var(--f-hand);line-height:.9}
.score-mark b{display:block;font-size:64px;font-weight:400}
.score-mark span{font-size:26px}
.score-mark svg{position:absolute;left:-18px;top:-12px;width:calc(100% + 36px);height:calc(100% + 24px)}
.score-mark path{fill:none;stroke:var(--redpen);stroke-width:3}
.stampx{position:absolute;right:130px;top:24px;border:3px double var(--redpen);color:var(--redpen);font:900 18px/1 var(--f-head);padding:6px 10px;transform:rotate(-12deg);letter-spacing:3px;opacity:.9;background:rgba(255,255,255,.4)}
@media (prefers-reduced-motion:no-preference){
  .graded .mark path,.graded .score-mark path{stroke-dasharray:200;stroke-dashoffset:200;animation:draw .5s ease-out forwards}
  .pen.pencil path{stroke-dasharray:160;stroke-dashoffset:160;animation:draw .28s ease-out forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .stampx{animation:stamp .4s cubic-bezier(.2,1.6,.4,1) both .3s}
  @keyframes stamp{from{transform:rotate(-12deg) scale(1.8);opacity:0}to{transform:rotate(-12deg) scale(1);opacity:.9}}
}
/* 하단 답안 바 */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--panel);border-top:2px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.dock .in{max-width:980px;margin:0 auto;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dock .meter{flex:1;min-width:120px;display:flex;flex-direction:column;gap:4px}
.dock .meter small{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.prog{height:8px;background:var(--line);border-radius:999px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--gold);transform-origin:left;transition:transform .25s}
.dock .btn{padding:8px 14px;font-size:16px}
/* OMR */
.scrim{position:fixed;inset:0;background:rgba(30,20,8,.5);display:grid;place-items:end center;z-index:30;padding:16px}
@media (min-width:640px){.scrim{place-items:center}}
.sheetm{width:100%;max-width:620px;background:var(--panel);border-radius:var(--r-l);padding:20px 16px;display:flex;flex-direction:column;gap:12px;max-height:88vh;overflow:auto}
.omr{background:#FFF5F3;border:2px solid #E05A4F;border-radius:6px;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:2px 12px;color:#B8342B;font-family:var(--f-head)}
.omr .r{display:flex;align-items:center;gap:4px;font-size:13px;border-bottom:1px dotted #E9A29B;padding:3px 0}
.omr .r em{font-style:normal;width:22px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.omr button{all:unset;cursor:pointer;width:20px;height:26px;border:1.4px solid #D9534A;border-radius:10px;display:grid;place-items:center;font-size:10px;color:#C8453C}
.omr button.on{background:#1b1b1b;border-color:#1b1b1b;color:#1b1b1b}
.omr button:focus-visible{outline:2px solid var(--gold)}
.omr .r.w em{color:#fff;background:var(--redpen);border-radius:4px}
textarea,input[type=text]{width:100%;border:2px solid var(--line);border-radius:var(--r-m);padding:12px;font:inherit;background:var(--desk);color:var(--ink)}
.preview{max-height:30vh;overflow:auto;white-space:pre-wrap;font-size:14px;background:var(--desk);border-radius:var(--r-m);padding:12px;margin:0;border:1.5px dashed var(--line)}
/* 결과 패널 */
.result{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{width:96px;height:96px;border-radius:50%;border:4px double var(--red);color:var(--red);display:grid;place-items:center;font-family:var(--f-brand);font-weight:800;font-size:34px;transform:rotate(-8deg)}
.ring.pass{border-color:var(--green);color:var(--green)}
.bars{display:flex;flex-direction:column;gap:6px}
.brow{display:grid;grid-template-columns:96px 1fr 44px;gap:8px;align-items:center;font-size:14px}
.btrack{height:10px;border-radius:999px;background:var(--red-soft);overflow:hidden}
.btrack i{display:block;height:100%;background:var(--green);transform-origin:left}
.brow .v{text-align:right;font-variant-numeric:tabular-nums}
/* 오답노트·엄마판 */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.wlist{display:flex;flex-direction:column;gap:12px}
.witem{background:var(--panel);border:2px solid var(--line);border-radius:var(--r-m);padding:12px 16px;display:flex;flex-direction:column;gap:6px}
.witem .top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.witem .srcx{font-family:var(--f-disp);color:var(--red)}
.badge{font-size:12px;border:1.5px solid currentColor;border-radius:999px;padding:0 8px}
.badge.m{color:var(--red)}.badge.f{color:var(--green)}.badge.t{color:var(--muted)}
.witem .qq{font-family:var(--f-paper);font-size:17px}
.ans{display:flex;gap:16px;flex-wrap:wrap;font-size:15px}
.ans .mine{color:var(--red);text-decoration:line-through}
.ans .cor{color:var(--green);font-weight:700}
.ex-t{font-size:14px;color:var(--muted);margin:0}
.rep .top{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.mini{width:56px;height:56px;border-radius:50%;border:3px double var(--red);color:var(--red);display:grid;place-items:center;font-family:var(--f-brand);font-weight:800;font-size:20px;transform:rotate(-8deg)}
.mini.pass{border-color:var(--green);color:var(--green)}
.new{font-size:12px;background:var(--red);color:#fff;border-radius:999px;padding:0 8px}
.msg{background:var(--gold-soft);border-radius:var(--r-m);padding:8px 12px;margin:0}
/* 분석 */
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th,.table td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.table th{font-family:var(--f-disp);font-weight:400;color:var(--muted)}
.tw{overflow-x:auto}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1.5px solid var(--line);background:var(--panel);border-radius:10px;padding:4px 8px;display:flex;flex-direction:column;align-items:center;min-width:64px}
.chip b{font-family:var(--f-paper);font-size:22px;font-weight:700;line-height:1.2}
.chip span{font-size:11px;color:var(--muted)}
.chip i{font-style:normal;font-size:11px;color:var(--red)}
.gen{color:var(--green)} .mix{color:var(--gold)}
.print-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}

/* 플래시카드 */
.deck-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.flash{perspective:1200px;width:100%;max-width:440px;margin:0 auto;aspect-ratio:4/5;max-height:62vh;cursor:pointer;border:0;background:none;padding:0}
.flash .in{position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d}
.flash.on .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center}
.face.front{background:var(--panel);border:3px solid var(--brown);box-shadow:0 6px 0 rgba(107,69,32,.18)}
.face.back{background:var(--gold-soft);border:3px solid var(--gold);transform:rotateY(180deg)}
.face .big{font-family:var(--f-paper);font-weight:900;font-size:min(34vw,170px);line-height:1;color:var(--ink)}
.face .wbig{font-family:var(--f-paper);font-weight:900;font-size:min(16vw,76px);line-height:1.15;color:var(--ink);word-break:keep-all}
.face .hun{font-family:var(--f-disp);font-size:40px;line-height:1.2}
.face .meta{font-size:15px;color:var(--muted)}
.face .rel{font-family:var(--f-paper);font-size:22px}
.face .lvtag{position:absolute;top:14px;left:16px;font-size:13px;border:1.5px solid currentColor;border-radius:999px;padding:0 10px;color:var(--muted)}
.face .mk{position:absolute;top:14px;right:16px;font-size:13px;border-radius:999px;padding:0 10px}
.mk.k{background:var(--green-soft);color:var(--green)} .mk.u{background:var(--red-soft);color:var(--red)}
.face .tap{position:absolute;bottom:14px;font-size:13px;color:var(--muted)}
.cardnav{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:8px;max-width:440px;margin:0 auto;width:100%}
.cardnav .btn{padding:12px 10px}
.btn.know{background:var(--green);border-color:var(--green);color:#fff}
.btn.dont{background:var(--red);border-color:var(--red);color:#fff}
.dprog{max-width:440px;margin:0 auto;width:100%;display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
/* 카드 시험 */
.ctq{display:flex;flex-direction:column;gap:16px;max-width:560px;margin:0 auto;width:100%}
.ctq .qcard{background:var(--panel);border:3px solid var(--brown);border-radius:24px;padding:20px;text-align:center;box-shadow:var(--shadow)}
.ctq .qcard .big{font-family:var(--f-paper);font-weight:900;font-size:96px;line-height:1.1}
.ctq .qcard .wbig{font-family:var(--f-paper);font-weight:900;font-size:56px;line-height:1.2}
.ctq .qcard .txt{font-family:var(--f-disp);font-size:28px;line-height:1.35}
.ctopts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ctopt{border:2px solid var(--line);background:var(--panel);border-radius:18px;padding:14px 12px;min-height:72px;font-size:20px;display:flex;align-items:center;justify-content:center;gap:8px;text-align:center;transition:transform .12s,border-color .12s}
.ctopt:hover{transform:translateY(-2px);border-color:var(--gold)}
.ctopt.hz{font-family:var(--f-paper);font-weight:700;font-size:34px}
.ctopt.right{border-color:var(--green);background:var(--green-soft)}
.ctopt.wrong{border-color:var(--red);background:var(--red-soft);text-decoration:line-through;text-decoration-color:var(--red)}
.ctopt[disabled]{cursor:default}.ctopt[disabled]:hover{transform:none}
.ctfb{border-radius:16px;padding:10px 14px;font-size:15px}
.ctfb.ok{background:var(--green-soft);color:var(--green)} .ctfb.no{background:var(--red-soft);color:var(--red)}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.modes button{border:2px solid var(--line);background:var(--panel);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:2px;transition:transform .12s,border-color .12s}
.modes button:hover{transform:translateY(-2px);border-color:var(--gold)}
.modes b{font-family:var(--f-disp);font-weight:400;font-size:18px}
.modes span{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.flash .in{transition:none}}
@media (max-width:760px){
  .cols{column-count:1}
  .sheet{padding:18px 14px 16px;font-size:15px}
  .lv .num{width:48px;height:48px;font-size:38px;line-height:48px}.lv .gb{font-size:24px}.lv .j4{font-size:40px}
  .ttl .t1{font-size:16px}.ttl .t2{font-size:14px;gap:12px}
  .g4{grid-template-columns:repeat(2,max-content)}
  .ttl{padding-right:48px}
  .score-mark{right:6px;top:6px}.score-mark b{font-size:40px}.score-mark span{font-size:18px}
  .stampx{right:6px;top:84px;font-size:12px;padding:3px 6px}
  .card .row .btn{padding:8px 12px;font-size:15px}
  .hero{grid-template-columns:1fr}.minipaper{display:none}
}
@media (max-width:420px){ .stats{grid-template-columns:repeat(3,1fr)} .stat b{font-size:22px} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

洋(큰바다 양)."],["‘重’의 반의자는?",["表","輕","發","消"],2,"◎重(무거울 중) ↔ 輕(가벼울 경)."],["“家□, 校□, □短”에서 □안에 공통으로 들어갈 알맞은 한자는?",["村","夜","高","長"],4,"◎家長(가장):「1」한 가정을 이끌어 나가는 사람.「2」‘남편’을 달리 이르는 말. ◎校長(교장): 대학이나 학원을 제외한 각 급 학교의 으뜸 직위. 또는 그 직위에 있는 사람. ◎長短(장단):「1」길고 짧음. 「2」좋은 점과 나쁜 점."],["充當",["통장","충당","형부","충원"],2,"◎充當(충당): 모자라는 것을 채워 메움."],["洗手",["유세","지면","선면","세수"],4,"◎洗手(세수): 손이나 얼굴을 씻음."],["對答",["정답","대합","대답","대면"],3,"◎對答(대답):「1」부르는 말에 응하여 어떤 말을 함. 또는 그 말.「2」상대가 묻거나 요구하는 것에 대하여 해답이나 제 뜻을 말함. 또는 그런 말.「3」어떤 문제나 현상을 해명하거나 해결하는 방안."],["反省",["반성","판정","반생","판성"],1,"◎反省(반성): 자신의 언행에 대하여 잘못이나부족함이 없는지 돌이켜 봄."],["勇士",["용토","전사","무사","용사"],4,"◎勇士(용사): 용맹스러운 사람."],["發賣",["제매","발파","발매","매상"],3,"◎發賣(발매): 상품이나 증권 따위를 내어 팖. 또는 그것을 팔기 시작함."],["自省",["백성","자상","백상","자성"],4,"◎自省(자성): 자기 자신의 태도나 행동을 스스로 반성함."],["萬全",["만천","우전","만왕","만전"],4,"◎萬全(만전):「1」조금도 허술함이 없이 아주완전함.「2」조금의 위험도 없이 아주 안전함."],["要路",["요노","요로","도로","노로"],2,"◎要路(요로):「1」중요한 길.「2」영향력이 있는 중요한 자리나 지위."],["兵卒",["학교의 모든 수업","학생이 규정에 따라 소정의 교과 과정을 마침","예전에 군인이나 군대를 이르던 말","군대가 집단적으로 거처하는 집"],3,"◎兵卒(병졸)."],["事由",["일의 까닭","농사를 지음","일마다 간섭함","밭에서 일함"],1,"◎事由(사유)."],["曲流",["곧은 흐름","한걸음","물결이 세차게 흐름","물이 굽이쳐 흘러감"],4,"◎曲流(곡류)."],["충분: 모자람이 없이 넉넉함.",["充止","出分","三分","充分"],4,"◎充分(충분)."],["지도: 지구 표면의 상태를 일정한 비율로 줄여, 이를 약속된 기호로 평면에 나타낸 그림.",["地圖","紙圖","地度","紙度"],1,"◎地圖(지도)."],["한복: 우리나라의 고유한 옷.",["韓福","韓服","漢服","漢福"],2,"◎韓服(한복)."],["상대 팀은 공격 축구로 <u>戰術</u>을(를) 바꾸었다.",["단술","전시","전술","전략"],3,"◎戰術(전술):「1」전쟁 또는 전투 상황에 대처하기 위한 기술과 방법. 장기적이고 광범위한 전망을 갖는 전략의 하위 개념이다.「2」일정한 목적을 달성하기 위한 수단이나 방법."],["그를 한 학기 동안 우리 반 반장으로 <u>任命</u>했다.",["지령","임명","지명","사명"],2,"◎任命(임명): 일정한 지위나 임무를 남에게 맡김."],["사업에 실패한 <u>要因</u>을(를) 찾아 분석하여라.",["요소","이유","요인","원인"],3,"◎要因(요인): 사물이나 사건이 성립되는 까닭. 또는 조건이 되는 요소."],["의견에 대한 반대를 <u>表明</u>하였다.",["표현","표시","표명","청명"],3,"◎表明(표명): 의사나 태도를 분명하게 드러냄."],["이 땅은 <u>태고</u> 때부터 우리 민족이 살던 곳이다.",["大古","犬古","太告","太古"],4,"◎太古(태고): 아득한 옛날."],["진정한 <u>명의</u>는 병이 나기 전에 치료하는 사람이다.",["各醫","名醫","名衣","各衣"],2,"◎名醫(명의): 병을 잘 고쳐 이름난 의원이나 의 사."],["<u>길흉</u>을 점치다.",["吉凶","道凶","大吉","凶吉"],1,"◎吉凶(길흉): 운이 좋고 나쁨."],["어휘의 짜임이 <u>다른</u> 것은?",["賣國","小兒","名曲","昨年"],1,"◎小兒(소아, 작을 소․아이 아): 어린아이. ◎名曲(명곡, 이름 명․굽을, 악곡 곡): 이름난 악곡. 또는 뛰어나게 잘된 악곡. ◎昨年(작년, 어제 작․해 년):지난해. 이상은 모두 앞에서 뒤를 꾸며주는 ‘수식관계’이다."],["‘下午’의 유의어는?",["午前","上午","正午","午後"],4,"◎下午(하오): 정오부터 해가 질 때까지의 동안. = ◎午後(오후):「1」낮 열두 시부터 밤 열두 시까지의 시간.「2」낮 열두 시부터 해가 질 때까지의 동안."],["반의어의 연결이 바르지 <u>않은</u> 것은?",["動物↔植物","同窓↔同門","登山↔下山","年末↔年初"],2,"◎同窓(동창): 같은 학교에서 공부를 한 사이. =◎同門(동문):「1」같은 문.「2」같은 학교에서 수학하였거나 같은 스승에게서 배운 사람.「3」같은 문중이나 종파."],["‘事實無根’의 속뜻으로 알맞은 것은?",["근거가 있음","새로운 사건이 발생하지 않음","근거가 없거나 사실과 전혀 다름","뿌리 없는 나무"],3,"◎事實無根(사실무근): 근거가 없음. 또는 터무니없음."],["작고 둥근 통나무 두 개를 반으로 쪼개어 네쪽으로 만든 장난감으로 편을 갈라 던져서 승부를 겨루는 민속놀이는?",["윷놀이","연날리기","팽이차기","재기차기"],1,"◎윷놀이: 편을 갈라 윷으로 승부를 겨루는 놀이. 둘 또는 두 편 이상의 사람이 교대로 윷을 던져서 도ㆍ개ㆍ걸ㆍ윷ㆍ모의 끗수를 가리며, 그에 따라윷판 위에 네 개의 말을 움직여 모든 말이 먼저 최종점을 통과하는 편이 이긴다."],["‘上元’과 관계가 있는 명절은?",["추석","단오","설날","정월대보름"],4,"◎上元(상원): 도교에서, ‘대보름날’을 이르는 말. 도교에서는 천상(天上)의 선관(仙官)이 일 년에 세번 1월 15일, 7월 15일, 10월 15일에 인간의 선악을 살피는 때를 ‘삼원’이라고 하여 초제(醮祭)를 지내는 데, 이 가운데 1월 15일을 이르는 말이다."]],"lv":"준4급"},{"id":"105","t":"제105회","ty":"가형","off":true,"qs":[["法",["걸음 보","법 법","큰바다 양","마실 음"],2,"◎步(걸음 보), 洋(큰바다 양), 飮(마실 음)."],["仕",["자리 위","벼슬할 사","수건 건","장인 공"],2,"◎位(자리 위), 巾(수건 건), 工(장인 공)."],["雲",["구름 운","눈 설","기 기","기운 기"],1,"◎雪(눈 설), 旗(기 기), 氣(기운 기)."],["章",["글 장","아침 조","한수 한","소리 음"],1,"◎朝(아침 조), 漢(한수 한), 音(소리 음)."],["材",["쉴 휴","두 재","나무 목","재목 재"],4,"◎休(쉴 휴), 再(두 재), 木(나무 목)."],["果",["나무 목","열매 실","과실 과","빛 광"],3,"◎木(나무 목), 實(열매 실), 光(빛 광)."],["飮",["가르칠 교","마실 음","은 은","오를 등"],2,"◎敎(가르칠 교), 銀(은 은), 登(오를 등)."],["在",["왼 좌","있을 재","오른 우","온전할 전"],2,"◎左(왼 좌), 右(오른 우), 全(온전할 전)."],["빠를 속",["參","速","近","語"],2,"◎參(참여할 참), 近(가까울 근), 語(말씀 어)."],["자리 석",["石","席","夕","宿"],2,"◎石(돌 석), 夕(저녁 석), 宿(잠잘 숙)."],["들 야",["首","用","夏","野"],4,"◎首(머리 수), 用(쓸 용), 夏(여름 하)."],["상고할 고",["考","便","位","意"],1,"◎便(편할 편), 位(자리 위), 意(뜻 의)."],["맑을 청",["洞","羊","漢","淸"],4,"◎洞(고을 동), 羊(양 양), 漢(한수 한)."],["고을 주",["州","川","郡","竹"],1,"◎川(내 천), 郡(고을 군), 竹(대 죽)."],["순박할 박",["良","耳","朴","立"],3,"◎良(어질 량), 耳(귀 이), 立(설 립)."],["“음식과 술을 잘 차리고 제사를 지내 하늘로부터 복을 받는다”하여 ‘복’을 뜻하게 된 한자는?",["福","讀","禮","學"],1,"◎福(복 복). ◎讀(읽을 독), 禮(예도 례), 學(배울학)."],["밑줄 친 ‘不’의 독음이 <u>다른</u> 것은?",["<u>不</u>正","<u>不</u>和","<u>不</u>利","<u>不</u>信"],1,"◎不(불․부): 아닐, 아니할, 못할, 없을, 말라, 아니 하냐, 이르지 아니할, 클, 불통, 꽃받침, 꽃자루(불) / 아닐, 아니할, 못할, 없을, 말라, 아니 하냐, 이르지 아니할, 클, 불통 (부). ◎不和(불화): 서로 화합하지 못함. ◎不利(불리): 이롭지 아니함. ◎不信(불신): 믿지 아니함."],["어휘의 독음이 바르지 <u>않은</u> 것은?",["曲流(곡류)","醫院(의원)","分科(분과)","功勞(공노)"],4,"◎功勞(공로, 공 공·수고로울 로): 일을 마치거나목적을 이루는 데 들인 노력과 수고."],["‘業’을(를) 자전에서 찾을 때의 방법으로 바르지 <u>않은</u> 것은?",["총획으로 찾을 때는 ‘13획’에서 찾는다.","부수로 찾을 때는 ‘木’부수 9획에서 찾는다.","부수로 찾을 때는 ‘羊’부수 7획에서 찾는다.","자음으로 찾을 때는 ‘업’음에서 찾는다."],3,"◎業(일 업): 木(나무 목, 4획)부수의 9획, 총13획."],["‘道’의 유의자는?",["首","遠","路","然"],3,"◎道(길 도) = 路(길 로)."],["‘昨’의 반의자는?",["朝","今","時","州"],2,"◎昨(어제 작) ↔ 今(이제, 오늘 금)."],["“出□, 實□, □代”에서 □안에 공통으로 들어갈 알맞은 한자는?",["位","現","草","貝"],2,"◎出現(출현):「1」나타나거나 또는 나타나서 보임.「2」행성이나 위성에 가려졌던 천체가 다시 나타남. ◎實現(실현): 꿈, 기대 따위를 실제로 이룸. ◎現代(현대):「1」지금의 시대.「2」역사학의 시대 구분가운데 사상(思想)이나 그 밖의 것이 현재와 같다고생각되는 때부터 지금까지의 시기."],["運河",["운가","운하","군하","군가"],2,"◎運河(운하): 배의 운항이나 수리(水利), 관개(灌漑) 따위를 위하여 육지에 파 놓은 물길."],["自然",["백연","목연","자신","자연"],4,"◎自然(자연):「1」사람의 힘이 더해지지 아니하고 세상에 스스로 존재하거나 우주에 저절로 이루어지는 모든 존재나 상태.「2」사람의 힘이 더해지지아니하고 저절로 생겨난 산, 강, 바다, 식물, 동물 따위의 존재. 또는 그것들이 이루는 지리적ㆍ지질적 환경."],["同根",["동근","동기","동량","동곤"],1,"◎同根(동근):「1」근본(根本)이 같음. 또는 같은 근본.「2」그 자라난 뿌리가 같음."],["史記",["중기","사기","사언","역사"],2,"◎史記(사기): 역사적 사실을 기록한 책."],["品位",["정품","품립","품위","품격"],3,"◎品位(품위):「1」직품(職品)과 직위를 아울러이르는 말.「2」사람이 갖추어야 할 위엄이나 기품. 「3」사물이 지닌 고상하고 격이 높은 인상."],["詩集",["서집","시재","서재","시집"],4,"◎詩集(시집): 여러 편의 시를 모아서 엮은 책."],["氷水",["빙장","영수","냉수","빙수"],4,"◎氷水(빙수):「1」얼음냉수.「2」얼음덩이를 잘게 갈아서 눈과 같이 만들고 거기에 당밀(糖蜜) 또는 설탕, 향미료 따위를 넣은 음식."],["窓門",["동문","창구","창문","창고"],3,"◎窓門(창문): 공기나 햇빛을 받을 수 있고, 밖을 내다볼 수 있도록 벽이나 지붕에 낸 문."],["習字",["습자","백자","백서","습서"],1,"◎習字(습자): 글씨 쓰기를 배워 익힘. 특히 붓글씨를 연습하는 것을 이른다."],["國號",["나라의 이름","그 나라의 국적을 가진 사람","나라를 대표ㆍ상징하는 노래","나라 안팎의 아뢸, 연주할 (악) / 좋아할 (요). ◎風樂(풍악): 예로부터 전해 오는 우리나라 고유의 음악. 주로 기악을 이른다."],["“<u>讀</u>書는 간접 경험의 가장 좋은 방법이다”에서 밑줄 친 ‘讀’의 훈음으로 바른 것은?",["구절 두","읽을 속","읽을 독","구두 두"],3,"◎讀(독·두): 읽다, 이해하다, 세다, 계산하다, 구절, 읽기 (독) / 구절, 구두(읽기 편하게 구절에 점을 찍는 일), 이두, 풍류 이름 (두). ◎讀書(독서): 책을 읽음."],["부수가 다른 한자는?",["姓","始","如","安"],4,"◎安(편안할 안): 宀(집 면, 3획)부수의 3획, 총 6획. ◎姓(성씨 성), 始(처음 시), 如(같을 여)의 부수는 모두 女(여자 녀)이다."],["‘章’의 유의자는?",["問","各","文","交"],3,"◎章(글, 문장 장) = 文(글월, 문장 문)."],["반의자의 연결이 바르지 <u>않은</u> 것은?",["訓↔敎","登↔落","古↔今","遠↔近"],1,"◎訓(가르칠 훈) = 敎(가르칠 교)."],["“直□, 頭□, 四□形”에서 □안에 공통으로 들어갈 알맞은 한자는?",["感","正","先","角"],4,"◎直角(직각): 두 직선이 만나서 이루는 90도의 각. ‘∠R’로 나타낸다. ◎頭角(두각):「1」짐승의 머리에 있는 뿔.「2」뛰어난 학식이나 재능을 비유적으로이르는 말. ◎四角形(사각형): 네 개의 선분으로 둘러싸인 평면 도형."],["展示",["정시","전자","전리","전시"],4,"◎展示(전시):「1」여러 가지 물품을 한곳에 벌여 놓고 보임.「2」책, 편지 따위를 펴서 봄. 또는 펴서 보임."],["實例",["실사","실례","관례","실지"],2,"◎實例(실례): 구체적인 실제의 보기."],["初章",["초장","시장","시구","초구"],1,"◎初章(초장):「1」가곡 따위의 첫째 장.「2」 『문학』세 개의 장으로 나누어진 악곡이나 시조의 첫째 장.「3」『문학』한문 시구의 운(韻)을 맞추는 놀이인 초중종(初中終)에서, 정한 글자가 맨 처음에 오는 시구."],["結果",["과실","길동","결과","결실"],3,"◎結果(결과):「1」열매를 맺음. 또는 그 열매. 「2」어떤 원인으로 결말이 생김. 또는 그런 결말의 상태.「3」내부적 의지나 동작의 표현이 되는 외부적의지와 동작 및 그곳에서 생기는 영향이나 변화."],["植樹",["식수","식목","직수","수식"],1,"◎植樹(식수): 나무를 심음. 또는 심은 나무."],["林業",["목업","임업","대미","임무"],2,"◎林業(임업): 각종 임산물에서 얻는 경제적 이윤을 위하여 삼림을 경영하는 사업."],["體育",["기술","교육","체조","체육"],4,"◎體育(체육): 일정한 운동 따위를 통하여 신체를 튼튼하게 단련시키는 일. 또는 그런 목적으로 하는 운동."],["全體",["학년","전체","체전","전부"],2,"◎全體(전체): 개개 또는 부분의 집합으로 구성된 것을 몰아서 하나의 대상으로 삼는 경우에 바로 그 대상."],["平和",["온화","평이","평화","편리"],3,"◎平和(평화):「1」평온하고 화목함.「2」전쟁, 분쟁 또는 일체의 갈등이 없이 평온함. 또는 그런 상태."],["白紙",["깨끗하고 맑은 물","빛깔이 흰 술","털의 빛깔이 흰 사슴","흰 종이"],4,"◎白紙(백지)."],["問責",["묻고 답함","맨 마지막","잘못을 캐묻고 꾸짖음","돌이켜 물음"],3,"◎問責(문책)."],["知己",["걷기를 정지함","자기의 속마음을 참되게 알아주는 친구","기록을 마침","기록을 앎"],2,"◎知己(지기)."],["서당: 글방. 예전에, 한문을 사사로이 가르치던 곳.",["學堂","書堂","讀書","訓長"],2,"◎書堂(서당)."],["유리: 이익이 있음.",["有理","由利","由理","有利"],4,"◎有利(유리)."],["석양: 저녁때의 햇빛.",["夕陽","夕良","多良","多陽"],1,"◎夕陽(석양)."],["<u>現在</u>의 주어진 일에 최선을 다하라.",["지금","미래","현세","현재"],4,"◎現在(현재):「1」지금의 시간.「2」기준으로 삼은 그 시점.「3」『불교』현세(現世). 삼세(三世)의 하나. 지금 살아 있는 이 세상을 이른다.「4」『언어』동작이나 상태가 지금 행하여지고 있거나 지속됨을 나타내는 시제."],["우리나라는 <u>原油</u>을(를) 수입한다.",["원유","원화","한우","한지"],1,"◎原油(원유): 땅속에서 뽑아낸, 정제하지 아니한그대로의 기름. 적갈색 내지 흑갈색을 띠는 점도가 높은 유상(油狀) 물질로 탄화수소를 주성분으로 하여 황, 질소, 산소 화합물 따위가 섞인 혼합물이다. 여러가지 석유 제품, 석유 화학 공업의 원료로 쓴다."],["집중 폭우로 <u>河川</u>(이)가 범람하였다.",["강천","유천","하수","하천"],4,"◎河川(하천): 강과 시내를 아울러 이르는 말."],["<u>庭園</u>에 나무를 몇 그루 심었다.",["정단","연단","정원","계단"],3,"◎庭園(정원): 집 안에 있는 뜰이나 꽃밭."],["아침마다 <u>신문</u>을 읽는다.",["新聞","神門","新門","臣聞"],1,"◎新聞(신문):「1」새로운 소식이나 견문.「2」사회에서 발생한 사건에 대한 사실이나 해설을 널리신속하게 전달하기 위한 정기 간행물. 일반적으로는 일간으로 사회 전반의 것을 다루는 것을 말하지만, 주간ㆍ순간ㆍ월간으로 발행하는 것도 있으며, 기관지ㆍ전문지ㆍ일반 상업지 따위도 있다."],["우리 <u>민족</u>의 시조로 받드는 태초의 임금은 단군이다.",["良民","民族","親族","良族"],2,"◎民族(민족): 일정한 지역에서 오랜 세월 동안공동생활을 하면서 언어와 문화상의 공통성에 기초하여 역사적으로 형성된 사회 집단. 인종이나 국가 단위인 국민과 반드시 일치하는 것은 아니다."],["우리는 선생님과 함께 역사적 <u>유래</u>가 있는 고궁이나 사찰을 견학하기로 하였다.",["油來","田來","有來","由來"],4,"◎由來(유래): 사물이나 일이 생겨남. 또는 그 사물이나 일이 생겨난 바."],["어휘의 짜임이 <u>다른</u> 것은?",["流水","空地","洗面","來日"],3,"◎流水(유수, 흐를 류․물 수): 흐르는 물. ◎空地(공지, 빌 공․땅 지): 빈 땅. ◎來日(내일, 올 래․날 일): 오늘의 바로 다음 날. 이상은 모두 앞 글자가 뒤 글자를 꾸며주는 ‘수식관계’이다. ◎洗面(세면, 씻을 세․낯 면): 얼굴을 씻음. 이는 ‘～을 ～하다’로 해석되는 ‘술목관계’이다."],["‘品位’의 유의어는?",["品格","正品","一品","正格"],1,"◎品位(품위):「1」직품(職品)과 직위를 아울러이르는 말.「2」사람이 갖추어야 할 위엄이나 기품. 「3」사물이 지닌 고상하고 격이 높은 인상.「4」금화나 은화가 함유하고 있는 금ㆍ은의 비례.「5」광석안에 들어 있는 금속의 정도. 특히 다이아몬드의 품질을 나타내는 등급이다.「6」어떤 물품의 질적 수준."],["“上午”의 반의어는?",["午前","前後","午後","正午"],3,"◎上午(상오): 밤 0시부터 낮 12시까지의 동안. ↔ ◎午後(오후):「1」정오(正午)부터 밤 열두 시까지의 시간.「2」정오부터 해가 질 때까지의 동안."],["“남의 말을 귀담아듣지 아니하고 지나쳐 흘려버림”을 뜻하는 ‘馬□東風’에서 □안에 들어갈 알맞은 한자는?",["言","耳","下","前"],2,"◎馬耳東風(마이동풍): 동풍이 말의 귀를 스쳐간다는 뜻으로, 남의 말을 귀담아듣지 아니하고 지나쳐 흘려버림을 이르는 말."],["우리의 전통문화를 이해하기 위한 방법으로 바르지 <u>않은</u> 것은?",["옛날 것보다는 지금 것이 훨씬 좋다고만 생각한다.","현장 학습을 통해서 잘 살펴본다.","관련 서적을 통해 간접 경험을 해 본다.","우리 문화가 소중한 것임을 잊지 않는다."],1,""],["우리나라의 명절 가운데 하나인 ‘단오’가 속하는 달은?",["음력三月","음력四月","음력五月","음력六月"],3,"◎단오는 음력 5월 5일로, 단오떡을 해 먹고 여 자는 창포물에 머리를 감고 그네를 뛰며 남자는 씨름을 한다."]],"lv":"준4급"},{"id":"108","t":"제108회","ty":"가형","off":true,"qs":[["州",["구할 요","고을 주","써 이","한수 한"],2,"◎要(구할 요), 以(써 이), 漢(한수 한)."],["窓",["모일 집","목숨 명","창문 창","칼 도"],3,"◎集(모일 집), 命(목숨 명), 刀(칼 도)."],["球",["이길 승","성품 성","성씨 성","공 구"],4,"◎勝(이길 승), 性(성품 성), 姓(성씨 성)."],["第",["정할 정","아우 제","차례 제","순할 순"],3,"◎定(정할 정), 弟(아우 제), 順(순할 순)."],["使",["하여금 사","뿔 각","사라질 소","빌 공"],1,"◎角(뿔 각), 消(사라질 소), 空(빌 공)."],["可",["옳을 가","나눌 구","과녁 적","놈 자"],1,"◎區(나눌 구), 的(과녁 적), 者(놈 자)."],["感",["물건 품","자리 석","글 시","느낄 감"],4,"◎品(물건 품), 席(자리 석), 詩(글 시)."],["界",["지경 계","으뜸 원","역사 사","바다 해"],1,"◎元(으뜸 원), 史(역사 사), 海(바다 해)."],["받들 봉",["河","奉","理","央"],2,"◎河(물 하), 理(다스릴 리), 央(가운데 앙)."],["맺을 결",["會","全","社","結"],4,"◎會(모일 회), 全(온전할 전), 社(모일 사)."],["그칠 지",["立","止","亡","足"],2,"◎立(설 립), 亡(망할 망), 足(발 족)."],["큰바다 양",["夏","貝","血","洋"],4,"◎夏(여름 하), 貝(조개 패), 血(피 혈)."],["푸를 록",["心","外","林","綠"],4,"◎心(마음 심), 外(바깥 외), 林(수풀 림)."],["귀할 귀",["貴","光","注","後"],1,"◎光(빛 광), 注(물댈 주), 後(뒤 후)."],["기다릴 대",["形","待","淸","對"],2,"◎形(모양 형), 淸(맑을 청), 對(대답할 대). 한민국한자급수자격검정시험문제당"],["“사람과 말씀이 합쳐진 자로 사람이 하는 말에는 믿음성이 있어야 한다”는 뜻으로 만들어진 한자는?",["言","語","住","信"],4,"◎信(믿을 신)."],["밑줄 친 ‘便’의 훈음이 <u>다른</u> 것은?",["<u>便</u>所","<u>便</u>安","不<u>便</u>","<u>便</u>利"],1,"◎便(편․변): 편할, 아첨할, 쉴, 휴식할, 익힐, 익을, 말 잘할, 소식 (편) / 똥오줌, 오줌을 눌, 곧, 문득(변). ◎便安(편안): 편하고 걱정 없이 좋음. ◎不便(불편): 몸이나 마음이 편하지 아니하고 괴로움. ◎便利(편리): 편하고 이로우며 이용하기 쉬움."],["“메달도 중요하지만 <u>參</u>加에 의의가 있다”에서 밑줄 친 ‘參’의 훈음으로 알맞은 것은?",["빽빽할 삼","별 삼","참여할 참","헤아릴 참"],3,"◎參(참‧삼): 참여할, 간여할, 관계할, 나란할, 가지런할, 나란히 설, 섞일, 뒤섞을, 헤아릴, 비교할, 살필, 탄핵할, 층날, 뵐, 뵈올, 빽빽이 들어설, 높을, 가지런하지 않을, 무리, 삼공, 삼정승, 가지런하지 않은 모양, 여러 사람이 붙좇아 따르는 모양 (참) / 석, 셋, 별 이름, 인삼,…"],["‘物’을(를) 자전에서 찾을 때의 방법으로 바르지 <u>않은</u> 것은?",["총획으로 찾을 때는 ‘8획’에서 찾는다.","자음으로 찾을 때는 ‘물’음에서 찾는다.","부수를 찾을 때는 ‘勿’부수 4획에서 찾는다.","부수로 찾을 때는 ‘牛’부수 4획에서 찾는다."],3,"◎物(물건 물): 牛(소 우, 4획)부수의 4획, 총8획."],["‘樹’의 유의자가 <u>아닌</u> 것은?",["土","立","木","植"],1,"◎樹(수): 나무, 심을, 세울, 막을. ◎立(설, 세울립), 木(나무 목), 植(심을 식)."],["‘輕’의 반의자는?",["洗","夏","放","重"],4,"◎輕(가벼울 경) ↔ 重(무거울 중)."],["“□氣, □度, 室□”에서 □안에 공통으로 들어갈 알맞은 한자는?",["火","雲","內","溫"],4,"◎溫氣(온기): 따뜻한 기운. ◎溫度(온도): 따뜻함과 차가움의 정도. 또는 그것을 나타내는 수치. 물리적으로는 열평형을 특징짓고 열이 이동하는 경향을 나타내는 양이며, 미시적으로는 계(系)를 구성하는 입자가 가지는 에너지의 분포를 정하고 그 평균값의 표준이 되는 양이다. ◎室溫(실온): 방 안의 온도."],["勇士",["용토","용사","전사","무사"],2,"◎勇士(용사): 용맹스러운 사람."],["訓育",["양육","훈육","훈시","양시"],2,"◎訓育(훈육): 품성이나 도덕 따위를 가르쳐 기름."],["郡民",["주민","군민","도민","시민"],2,"◎郡民(군민): 그 군(郡)에 사는 사람."],["同根",["동량","동곤","동근","동기"],3,"◎同根(동근):「1」근본(根本)이 같음. 또는 같은 근본.「2」그 자라난 뿌리가 같음."],["要因",["이유","요소","요인","원인"],3,"◎要因(요인): 사물이나 사건이 성립되는 까닭또는 조건이 되는 요소."],["如前",["여전","려전","여찬","이전"],1,"◎如前(여전):「1」전과 같다.「2」누구를 닮다."],["放學",["개학","휴학","장학","방학"],4,"◎放學(방학): 일정 기간 동안 수업을 쉬는 일또는 그 기간. 주로 학교에서 학기나 학년이 끝난 뒤또는 더위, 추위가 심할 때 실시한다."],["表土",["표토","양토","낙토","표교"],1,"◎表土(표토):「1」『고적』유적(遺跡)에 퇴적한토층(土層)의 가장 윗부분.「2」토질이 부드러워 갈고 맬 수 있는 땅 표면의 흙."],["急流",["감유","급류","보류","급뉴"],2,"◎急流(급류):「1」물이 빠른 속도로 흐름. 또는 그 물.「2」어떤 현상이나 사회의 급작스러운 변화를 비유적으로 이르는 말."],["名醫",["특효약","역사가 오래된 책","이름난 요리사","이름난 의원이나 의사"],4,"◎名醫(명의)."],["美德",["중화요리 전문점","아름답고 갸륵한 덕행","아무런 음식이나 가리지 않고 먹는 사람","맛있는 음식만 가려먹는 취미를 가진 사람"],2,"◎美德(미덕): 아름답고 갸륵한 덕행."],["開始",["처음과 끝이 같아지도록 노력함","행동이나 일 따위를 처음 시작함","일을 열심히 함","장사가 잘 됨"],2,"◎開始(개시): 행동이나 일 따위를 처음 시작함."],["초유: 처음으로 있음.",["初由","初有","草有","草由"],2,"◎初有(초유): 初(처음 초) + 有(있을 유)."],["실상: 실제의 모양이나 상태.",["室上","實上","實相","室相"],3,"◎實相(실상): 實(열매 실) + 相(서로 상)."],["시가: 시와 노래.",["詩歌","始歌","時歌","始家"],1,"◎詩歌(시가): 시와 노래."],["견본을 가지고 품질 검사를 해 본 결과 제품의 <u>性能</u>이 매우 우수하였다.",["생릉","성릉","생능","성능"],4,"◎性能(성능): 기계 따위가 지닌 성질이나 기능."],["<u>順番</u>이(가) 돌아올 때까지 기다렸다.",["순번","차서","차례","순서"],1,"◎順番(순번): 차례대로 돌아가는 번."],["전쟁이 아닌 <u>平和</u>적인 방법을 모색해야 한다.",["대화","온화","민주","평화"],4,"◎平和(평화): 평온하고 화목함."],["이 돈은 <u>公金</u>이기 때문에 회원 모두가 동의해야 사용할 수 있다.",["자유","연금","기금","공금"],4,"◎公金(공금):「1」국가나 공공 단체가 소유하는 돈.「2」개인의 돈이 아닌 어떤 조직이나 모임의 구성원 전체가 공동으로 소유하는 돈."],["이 <u>동시</u>를 낭랑한 목소리로 읽어보세요.",["動詩","動時","童時","童詩"],4,"◎童詩(동시):「1」주로 어린이를 독자로 예상하고 어린이의 정서를 읊은 시.「2」어린이가 지은 시."],["<u>도로</u>에 함부로 쓰레기를 버리지 맙시다.",["度路","道路","道老","度老"],2,"◎道路(도로): 사람, 차 따위가 잘 다닐 수 있도 록 만들어 놓은 비교적 넓은 길."],["<u>어부</u>들은 어망을 손질하며 노래를 부르고 있었다.",["農夫","語夫","漁夫","漁部"],3,"◎漁夫/漁父(어부): 물고기 잡는 일을 업으로 하는 사람."],["어휘의 짜임이 ‘수식관계’가 <u>아닌</u> 것은?",["千金","天地","一口","良書"],2,"◎千金(천금):「1」많은 돈이나 비싼 값을 비유적으로 이르는 말.「2」아주 귀중한 것을 비유적으로이르는 말. ◎一口(일구):「1」단 한 사람.「2」여러사람의 똑같은 말.「3」한 마디의 말.「4」한 입. ◎良書(양서): 내용이 교훈적이거나 건전한 책. 이상은 앞 글자가 뒷 글자를 꾸며주는 ‘수식관계’이다."],["‘部落’의 유의어는?",["村落","里角","洞客","部果"],1,"◎部落(부락): 시골에서 여러 민가(民家)가 모여이룬 마을. 또는 그 마을을 이룬 곳. = ◎村落(촌락):시골의 작은 마을."],["‘冬服’의 반의어는?",["衣服","面服","立法","夏服"],4,"◎冬服(동복): 겨울철에 입는 옷. ↔ ◎夏服(하복): 여름철에 입는 옷."],["“不問曲直”의 속뜻으로 알맞은 것은?",["한번도 만나본 적이 없어 도무지 모르는 사람.","다시 말할 필요가 없음.","옳고 그름을 따지지 아니함.","묻지 않아도 알 수 있음."],3,"◎不問曲直(불문곡직): 옳고 그름을 따지지 아니"],["평소 生活하는 태도가 바르지 <u>않은</u> 것은?",["父母님께서 걱정하실 일은 하지 않는다.","兄弟간에 友愛있게 지내려고 노력한다.","어른들이 過失을 지적하면 말대꾸를 한다.","주어진 일에 責任 의식을 갖는다."],3,""],["호칭․지칭어로 연결이 바르지 <u>않은</u> 것은?",["父親-외할아버지","孫子-아들의 아들. 또는 딸의 아들","祖父-할아버지","高祖-할아버지의 할아버지"],1,"◎父親(부친): ‘아버지’를 정중히 이르는 말."]],"lv":"준4급"},{"id":"109","t":"제109회","ty":"가형","off":true,"qs":[["注",["물댈 주","자리 위","따뜻할 온","벼슬할 사"],1,"◎位(자리 위), 溫(따뜻할 온), 仕(벼슬할 사)."],["史",["백성 민","역사 사","돌이킬 반","옳을 가"],2,"◎民(백성 민), 反(돌이킬 반), 可(옳을 가)."],["能",["신하 신","어질 량","능할 능","제목 제"],3,"◎臣(신하 신), 良(어질 량), 題(제목 제)."],["考",["상고할 고","늙을 로","벗 우","효도 효"],1,"◎老(늙을 로), 友(벗 우), 孝(효도 효)."],["院",["움직일 운","멀 원","귀신 신","집 원"],4,"◎運(움직일 운), 遠(멀 원), 神(귀신 신)."],["朴",["순박할 박","인할 인","정할 정","기록할 기"],1,"◎因(인할 인), 定(정할 정), 記(기록할 기)."],["右",["오른 우","왼 좌","있을 재","온전할 전"],1,"◎左(왼 좌), 在(있을 재), 全(온전할 전)."],["每",["풀 초","매양 매","가을 추","두 재"],2,"◎草(풀 초), 秋(가을 추), 再(두 재)."],["나눌 구",["球","奉","近","區"],4,"◎球(공 구), 奉(받들 봉), 近(가까울 근)."],["잃을 실",["牛","失","夫","雲"],2,"◎牛(소 우), 夫(지아비 부), 雲(구름 운)."],["손님 객",["客","答","用","開"],1,"◎答(대답 답), 用(쓸 용), 開(열 개)."],["뿌리 근",["才","根","交","村"],2,"◎才(재주 재), 交(사귈 교), 村(마을 촌)."],["공경할 경",["敬","育","共","州"],1,"◎育(기를 육), 共(함께 공), 州(고을 주)."],["덕 덕",["京","雲","德","英"],3,"◎京(서울 경), 雲(구름 운), 英(꽃부리 영). 15.말미암을 유( ② ) ①行 ②由 ③先 ④足[설명] ◎行(다닐 행), 先(먼저 선), 足(발 족)."],["말미암을 유",["行","由","先","足"],2,"◎由(말미암을 유). 行(다닐 행), 先(먼저 선), 足(발 족)."],["한자와 부수의 연결이 바르지 <u>않은</u> 것은?",["相-目","以-人","美-羊","要-女"],4,"◎要(구할 요)의 부수는 襾(덮을 아)."],["밑줄 친 ‘樂’의 독음이 <u>다른</u> 것은?",["風<u>樂</u>","農<u>樂</u>","音<u>樂</u>","<u>樂</u>山"],4,"◎樂(낙(락)·악·요): 즐길, 즐거워할, 즐겁게 할, 즐거움 낙(락) / 노래, 풍류, 아뢸, 연주할 (악) / 좋아할 (요). ◎樂山(요산): 산을 좋아함. 이는 ‘樂’의 음이 ‘요’이다. ◎風樂(풍악): 예로부터 전해 오는 우리나라 고유의 음악. 주로 기악을 이른다. ◎農樂(농악):풍물놀이."],["“하루의 反<u>省</u>은 꼭 필요하다”에서 밑줄 친 ‘省’의 훈음으로 바른 것은?",["덜 생","허물 생","살필 성","살필 생"],3,"◎省(성․생): 살피다, 깨닫다, 명심하다, 관청, 관아, 마을, 대궐 (성) / 덜다, 허물, 재앙 (생). ◎反省(반성): 자신의 언행에 대하여 잘못이나 부족함이없는지 돌이켜 봄."],["한자의 부수와 총획이 바르지 <u>않은</u> 것은?",["輕 ( 車 , 14획 )","在 ( 土, 6획 )","知 ( 矢 , 8획 )","訓 ( 川, 10획 )"],4,"◎訓(가르칠 훈): 言(말씀 언, 7획)부수의 3획, 총10획."],["‘道’의 유의자는?",["永","首","路","然"],3,"◎道(길 도) = 路(길 로)."],["‘勞’의 반의자는?",["會","祖","使","分"],3,"◎勞(수고로울, 일할 로) ↔ 使(하여금, 부릴 사)."],["“□古, □初, □平”에서 □안에 공통으로 들어갈 알맞은 한자는?",["太","郡","萬","始"],1,"◎太古(태고): 아득한 옛날. ◎太初(태초): 하늘과 땅이 생겨난 맨 처음. ◎太平(태평):「1」나라가 안정되어 아무 걱정 없고 평안함.「2」마음에 아무 근심걱정이 없음."],["病名",["병명","상각","병각","상명"],1,"◎病名(병명): 병의 이름."],["感性",["감격","감성","함정","지성"],2,"◎感性(감성):「1」자극이나 자극의 변화를 느끼는 성질.「2」『철학』이성(理性)에 대응되는 개념으로, 외계의 대상을 오관(五官)으로 감각하고 지각하여 표상을 형성하는 인간의 인식 능력."],["流通",["유동","유통","소동","소통"],2,"◎流通(유통):「1」공기 따위가 막힘이 없이 흘러 통함.「2」화폐나 물품 따위가 세상에서 널리 쓰임.「3」상품 따위가 생산자에서 소비자, 수요자에 도 달하기까지 여러 단계에서 교환되고 분배되는 활동."],["林業",["목업","대미","임업","임무"],3,"◎林業(임업): 각종 임산물에서 얻는 경제적 이윤을 위하여 삼림을 경영하는 사업."],["當落",["당랑","부락","부각","당락"],4,"◎當落(당락): 당선과 낙선을 아울러 이르는 말."],["不安",["하안","불안","불면","부안"],2,"◎不安(불안):「1」마음이 편하지 아니하고 조마조마함.「2」분위기 따위가 술렁거리어 뒤숭숭함."],["正字",["정자","오자","정오","필자"],1,"◎正字(정자):「1」서체가 바르고 또박또박 쓴글자.「2」한자의 약자나 속자, 와자가 아닌 본디의 글자."],["充血",["충혈","춘혈","충엽","충열"],1,"◎充血(충혈): 몸의 일정한 부분에 동맥피가 비정상적으로 많이 모임."],["奉命",["박명","복명","봉명","방명"],3,"◎奉命(봉명): 임금이나 윗사람의 명령을 받듦."],["雲集",["많은 사람이 모여듦","멋스럽고 운치가 있음","매우 드물고 성긴 모양","바람과 구름을 아울러 이르는 말"],1,"◎雲集(운집)."],["兵卒",["학교의 모든 수업","학생이 규정에 따라 소정의 교과 과정을 마침","예전에 군인이나 군대를 이르던 말","군대가 집단적으로 거처하는 집"],3,"◎兵卒(병졸)."],["社旗",["회사를 상징하는 깃발","병사들의 씩씩한 기개","회사의 기초","사기를 올리  대상에 대하여 가지는 생각."],["그는 <u>매사</u>에 신중한 성격이다.",["毛市","每事","毛事","每市"],2,"◎每事(매사):「명사」하나하나의 모든 일.「부사」하나하나의 일마다."],["<u>차도</u>로 걸어 다니는 것은 위험한 일이다.",["道車","車馬","馬車","車道"],4,"◎車道(차도): 찻길. 사람이 다니는 길 따위와 구분하여 자동차만 다니게 한 길."],["비슷한 뜻의 한자로 이루어진 어휘는?",["自力","會社","南向","南北"],2,"◎會社(회사, 모일 회․모일 사): 상행위 또는 그밖의 영리 행위를 목적으로 하는 사단 법인. 이는 서로 비슷한 뜻의 한자로 이루어진 ‘유사병렬관계’이다. ◎自力(자력, 스스로 자·힘 력): 자기 혼자의 힘. ◎南向(남향, 남녘 남․향할 향): 남쪽으로 향함. 또는 그 방향."],["‘一代’의 유의어는?",["一世","一生","一家","一同"],1,"◎一代(일대): 한 시대나 한 세대 전체. = ◎一世(일세):「1」한 사람의 일생.「2」한 시대나 한 세대. / = ◎一生(일생): 세상에 태어나서 죽을 때까지의 동안. ◎一生一代(일생일대): 한 사람이 나서 죽을 때까지의 동안. ◎一生一大(일생일대): 일생을 통하여가장 중요함을 이르는 말."],["‘入口’의 반의어는?",["八口","人口","出口","食口"],3,"◎入口(입구): 들어가는 통로. ↔ ◎出口(출구):밖으로 나갈 수 있는 통로."],["“死後功名”의 속뜻으로 알맞은 것은?",["죽은 뒤에 내리는 벼슬","공적인 일을 뒤에 함","산과 물을 좋아함","죽을 고비를 여러 차례 겪음"],1,"◎死後功名(사후공명): 죽은 뒤에 내리는 벼슬이나 시호(諡號)."],["“부모님께 행해야 할 덕목”으로 가장 알맞은 것은?",["學","孝","友","永"],2,"◎孝(효도 효)."],["우리나라의 전통 놀이가 <u>아닌</u> 것은?",["널뛰기","윷놀이","연날리기","빙고게임"],4,""]],"lv":"5급"},{"id":"81","t":"제81회","ty":"가형","off":true,"qs":[["米",["일만 만","쌀 미","학교 교","농사 농"],2,"◎萬(일만 만), 校(학교 교), 農(농사 농)."],["友",["벗 우","가을 추","무거울 중","아우 제"],1,"◎秋(가을 추), 重(무거울 중), 弟(아우 제)."],["區",["안 내","향할 향","나눌 구","서녘 서"],3,"◎內(안 내), 向(향할 향), 西(서녘 서)."],["對",["다닐 행","수건 건","대답 답","대답할 대"],4,"◎行(다닐 행), 巾(수건 건), 答(대답 답)."],["信",["몸 신","믿을 신","편안할 안","말씀 언"],2,"◎身(몸 신), 安(편안할 안), 言(말씀 언)."],["意",["한가지 동","화할 화","뜻 의","죽을 사"],3,"◎同(한가지 동), 和(화할 화), 死(죽을 사)."],["竹",["대 죽","자리 위","세상 세","여섯 륙"],1,"◎位(자리 위), 世(세상 세), 六(여섯 륙)."],["部",["나눌 분","줄 선","가운데 앙","거느릴 부"],4,"◎分(나눌 분), 線(줄 선), 央(가운데 앙)."],["공 공",["功","共","軍","牛"],1,"◎共(함께 공), 軍(군사 군), 牛(소 우)."],["칼 도",["石","九","利","刀"],4,"◎石(돌 석), 九(아홉 구), 利(이로울 리)."],["때 시",["時","別","來","古"],1,"◎別(다를 별), 來(올 래), 古(예 고)."],["겨울 동",["工","開","冬","等"],3,"◎工(장인 공), 開(열 개), 等(무리 등)."],["갈 거",["士","去","千","才"],2,"◎士(선비 사), 千(일천 천), 才(재주 재)."],["온전할 전",["前","命","全","林"],3,"◎前(앞 전), 命(목숨 명), 林(수풀 림)."],["클 태",["元","央","活","太"],4,"◎元(으뜸 원), 央(가운데 앙), 活(살 활)."],["‘사람 인’에 ‘나무 목’을 합친 자로 ‘쉬다’는 뜻의 한자는?",["木","休","植","男"],2,"◎休(쉴 휴)."],["“박물관으로 <u>見</u>學을 갔다”에서 밑줄 친 ‘見’의 훈음으로 가장 알맞은 것은?",["만날 현","지금 현","당할 견","볼 견"],4,"◎見(견․현): 볼, 보일, 당할, 견해 (견) / 보일, 소개할, 만날, 현재, 지금 (현). ◎見學(견학): 실지(實地)로 보고 학식(學識)을 넓힘."],["“靑<u>年</u>”에서 밑줄 친 ‘年’의 훈음으로 가장 알맞은 것은?",["나이 년","끌 연","그럴 연","익을 년"],1,"◎年(년, 연·녕, 영): 나이, 해, 때, 시대, 새해, 신년, 연령, 잘 익은 오곡, 콧마루, 사격의 하나, 사람이름, 익다, 오곡이 잘 익다. (년, 연) / 아첨하다 (녕, 영). ◎靑年(청년):「1」신체적ㆍ정신적으로 한창 성장하거나 무르익은 시기에 있는 사람.「2」성년 남자."],["‘事’을(를) 자전에서 찾을 때의 방법으로 바르지 <u>않은</u> 것은?",["총획으로 찾을 때는 ‘8획’에서 찾는다.","부수로 찾을 때는 ‘亅’부수 7획에서 찾는다.","부수로 찾을 때는 ‘一’부수 7획에서 찾는다.","자음으로 찾을 때는 ‘사’음에서 찾는다."],3,"◎事(일 사): 亅(갈고기 궐, 1획)부수의 7획, 총8획."],["‘社’의 유의자는?",["科","會","計","月"],2,"◎社(모일 사) = 會(모일 회)."],["‘南’의 반의자는?",["方","西","四","北"],4,"◎南(남녘 남) ↔ 北(북녘 북)."],["“□聞□讀”에서 □안에 공통으로 들어갈 알맞은 한자는?",["每","目","室","多"],4,"◎多聞多讀(다문다독): 많이 듣고, 많이 읽음."],["英國",["영왕","영작","영국","훈국"],3,"◎英國(영국): 유럽 서부 대서양 가운데 있는 입헌 군주국."],["漢江",["한성","한강","탄강","탄성"],2,"◎漢江(한강): 우리나라 중부를 흐르는 강. 태백산맥에서 시작하여 황해로 흘러든다. 북한강ㆍ남한강의 두 물줄기가 남양주시에서 합류하며, 이 유역은 삼국 시대부터 중요시되어 왔다."],["神話",["신화","신언","시화","심화"],1,"◎神話(신화):「1」『문학』고대인의 사유나 표상이 반영된 신성한 이야기. 우주의 기원, 신이나 영웅의 사적(事績), 민족의 태고 때의 역사나 설화 따위가 주된 내용이다.「2」신비스러운 이야기."],["詩文",["언문","시문","작문","시어"],2,"◎詩文(시문): 시가와 산문을 아울러 이르는 말."],["交通",["개통","원활","교통","소통"],3,"◎交通(교통):「1」자동차ㆍ기차ㆍ배ㆍ비행기 따위를 이용하여 사람이 오고 가거나, 짐을 실어 나르는 일.「2」서로 오고 감. 또는 소식이나 정보를 주고받음.「3」나라 사이에 관계를 맺어 오고 가고 함."],["新書",["신서","신련","신도","새해"],1,"◎新書(신서): 새로 나온 책."],["敎理",["서리","교리","학리","수리"],2,"◎敎理(교리): 종교적인 원리나 이치. 각 종교의 종파가 진리라고 규정한 신앙의 체계를 이른다."],["不便",["불사","불신","불편","부편"],3,"◎不便(불편):「1」어떤 것을 사용하거나 이용하는 것이 거북하거나 괴로움.「2」몸이나 마음이 편하지 아니하고 괴로움.「3」다른 사람과의 관계 따위가 편하지 않음."],["東海",["차매","차해","동매","동해"],4,"◎東海(동해):「1」동쪽에 있는 바다.「2」『지명』우리나라 동쪽의 바다. 우리나라와 러시아의 연해주, 일본 열도 사이에 있는 바다를 이른다. 대한 해협으로부터 난류가 올라오고 연해주로부터 한류가 내려와 만나기 때문에 여러 종류의 물고기가 산다."],["花田",["꽃앞","논밭을 갊","꽃밭","풀과 나무"],3,"◎花田(화전)."],["合班",["반을 다시 나눔","둘 이상의 학급을 합침","깨어진 옥을 다시 붙임","둘 이상의 학급을 반으로 나눔"],2,"◎合班(합반)."],["强弱",["강함과 약함","힘이 센 사람","강자가 약자를 괴롭힘","약자가 강자를 이김"],1,"◎强弱(강약)."],["지형: 땅의 생긴 모양이나 형세.",["土形","地向","地形","土向"],3,""],["당직: 근무하는 곳에서 숙직이나 일직 따위의 당번이 됨. 그런 차례가 된 사람.",["萬直","當直","萬色","當色"],2,""],["영주: 한곳에 오래 삶.",["水主","永主","水住","永住"],4,""],["누구에게나 <u>長短</u>점은 있기 마련이다.",["호감","수단","장단","장수"],3,"◎長短(장단):「1」길고 짧음.「2」장단점."],["<u>先祖</u>들의 뜻을 받들다.",["선사","선조","조부","증조"],2,"◎先祖(선조): 먼 윗대의 조상."],["끝없이 펼쳐진 <u>草原</u> 위에 소떼들이 풀을 뜯고 있다.",["초원","평지","평원","초지"],1,"◎草原(초원):「1」풀이 나 있는 들판.「2」『지리』초본 식물 위주로 이루어진 식물 군락. 습기가 많거나, 저온이고 건조하여 환경 조건이 나쁘며, 삼림을 이룰 수 없는 곳에 분포한다. 육생 초원, 수생 초원 등으로 구분되고 온대의 스텝ㆍ프레리, 열대의 사바나 등이 있다."],["에너지를 외부로 <u>放出</u>한다.",["송출","방면","송면","방출"],4,"◎放出(방출):「1」비축하여 놓은 것을 내놓음.「2」 『물리』입자나 전자기파의 형태로 에너지를 내보냄."],["아버지는 <u>노후</u>를 편안히 보내고 계신다.",["老後","孝後","孝子","老少"],1,"◎老後(노후): 늙어진 뒤."],["우리 선수단이 <u>기수</u>를 앞세우고 입장하였다.",["記首","旗首","旗手","記手"],3,"◎旗手(기수):「1」행사 때 대열의 앞에 서서 기를 드는 일을 맡은 사람.「2」기를 들고 신호하는 일을 맡은 사람."],["허파에 <u>공동</u>이 생겼다.",["空洞","京同","京洞","空同"],1,"◎空洞(공동):「1」아무것도 없이 텅 비어 있는 굴.「2」아무것도 없이 텅 빈 큰 골짜기.「3」물체 속에 아무것도 없이 빈 것. 또는 그런 구멍.「4」『의 학』상하거나 염증을 일으킨 조직이 밖으로 배출되거나 흡수되어 장기(臟器)에 생긴 빈 공간."],["앞 글자가 뒤 글자를 꾸며주는 어휘가 <u>아닌</u> 것은?",["人性","本末","火力","兄夫"],2,"◎人性(인성, 사람 인·성품 성): 사람의 성품. ◎火力(화력, 불 화·힘 력): 불이 탈 때에 내는 열의 힘. ◎兄夫(형부, 맏 형·지아비 부): 언니의 남편을 이르거나 부르는 말. 이상은 모두 앞 글자가 뒤 글자를 꾸며주는 ‘수식관계’이다. ◎本末(본말, 근본 본·끝말): 사물이나 일의 처음과 끝."],["‘名門’의 유의어는?",["名答","名分","名物","名家"],4,"◎名門(명문):「1」이름 있는 문벌. 또는 훌륭한집안.「2」이름난 좋은 학교. = ◎名家(명가):「1」명망이 높은 가문.「2」어떤 전문 분야에서 이름이 난사람. 또는 그런 집."],["‘上衣’의 반의어는?",["白衣","玉衣","下衣","內衣"],3,"◎上衣(상의): 윗옷. 위에 입는 옷. ↔ ◎下衣(하의): 아래옷. 아래에 입는 옷."],["“一日三秋”의 속뜻으로 알맞은 것은?",["삼십년 세월을 이르는 말","몹시 애태우며 기다림을 이르는 말","세월의 흐름이 빠르다는 말","시간을 헛되이 보내지 말라는 말"],2,"◎一日三秋(일일삼추): 하루가 삼 년 같다는 뜻으로, 몹시 애태우며 기다림을 이르는 말."],["한자문화권에 속하지 않는 나라는?",["미국","한국","일본","중국"],1,""],["전화를 받는 예절로 바르지 <u>않은</u> 것은?",["메모를 준비하고 용건을 듣는다.","부드럽고 밝은 목소리로 받는다.","잘못 걸린 전화의 경우 화를 낸다.","상대방을 존중해 공손하게 받는다."],3,""]],"lv":"5급"},{"id":"82","t":"제82회","ty":"가형","off":true,"qs":[["永",["날 출","모 방","길 영","화할 화"],3,"◎出(날 출), 方(모 방), 和(화할 화)."],["半",["낮 오","쌀 미","절반 반","소 우"],3,"◎午(낮 오), 米(쌀 미), 牛(소 우)."],["前",["친할 친","뒤 후","무리 등","앞 전"],4,"◎親(친할 친), 後(뒤 후), 等(무리 등)."],["頭",["곧을 직","주인 주","읽을 독","머리 두"],4,"◎直(곧을 직), 主(주인 주), 讀(읽을 독)."],["首",["길 도","수건 건","피 혈","머리 수"],4,"◎道(길 도), 巾(수건 건), 血(피 혈)."],["答",["오를 등","걸음 보","남녘 남","대답 답"],4,"◎登(오를 등), 步(걸음 보), 南(남녘 남)."],["書",["글 서","낮 주","글월 문","세상 세"],1,"◎晝(낮 주), 文(글월 문), 世(세상 세)."],["來",["올 래","털 모","수풀 림","평평할 평"],1,"◎毛(털 모), 林(수풀 림), 平(평평할 평)."],["빌 공",["所","空","無","向"],2,"◎所(바 소), 無(없을 무), 向(향할 향)."],["다스릴 리",["理","利","弟","食"],1,"◎利(이로울 리), 弟(아우 제), 食(먹을 식)."],["들을 문",["問","每","面","聞"],4,"◎問(물을 문), 每(매양 매), 面(낯 면)."],["소리 음",["音","貝","百","小"],1,"◎貝(조개 패), 百(일백 백), 小(작을 소)."],["가르칠 교",["强","校","左","敎"],4,"◎强(강할 강), 校(학교 교), 左(왼 좌)."],["으뜸 원",["七","元","末","口"],2,"◎七(일곱 칠), 末(끝 말), 口(입 구)."],["기를 육",["育","形","休","植"],1,"◎形(모양 형), 休(쉴 휴), 植(심을 식)."],["자식이 늙은 부모를 업고 있는 모양으로 어버이를 잘 모시고 섬김의 뜻을 나타내는 한자는?",["孝","見","開","班"],1,"◎孝(효도 효)."],["“靑<u>少</u>年”에서 밑줄 친 ‘少’의 훈음으로 알맞은 것은?",["줄 소","젊을 소","약간 소","조금 소"],2,"◎少(소): 적다, 많지 아니하다, 작다, 줄다, 적어지다, 적다고 여기다, 부족하다고 생각하다, 젊다, 비난하다, 헐뜯다, 경멸하다, 빠지다, 젊은이, 어린이, 버금, 장에 버금가는 벼슬에 붙이는 말, 잠시, 잠깐, 조금 지난 뒤에. ◎靑少年(청소년): 청년과 소년을 아울러 이르는 말."],["밑줄 친 “十”의 독음이 <u>다른</u> 것은?",["<u>十</u>日","<u>十</u>月","<u>十</u>萬","二<u>十</u>"],2,"◎十(십): 열, 열 번, 열 배, 전부, 일체, 완전, 열배하다 (십). ◎十日(십일): 그 달의 열째 날. 열 날. ◎十萬(십만): 만의 열 배가 되는 수. 또는 그런 수의. ◎二十(이십): 십의 두 배가 되는 수. 이상은 모두‘十’의 독음이 ‘십’이다."],["‘京’을(를) 자전에서 찾을 때의 방법으로 바른 것은?",["부수로 찾을 때는 ‘口’ 부수 5획에서 찾는다.","부수로 찾을 때는 ‘小’ 부수 5획에서 찾는다.","부수로 찾을 때는 ‘亠’ 부수 6획에서 찾는다.","자음으로 찾을 때는 ‘영’음에서 찾는다."],3,"◎京(서울 경): 亠(돼지해머리, 2획)부수의 6획, 총8획."],["‘便’의 유의자는?",["成","自","友","安"],4,"◎便(편할 편) = 安(편안할 안)."],["‘遠’의 반의자는?",["神","放","別","近"],4,"◎遠(멀 원) ↔ 近(가까울 근)."],["“□魚, 水□, □色”에서 □안에 공통으로 들어갈 알맞은 한자는?",["位","銀","用","玉"],2,"◎銀魚(은어):『동물』바다빙엇과의 민물고기. 몸의 길이는 20∼30cm이고 모양이 가늘고 길며, 어두운 녹황색 바탕에 배 쪽으로 갈수록 연한 흰색이고눈 위는 누런색, 위턱은 흰색, 아래턱은 녹색이다. 어릴 때에는 바다에서 지내고 이른 봄에 강을 거슬러올라 급류에서 살다가 다시 하류로 가 알을 낳는다."],["詩人",["언사","사인","시사","시인"],4,"◎詩人(시인): 시를 전문적으로 짓는 사람."],["共同",["공동","광동","공통","광통"],1,"◎共同(공동): 둘 이상의 사람이나 단체가 함께일을 하거나, 같은 자격으로 관계를 가짐."],["立冬",["육각","입각","입동","입춘"],3,"◎立冬(입동): 이십사절기의 하나. 상강(霜降)과 소설(小雪) 사이에 들며, 이때부터 겨울이 시작된다고한다. 11월 8일경이다."],["太祖",["대구","태구","대조","태조"],4,"◎太祖(태조): 한 왕조를 세운 첫째 임금에게 붙이던 묘호."],["古物",["고물","구물","구문","고문"],1,"◎古物(고물):「1」옛날 물건.「2」헐거나 낡은 물건.「3」쓸모없이 된 사람을 비유적으로 이르는 말."],["不時",["공사","불시","공시","동사"],2,"◎不時(불시):「1」제철이 아닌 때.「2」뜻하지 아니한 때."],["計上",["허상","십상","계상","개상"],3,"◎計上(계상): 계산하여 올림."],["通信",["송신","소통","통신","소신"],3,"◎通信(통신):「1」소식을 전함.「2」우편이나 전신, 전화 따위로 정보나 의사를 전달함.「3」신문이나잡지에 실을 기사의 자료를 보냄. 또는 그 자료.「4」 『통신』정보 전달을 다루는 과학 기술."],["肉重",["내종","육종","내동","육중"],4,"◎肉重(육중): 투박하고 무거움."],["民意",["국민의 의사","신하는 의리가 있어야 함","의지가 강한 사람","백성의 의사가 반영이 안 됨"],1,"◎民意(민의)."],["火急",["불에 익힌 음식을 먹음","사물의 가장 중요한 곳","급한 일을 알리는 전보","걷잡을 수 없이 타는 불과 같이 매우 급함"],4,"◎火急(화급)."],["明月",["초하루에 뜨는 달","지난달","밝은 달","달 그림자"],3,"◎明月(명월)."],["전선: 전류가 흐르도록 하는 도체로서 쓰는 선.",["電線","電先","全線","全先"],1,""],["초본: 시문의 초를 잡음. 또는 그런 원고.",["草木","草本","原木","原本"],2,""],["천성: 선천적으로 타고난 성질.",["天性","千性","千姓","天姓"],1,""],["우리나라는 태평양의 <u>北西</u>쪽에 있다.",["남동","북동","북서","남서"],3,"◎北西(북서): 북서쪽. 북쪽을 기준으로 북쪽과서쪽 사이의 방위."],["<u>秋夜</u>에 달이 밝다.",["춘외","추야","추외","주야"],2,"◎秋夜(추야): 가을밤. 가을철의 밤."],["이번 주 청소 <u>當番</u>은(는) 내 차례다.",["친척","당반","친구","당번"],4,"◎當番(당번): 어떤 일을 책임지고 돌보는 차례가 됨. 또는 그 차례가 된 사람."],["그는 <u>學生</u>들에게 역사를 가르친다.",["학생","교생","학도","학우"],1,"◎學生(학생):「1」학예를 배우는 사람.「2」학교에 다니면서 공부하는 사람.「3」생전에 벼슬을 하지아니하고 죽은 사람의 명정, 신주, 지방 따위에 쓰는 존칭.「4」『역사』신라 때에, 국학에서 가르침을 받던 사람."],["내가 좋아하는 <u>과목</u>은 한문이다.",["科目","耳木","科木","耳目"],1,"◎科目(과목): 가르치거나 배워야 할 지식 및 경험의 체계를 세분하여 계통을 세운 영역."],["경찰의 수사는 다시 <u>활기</u>를 띠었다.",["活己","活旗","活記","活氣"],4,"◎活氣(활기): 활동력이 있거나 활발한 기운."],["그는 시골마을 <u>촌장</u>으로 추대되었다.",["才長","寸場","村長","村場"],3,"◎村長(촌장): 한 마을의 우두머리."],["앞 글자가 뒤 글자를 꾸며주는 어휘는?",["水火","洞里","朝夕","竹馬"],4,"◎水火(수화): 물과 불. ◎洞里(동리):「1」마을. 「2」지방 행정 구역의 최소 구획인 동(洞)과 이(里) 를 아울러 이르는 말. ◎朝夕(조석): 아침과 저녁을 아울러 이르는 말. 이상은 모두 ‘병렬 관계’이다. ◎竹馬(죽마): 대말."],["‘女子’의 반의어는?",["男子","男女","母子","父子"],1,"◎女子(여자):「1」여성으로 태어난 사람.「2」한남자의 아내나 애인을 이르는 말. ↔ ◎男子(남자):「1」남성으로 태어난 사람.「2」한 여자의 남편이나애인을 이르는 말."],["‘室內’의 유의어는?",["內外","家內","室外","家外"],2,"◎室內(실내): 방이나 건물 따위의 안. = ◎家內(가내): 집안. 가족을 구성원으로 하여 살림을 꾸려나가는 공동체. 또는 가까운 일가."],["“一口二言”의 속뜻으로 알맞은 것은?",["스스로 묻고 스스로 대답함","한 번 물음에 대하여 한 번 대답함","한 가지 일에 대하여 말을 이랬다저랬다 함","변명할 말이 없거나 변명을 못함을 이르는 말"],3,"◎一口二言(일구이언): 한 입으로 두 말을 한다는 뜻으로, 한 가지 일에 대하여 말을 이랬다저랬다함을 이르는 말."],["우리의 민속 명절이 <u>아닌</u> 것은?",["단오","성탄절","대보름","한식"],2,"◎단오: 우리나라 명절의 하나. 음력 5월 5일로, 단오떡을 해 먹고 여자는 창포물에 머리를 감고 그네를 뛰며 남자는 씨름을 한다. ◎대보름: 음력 정월보름날을 명절로 이르는 말. 새벽에 귀밝이술을 마시고 부럼을 깨물며 약밥, 오곡밥 따위를 먹는다. ◎한식: 우리나라 명절의 하나."],["평소 예절의 실천으로 바르지 <u>않은</u> 것은?",["장난삼아 친구에게 발을 걸어 넘어뜨린다.","전화를 잘못 걸었을 때에는 정중히 사과한다.","상대방의 인격을 존중하고 겸손한 태도를 갖는다.","상대방에게 이야기할 때에는 알아듣기 좋은 속도로 이야기한다."],1,""]],"lv":"5급"},{"id":"83","t":"제83회","ty":"가형","off":true,"qs":[["交",["벗 우","양 양","사귈 교","머리 수"],3,"◎友(벗 우), 羊(양 양), 首(머리 수)."],["記",["있을 유","장인 공","성씨 성","기록할 기"],4,"◎有(있을 유), 工(장인 공), 姓(성씨 성)."],["直",["날 일","곧을 직","쌀 미","수건 건"],2,"◎日(날 일), 米(쌀 미), 巾(수건 건)."],["京",["빛 광","예 고","서울 경","소리 음"],3,"◎光(빛 광), 古(예 고), 音(소리 음)."],["急",["급할 급","짧을 단","겨울 동","대답 답"],1,"◎短(짧을 단), 冬(겨울 동), 答(대답 답)."],["利",["가을 추","마을 촌","대신할 대","이로울 리"],4,"◎秋(가을 추), 村(마을 촌), 代(대신할 대)."],["別",["때 시","다를 별","놓을 방","강할 강"],2,"◎時(때 시), 放(놓을 방), 强(강할 강)."],["示",["보일 시","털 모","조개 패","근본 본"],1,"◎毛(털 모), 貝(조개 패), 本(근본 본)."],["걸음 보",["銀","步","朝","夏"],2,"◎銀(은 은), 朝(아침 조), 夏(여름 하)."],["긴 장",["長","物","身","電"],1,"◎物(물건 물), 身(몸 신), 電(번개 전)."],["살 주",["永","祖","主","住"],4,"◎永(길 영), 祖(할아비 조), 主(주인 주)."],["함께 공",["共","靑","世","明"],1,"◎靑(푸를 청), 世(세상 세), 明(밝을 명)."],["차례 번",["前","牛","魚","番"],4,"◎前(앞 전), 牛(소 우), 魚(물고기 어)."],["말씀 화",["近","話","班","漢"],2,"◎近(가까울 근), 班(나눌 반), 漢(한수 한)."],["각각 각",["各","命","石","民"],1,"◎命(목숨 명), 石(돌 석), 民(백성 민)."],["“입을 벌리고 노래를 부른다”는 데서 ‘노래하다, 읊조리다’의 뜻을 나타내는 한자는?",["自","家","歌","當"],3,"◎歌(노래 가)."],["“고려는 <u>開</u>國한 뒤에 도읍을 옮겼다”에서 밑줄 친 ‘開’의 훈음으로 알맞은 것은?",["열 개","다시 개","고칠 개","깨우칠 개"],1,"◎開(개): 열, 필, 펼, 개척할, 시작할, 깨우칠(개). ◎開國(개국):「1」새로 나라를 세움.「2」나라의 문호를 열어 다른 나라와 교류함."],["밑줄 친 ‘樂’의 독음이 <u>다른</u> 것은?",["和<u>樂</u>","<u>樂</u>水","行<u>樂</u>","道<u>樂</u>"],2,"◎樂(낙․락․악․요): 즐길, 즐거워할, 즐겁게할, 즐거움 (낙․락) / 노래, 풍류, 아뢸, 연주할 (악) / 좋아할 (요). ◎和樂(화락): 화평하고 즐거움. ◎行樂(행락): 재미있게 놀고 즐겁게 지냄. ◎道樂(도락):「1」도를 깨달아 스스로 즐기는 일.「2」재미나 취미로 하는 일."],["‘對’을(를) 자전에서 찾을 때의 방법으로 바른 것은?",["자음으로 찾을 때는 ‘도’음에서 찾는다.","총획으로 찾을 때는 ‘13획’에서 찾는다.","부수로 찾을 때는 ‘寸’ 부수 11획에서 찾는다.","부수로 찾을 때는 ‘玉’ 부수 10획에서 찾는다."],3,"◎對(대답할 대): 寸(마디 촌, 3획)부수의 11획, 총14획."],["‘洞’의 유의자는?",["字","里","中","時"],2,"◎洞(고을, 마을 동) = 里(마을 리)."],["‘先’의 반의자는?",["川","文","北","後"],4,"◎先(먼저 선) ↔ 後(뒤 후)."],["“大□, 育□, □立”에서 □안에 공통으로 들어갈 알맞은 한자는?",["農","末","成","植"],3,"◎大成(대성): 크게 이룸. 또는 그런 성과. ◎育成(육성): 길러 자라게 함. ◎成立(성립): 일이나 관계따위가 제대로 이루어짐."],["半旗",["반절","반기","분절","분기"],2,"◎半旗(반기): 조기. 조의를 표하기 위하여 깃봉에서 기의 한 폭만큼 내려서 다는 국기."],["百萬",["백만","백번","수백","수만"],1,"◎百萬(백만): 만의 백배가 되는 수."],["頭部",["두목","부두","두부","부수"],3,"◎頭部(두부):「1」동물의 머리가 되는 부분. 「2」어떤 물체의 위쪽 부분."],["空軍",["육지","육군","공지","공군"],4,"◎空軍(공군): 주로 공중에서 공격과 방어의 임무를 수행하는 군대."],["英語",["영어","잉어","영언","잉언"],1,"◎英語(영어): 인도ㆍ유럽 어족 게르만 어파의서게르만 어군에 속한 언어. 미국, 영국, 캐나다, 오스트레일리아 등을 비롯하여 세계 여러 나라에서 사용하는 국제어의 구실을 하고 있다."],["小邑",["소각","소읍","소식","소면"],2,"◎小邑(소읍): 주민과 산물이 적고 땅이 작은 고을."],["等位",["사위","사립","등위","등립"],3,"◎等位(등위):「1」등급.「2」같은 위치."],["男性",["여성","남성","역성","남생"],2,"◎男性(남성): 성(性)의 측면에서 남자를 이르는 말. 특히, 성년(成年)이 된 남자를 이른다."],["書面",["면전","면화","서원","서면"],4,"◎書面(서면):「1」글씨를 쓴 지면.「2」일정한내용을 적은 문서."],["所信",["믿음을 갖지 못함","성급한 믿음","자기가 믿고 생각하는 바","자신이 아끼는 물건"],3,"◎所信(소신)."],["重用",["치우침이 없음","용도에 맞지 않음","물건이 너무 무거움","중요한 자리에 임용함"],4,"◎重用(중용)."],["子弟",["남의 아들의 높임말","나이가 많은 사람","활동이 아주 적은 사람","스승에게 가르침을 받음"],1,"◎子弟(자제)."],["신입: 새로 들어옴.",["新入","親入","親八","新八"],1,""],["지구: 일정한 기준에 따라 여럿으로 나눈 땅의 한구획.",["地九","地區","土區","土九"],2,""],["야간: 밤사이. 밤 동안.",["夕間","夕聞","夜聞","夜間"],4,""],["<u>花草</u>에 물을 주니 더욱 생기가 났다.",["목초","약초","화초","수초"],3,"◎花草(화초): 꽃이 피는 풀과 나무 또는 꽃이 없더라도 관상용이 되는 모든 식물을 통틀어 이르는 말."],["내가 좋아하는 <u>科目</u>은(는) 수학이다.",["학과","과목","공부","분야"],2,"◎科目(과목): 가르치거나 배워야 할 지식 및 경험의 체계를 세분하여 계통을 세운 영역."],["오늘 친구들과 <u>會食</u>을(를) 하기로 했다.",["회합","토의","회식","토론"],3,"◎會食(회식): 여러 사람이 모여 함께 음식을 먹음. 또는 그런 모임."],["텃밭의 야채를 <u>市場</u>에 내다 팔았다.",["시장","광장","식당","식장"],1,"◎市場(시장):「1」여러 가지 상품을 사고파는 일정한 장소.「2」상품으로서의 재화와 서비스의 거래가 이루어지는 추상적인 영역."],["전쟁이 끝나고 <u>학교</u>가 다시 문을 열었다.",["孝敎","孝校","學敎","學校"],4,"◎學校(학교): 일정한 목적ㆍ교과 과정ㆍ설비ㆍ제도 및 법규에 의하여 교사가 계속적으로 학생에게교육을 실시하는 기관."],["나는 슬며시 그녀의 <u>의향</u>을 떠보았다.",["心同","意向","心向","意同"],2,"◎意向(의향): 마음이 향하는 바. 또는 무엇을 하려는 생각."],["그의 눈앞에 드넓은 <u>평원</u>이 펼쳐졌다.",["午遠","午原","平原","平遠"],3,"◎平原(평원): 평평한 들판."],["비슷한 뜻의 한자로 이루어진 어휘는?",["天地","車道","作名","便安"],4,"◎天地(천지, 하늘 천·땅 지): 하늘과 땅을 아울러 이르는 말. 이는 서로 반대되는 뜻의 한자로 이루어진 ‘상대 병렬 관계’이다. ◎車道(차도, 수레 차·길도): 찻길. 사람이 다니는 길 따위와 구분하여 자동차만 다니게 한 길. 이는 앞 글자가 뒤 글자를 꾸며주는 ‘수식 관계’이다."],["‘生氣’의 유의어는?",["全死","全力","生死","活氣"],4,"◎生氣(생기): 싱싱하고 힘찬 기운. = ◎活氣(활기): 활동력이 있거나 활발한 기운."],["‘來年’의 반의어는?",["中年","出年","去年","每年"],3,"◎來年(내년): 올해의 바로 다음 해. ↔ ◎去年(거년): 지난해."],["“人山人海”의 속뜻으로 알맞은 것은?",["경치 좋은 산과 바다","사람이 살지 않는 곳","사람들이 많이 찾는 유명한 산과 바다","사람이 수없이 많이 모인 상태"],4,"◎人山人海(인산인해): 사람이 산을 이루고 바다를 이루었다는 뜻으로, 사람이 수없이 많이 모인 상태를 이르는 말."],["우리의 전통 놀이가 <u>아닌</u> 것은?",["제기차기","썰매타기","로데오","씨름"],3,"◎로데오: 길들이지 아니한 말이나 소를 탄 채버티거나 길들이는 경기. 미국 서부의 카우보이들이서로 솜씨를 겨룬 데서 시작되었다."],["우리의 평소 행동으로 바르지 <u>않은</u> 것은?",["다른 사람이 말할 때에는 끼어들지 않도록 한다.","복도를 지나갈 때에는 가능한 뛰지 않도록 한다.","다른 사람을 배려할 수 있는 넉넉한 마음을 갖는다.","실수로 남의 발을 밟으면 모르는 척 하고 지나간다."],4,""]],"lv":"5급"},{"id":"84","t":"제84회","ty":"가형","off":true,"qs":[["孝",["친할 친","효도 효","늙을 로","함께 공"],2,"◎親(친할 친), 老(늙을 로), 共(함께 공)."],["道",["길 도","마땅할 당","마당 장","걸음 보"],1,"◎當(마땅할 당), 場(마당 장), 步(걸음 보)."],["村",["마디 촌","마을 촌","재주 재","수풀 림"],2,"◎寸(마디 촌), 才(재주 재), 林(수풀 림)."],["科",["대 죽","모일 사","과목 과","이로울 리"],3,"◎竹(대 죽), 社(모일 사), 利(이로울 리)."],["花",["불 화","쌀 미","꽃부리 영","꽃 화"],4,"◎火(불 화), 米(쌀 미), 英(꽃부리 영)."],["强",["번개 전","배울 학","고을 읍","강할 강"],4,"◎電(번개 전), 學(배울 학), 邑(고을 읍)."],["民",["이룰 성","백성 민","밝을 명","목숨 명"],2,"◎成(이룰 성), 明(밝을 명), 命(목숨 명)."],["多",["많을 다","읽을 독","저녁 석","아침 조"],1,"◎讀(읽을 독), 夕(저녁 석), 朝(아침 조)."],["놓을 방",["方","班","敎","放"],4,"◎方(모 방), 班(나눌 반), 敎(가르칠 교)."],["물을 문",["問","同","開","門"],1,"◎同(한가지 동), 開(열 개), 門(문 문)."],["보일 시",["時","詩","市","示"],4,"◎時(때 시), 詩(글 시), 市(저자 시)."],["심을 식",["直","植","形","計"],2,"◎直(곧을 직), 形(모양 형), 計(셀 계)."],["여름 하",["冬","秋","夏","意"],3,"◎冬(겨울 동), 秋(가을 추), 意(뜻 의)."],["오를 등",["原","登","京","近"],2,"◎原(언덕 원), 京(서울 경), 近(가까울 근)."],["군사 군",["家","軍","車","急"],2,"◎家(집 가), 車(수레 거), 急(급할 급)."],["‘칼의 모양’을 본떠 만든 한자는?",["用","刀","力","巾"],2,"◎刀(칼 도)."],["“<u>洞</u>口 밖 과수원 길에 아카시아 꽃이 피었다”에서 밑줄 친 ‘洞’의 훈음으로 가장 알맞은 것은?",["고을 동","고을 통","꿰뚫을 통","꿰뚫을 동"],1,"◎洞(동·통): 골, 골짜기, 고을, 마을, 동네, 굴, 동굴, 공경하는 모양, 혼돈한 모양, 서로 이어진 모양, 깊을, 그윽할, 빌, 공허할, 빨리 흐를, 물이 세차게 치솟을, 설사할 (동) / 밝을, 꿰뚫을, 통할, 통달할 (통). ◎洞口(동구):「1」동네 어귀."],["“間<u>食</u>”에서 밑줄 친 ‘食’의 훈음으로 가장 알맞은 것은?",["밥 사","먹을 식","먹이 사","생활 식"],2,"◎食(식․사․이): 먹을, 밥, 음식, 제사, 벌이, 생활, 생계, 먹일, 현혹케할, 지울 (식) / 먹이, 밥, 기를, 먹일, 양육할 (사) / 사람이름 (이). ◎間食(간식): 끼니와 끼니 사이에 음식을 먹음."],["‘貝’을(를) 자전에서 찾을 때의 방법으로 바르지 <u>않은</u> 것은?",["자음으로 찾을 때는 ‘패’음에서 찾는다.","총획으로 찾을 때는 ‘7획’에서 찾는다.","부수로 찾을 때는 ‘目’부수 2획에서 찾는다.","부수로 찾을 때는 ‘貝’부수 0획에서 찾는다."],3,"◎貝(조개 패): 貝(조개 패, 7획)부수의 0획, 총7획."],["‘語’의 유의자는?",["安","言","韓","農"],2,"◎語(말씀 어) = 言(말씀 언)."],["‘死’의 반의자는?",["神","交","事","生"],4,"◎死(죽을 사) ↔ 生(날, 살 생)."],["“水□, □和, 不□”에서 □안에 공통으로 들어갈 알맞은 한자는?",["上","面","平","活"],3,"◎水平(수평): 기울지 않고 평평한 상태. ◎平和(평화): 평온하고 화목함. ◎不平(불평):「1」마음에 들지 아니하여 못마땅하게 여김. 또는 못마땅한 것을 말이나 행동으로 드러냄.「2」마음이 편하지 아니함. 「3」병으로 몸이 불편함."],["母校",["모교","학교","교정","매교"],1,"◎母校(모교): 자기가 다니거나 졸업한 학교."],["海里",["매리","해수","해리","모리"],3,"◎海里(해리): 거리의 단위. 바다 위나 공중에서 긴 거리를 나타낼 때 쓴다. 1해리는 1,852미터에 해당하나 나라마다 약간의 차이를 보인다."],["漢江",["항공","탄강","한공","한강"],4,"◎漢江(한강): 우리나라 중부를 흐르는 강. 태백산맥에서 시작하여 황해로 흘러든다. 북한강ㆍ남한강의 두 물줄기가 남양주시에서 합류하며, 이 유역은 삼국 시대부터 중요시되어 왔다. 길이는 494.44km."],["住所",["거주","주거","주서","주소"],4,"◎住所(주소): 사람이 살고 있는 곳이나 기관, 회사 따위가 자리 잡고 있는 곳을 행정 구역으로 나타낸 이름."],["歌手",["사수","가수","산수","백수"],2,"◎歌手(가수): 노래 부르는 것이 직업인 사람."],["男性",["여성","남생","역성","남성"],4,"◎男性(남성): 성(性)의 측면에서 남자를 이르는 말. 특히, 성년(成年)이 된 남자를 이른다."],["新物",["신물","근물","친우","친물"],1,"◎新物(신물): 새로운 물건."],["血肉",["혈육","골육","목내","혈내"],1,"◎血肉(혈육):「1」피와 살을 아울러 이르는 말. 「2」부모, 자식, 형제 따위의 한 혈통으로 맺어진 육친."],["每番",["매일","매번","매시","모번"],2,"◎每番(매번): 매 때마다, 번번이."],["弱小",["나약한 소년","나약한 마음","작은 정성","약하고 작음"],4,"◎弱小(약소)."],["後代",["아주 잘 대접함","일이 끝난 후","뒤에 오는 세대나 시대","일정한 때 이후"],3,"◎後代(후대)."],["作別",["만든 물품","인사를 나누고 헤어짐","다시 만나게 됨","죽어서 이별함"],2,"◎作別(작별)."],["심신: 마음과 몸을 아울러 이르는 말.",["心信","信心","心身","心神"],3,""],["부분: 전체를 이루는 작은 범위.",["部分","夫分","不分","分部"],1,""],["일기: 날씨.",["一氣","日氣","日記","記日"],2,""],["동네 사람들 <u>太半</u>이 농사를 짓는다.",["견반","태판","태반","전반"],3,"◎太半(태반): 반수 이상."],["공사로 차량의 <u>通行</u>을(를) 금지했다.",["통행","이동","통과","주행"],1,"◎通行(통행):「1」일정한 장소를 지나다님.「2」 돈이나 물건이 일반에 두루 쓰임."],["<u>夜光</u> 도로 표지판은 불빛을 받아 번쩍거렸다.",["사선","야광","차광","차선"],2,"◎夜光(야광):「1」어둠 속에서 빛을 냄. 또는 그런 물건.「2」‘달’을 달리 이르는 말.「3」야광주. 「4」앙괭이. ‘양괭이’를 한자를 빌려서 쓴 말이다. 「5」달이 없고 맑게 갠 밤하늘에 보이는 희미한 빛."],["펄럭이는 <u>萬國旗</u> 아래에서 가을 운동회가 한창이다.",["만국가","만국기","만국민","만국방"],2,"◎萬國旗(만국기): 세계 여러 나라의 국기."],["이번에 귀중한 <u>문서</u>를 찾아냈다.",["聞書","文書","文西","聞西"],2,"◎文書(문서): 글이나 기호 따위로 일정한 의사나 관념 또는 사상을 나타낸 것."],["그는 나에게 좀 더 확실한 <u>대답</u>을 요구했다.",["大合","大答","對答","對合"],3,"◎對答(대답):「1」부르는 말에 응하여 어떤 말을 함.「2」상대가 묻거나 요구하는 것에 대하여 해답이나 제 뜻을 말함.「3」어떤 문제나 현상을 해명하거나 해결하는 방안."],["그는 부드러운 <u>음색</u>을 가졌다.",["音色","銀色","音育","色音"],1,"◎音色(음색): 음을 만드는 구성 요소의 차이로 생기는, 소리의 감각적 특색. 소리의 높낮이, 크기가 같더라도 진동체나 발음체, 진동 방법에 따라 음이갖는 감각적 성질에는 차이가 생긴다."],["앞 글자가 뒤 글자를 꾸며주는 ‘수식 관계’로 이루어진 것은?",["高見","首頭","左右","有無"],1,"◎高見(고견, 높을 고·볼 견): 뛰어난 의견이나생각. 이는 앞 글자가 뒤 글자를 꾸며주는 ‘수식 관계’이다. ◎首頭(수두, 머리 수·머리 두): 어떤 일에 앞장서는 사람. ◎左右(좌우, 왼 좌·오른 우): 왼쪽과 오른쪽. ◎有無(유무, 있을 유·없을 무): 있음과 없음."],["‘本來’의 유의어는?",["本人","元來","去來","本名"],2,"◎本來(본래): 사물이나 사실이 전하여 내려온그 처음. = ◎元來(원래): 사물이 전하여 내려온 그처음."],["‘正午’의 반의어는?",["午前","子正","午後","白晝"],2,"◎正午(정오): 낮 열두 시, 곧 태양이 표준 자오선을 지나는 순간을 이른다. ↔ ◎子正(자정): 자시(子時)의 한가운데, 밤 열두 시를 이른다."],["“一長一短”의 뜻으로 알맞은 것은?",["변명할 말이 없음","장점도 있고 단점도 있음","장점으로 단점을 보충함","길고 짧은 것은 재어 봐야 앎"],2,"◎一長一短(일장일단): 일면의 장점과 다른 일면의 단점을 통틀어 이르는 말."],["우리 고유의 민속 명절이 <u>아닌</u> 것은?",["한식","추석","입춘","설날"],3,"◎입춘(立春): 이십사절기의 하나. 대한(大寒)과 우수(雨水)  일이 곧 결판나거나끝장날 상황.「3」아침밥과 저녁밥을 아울러 이르는 말"],["正直",["정도","정직","정언","정종"],2,"◎正直(정직): 마음에 거짓이나 꾸밈이 없이 바르고 곧음."],["水銀",["수금","수근","수은","수석"],3,"◎水銀(수은): 상온에서 유일하게 액체 상태로 있는 은백색의 금속 원소. 천연으로 산출되는 진사(辰沙)를 불에 녹여서 얻는 물질로, 독성이 있으며 질산에 쉽게 녹는다. 어떤 금속과도 쉽게 합금을 만들어 아말감이 된다. 금을 정련하거나, 의약ㆍ화약ㆍ살충제ㆍ온도계ㆍ기압계 따위를 만드는 데 쓴다."],["作別",["이별","작별","사별","송별"],2,"◎作別(작별): 인사를 나누고 헤어짐. 또는 그 인 사."],["黃色",["금색","황색","동색","적색"],2,"◎黃色(황색): 익은 벼의 빛깔과 같이 다소 어둡고 탁한 색."],["後漢書",["전한서","후한서","후한화","우한서"],2,"◎後漢書(후한서): 중국 남북조 시대에, 송나라의 범엽(范曄)이 펴낸 후한의 정사(正史). 중국 이십오사(二十五史)의 하나로, 기전체를 썼고 본기(本紀) 10권, 열전(列傳) 80권, 지(志) 30권으로 되어 있다. 양나라의 유소(劉昭)가 보충하였고, 지(志)는 진나라의 사마표(司馬彪)가 지었다."],["共有",["공로가 있음","공공의 목적으로 씀","둘 이상의 사람이나 단체가 함께 일을 함","두 사람 이상이 한 물건을 공동으로 소유함"],4,"◎共有(공유)."],["外面",["비밀로 덮어 둠","세상일을 피하여 숨음","밖으로 드러나지 아니하는 사람의 속마음","마주치기를 꺼리어 피하거나 얼굴을 돌림"],4,"◎外面(외면)."],["衣食住",["국가의 3요소","몹시 밀접한 관계","옷과 음식과 집을 통틀어 이르는 말","좋은 옷을 입고 맛있는 음식을 먹음"],3,"◎衣食住(의식주)."],["명중: 화살이나 총알 따위가 겨냥한 곳에 바로 맞음.",["命中","明中","名中","所中"],1,""],["원로: 한 가지 일에 오래 종사하여 경험과 공로가 많은 사람.",["元老","遠老","古老","王老"],1,""],["시급: 시각을 다툴 만큼 몹시 절박하고 급하다.",["不急","性急","時急","多急"],3,""],["약속 <u>場所</u>(을)를 그곳으로 정했다.",["장소","시간","처소","양소"],1,"◎場所(장소): 어떤 일이 이루어지거나 일어나는 곳."],["그는 얼굴에 <u>會心</u>의 미소를 지었다.",["흑심","사심","쾌심","회심"],4,"◎會心(회심): 마음에 흐뭇하게 들어맞음. 또는 그런 상태의 마음."],["일식과 월식은 태양과 달 그리고 지구가 복잡한 <u>力學</u> 관계에 얽혀 있기 때문에 발생하는 현상이다.",["공생","공학","역학","구학"],3,"◎力學(역학):「1」물체의 운동에 관한 법칙을 연구하는 학문. 물리학의 한 분야이다. 힘의 평형을다루는 정역학, 힘과 운동의 관계를 다루는 동역학, 운동만을 다루는 운동학이 있다.「2」부분을 이루는요소가 서로 의존적 관계를 가지고 서로 제약하는 현상."],["정부는 사회적 거리두기를 5단계로 <u>區分</u>했다.",["구분","구별","균분","분할"],1,"◎區分(구분): 일정한 기준에 따라 전체를 몇 개로 갈라 나눔."],["선생님은 <u>사리</u>에 맞는 말만 하셨다.",["事理","事利","士理","士利"],1,"◎事理(사리): 일의 이치."],["그녀는 세계 여러 나라를 돌면서 <u>견문</u>을 넓혔다.",["見文","見門","見問","見聞"],4,"◎見聞(견문):「1」보고 들음.「2」보거나 듣거나하여 깨달아 얻은 지식."],["올해만 지나면 <u>형편</u>이 나아질 것 같다.",["兄便","形便","行便","形平"],2,"◎形便(형편):「1」일이 되어 가는 상태나 경로 또는 결과.「2」살림살이의 형세.「3」이익을 차리는 생각.「4」땅이 생긴 형상."],["앞 글자가 뒤 글자를 꾸며주는 수식 관계가 <u>아닌</u> 것은?",["兄夫","白晝","人性","登山"],4,"◎兄夫(형부, 맏 형·지아비 부): 언니의 남편을이르거나 부르는 말. ◎白晝(백주, 흰 백·낮 주): 환히밝은 낮. ◎人性(인성, 사람 인·성품 성): 사람의 성품. 이상은 모두 앞 글자가 뒤 글자를 꾸며주는 ‘수식관계’이다."],["‘國民’의 유의어는?",["國家","百姓","百國","民主"],2,"◎國民(국민): 국가를 구성하는 사람. 또는 그 나라의 국적을 가진 사람. = ◎百姓(백성):「1」나라의 근본을 이루는 일반 국민을 예스럽게 이르는 말. 「2」예전에, 사대부가 아닌 일반 평민을 이르던 말."],["‘遠方’의 반의어는?",["近來","近理","方外","近方"],4,"◎遠方(원방): 먼 지방. 또는 먼 곳. ↔ ◎近方(근방): 가까운 곳."],["“電光石火”의 속뜻으로 알맞은 것은?",["조급한 성질을 이르는 말","거짓말을 쉽게 잘함을 이르는 말","전기를 매우 아껴 씀을 이르는 말","매우 짧은 시간이나 매우 재빠른 움직임 따위를 비유적으로 이르는 말"],4,"◎電光石火(전광석화): 번갯불이나 부싯돌의 불이 번쩍거리는 것과 같이 매우 짧은 시간이나 매우재빠른 움직임 따위를 비유적으로 이르는 말."],["“<u>입동</u>은 이십사절기의 하나로 상강과 소설 사이에 들며, 이때부터 겨울이 시작된다고 한다” 에서 밑줄 친 입동을 한자로 바르게 쓴 것은?",["入冬","立冬","入同","立同"],2,"◎立冬(입동): 이십사절기의 하나. 상강(霜降)과 소설(小雪) 사이에 들며, 이때부터 겨울이 시작된다고한다. 11월 8일경이다."],["학교에서의 행동으로 바르지 <u>않은</u> 것은?",["숙제는 밀리지 않도록 미리미리 한다.","수업시간에는 선생님 말씀에 집중한다.","선생님을 만나면 항상 공손하게 인사를 드린다.","친구가 잘못을 저지르면 여기저기 소문을 낸다."],4,""]],"lv":"5급"},{"id":"89b","t":"제89회","ty":"가-1형","off":true,"qs":[["對",["대답할 대","셀 계","대신할 대","학교 교"],1,"◎計(셀 계), 代(대신할 대), 校(학교 교)."],["朝",["할아비 조","기를 육","가운데 앙","아침 조"],4,"◎祖(할아비 조), 育(기를 육), 央(가운데 앙)."],["光",["으뜸 원","빛 광","함께 공","구슬 옥"],2,"◎元(으뜸 원), 共(함께 공), 玉(구슬 옥)."],["當",["집 실","마땅 당","집 가","세상 세"],2,"◎室(집 실), 家(집 가), 世(세상 세)."],["漢",["바다 해","향할 향","한수 한","고을 동"],3,"◎海(바다 해), 向(향할 향), 洞(고을 동)."],["語",["말씀 언","말씀 화","기록할 기","말씀 어"],4,"◎言(말씀 언), 話(말씀 화), 記(기록할 기)."],["貝",["임금 왕","목숨 명","조개 패","나눌 구"],3,"◎王(임금 왕), 命(목숨 명), 區(나눌 구)."],["功",["몸 기","공 공","힘 력","강 강"],2,"◎己(몸 기), 力(힘 력), 江(강 강)."],["꽃 화",["科","農","花","意"],3,"◎科(과목 과), 農(농사 농), 意(뜻 의)."],["성품 성",["性","孝","姓","村"],1,"◎孝(효도 효), 姓(성씨 성), 村(마을 촌)."],["군사 군",["夫","車","軍","高"],3,"◎夫(지아비 부), 車(수레 거), 高(높을 고)."],["낮 오",["小","午","牛","巾"],2,"◎小(작을 소), 牛(소 우), 巾(수건 건)."],["거느릴 부",["步","登","理","部"],4,"◎步(걸음 보), 登(오를 등), 理(다스릴 리)."],["심을 식",["直","道","首","植"],4,"◎直(곧을 직), 道(길 도), 首(머리 수)."],["겨울 동",["交","英","冬","去"],3,"◎交(사귈 교), 英(꽃부리 영), 去(갈 거)."],["“길고 털이 달린 짐승의 꼬리”를 본 뜬 글자에서 ‘털’을 뜻하는 한자는?",["正","衣","巾","毛"],4,"◎毛(털 모)."],["“대통령의 <u>親</u>書를 전달하다” 에서 밑줄 친 ‘親’의 훈음으로 가장 알맞은 것은?",["어버이 친","몸소 친","친할 친","혼인 친"],2,"◎親(친): 친하다, 가깝다, 사랑하다, 가까이하다, 사이 좋다, 손에 익다, 숙달되다, 어버이, 친척, 혼인, 신부, 몸소, 친히(親-) (친). ◎親書(친서):「1」몸소글씨를 씀. 또는 그 글씨.「2」몸소 쓴 편지."],["“진시황은 <u>不</u>老草를 구하기 위해 사방에 사람들을 보냈다”에서 밑줄 친 ‘不’의 훈음으로 가장 알맞은 것은?",["꽃받침 부","아니할 불","재촉할 불","크다 불"],2,"◎不(불·부): 아니다, 아니하다, 못하다, 없다, 말라, 아니하냐, 이르지 아니하다, 크다, 불통(不通: 과 거에서 불합격의 등급), 꽃받침, 꽃자루 (불) / 아니다, 아니하다, 못하다, 없다, 말라, 아니하냐, 이르지아니하다, 크다 (부). ◎不老草(불로초): 먹으면 늙지않는다고 하는 풀."],["‘血’을(를) 자전에서 찾을 때의 방법으로 바르지 <u>않은</u> 것은?",["부수로 찾을 때는 ‘皿’부수 1획에서 찾는다.","자음으로 찾을 때는 ‘혈’음에서 찾는다.","총획으로 찾을 때는 ‘6획’에서 찾는다.","부수로 찾을 때는 ‘血’부수 0획에서 찾는다."],1,"◎血(피 혈): 血(피 혈, 6획)부수의 0획, 총6획."],["‘里’의 유의자는?",["理","同","村","向"],3,"◎里(마을 리) = 村(마을 촌)."],["‘學’의 반의자는?",["林","行","米","敎"],4,"◎學(배울 학) ↔ 敎(가르칠 교)."],["“□世, □遠, □住”에서 □안에 공통으로 들어갈 알맞은 한자는?",["銀","永","英","古"],2,"◎永世(영세): 세월이 오램. 또는 그런 세월이나세대. ◎永遠(영원): 어떤 상태가 끝없이 이어짐. 또는 시간을 초월하여 변하지 아니함. ◎永住(영주): 한곳에 오래 삶."],["古詩",["고전","고사","고시","고수"],3,"◎古詩(고시): 고대의 시. 한시(漢詩)에서는 주로 후한 이전의 시, 시경(詩經)이나 문선(文選)에 딸린시를 이른다."],["銀行",["은항","은수","은형","은행"],4,"◎銀行(은행): 어떠한 현상을 일으키거나 영향을 미침."],["所聞",["소문","수문","소민","소수"],1,"◎所聞(소문): 사람들 입에 오르내려 전하여 들리는 말."],["問答",["답문","문합","문갑","문답"],4,"◎問答(문답): 물음과 대답. 또는 서로 묻고 대답함."],["東京",["도경","동경","동도","경도"],2,"◎東京(동경):「1」발해 때에 둔 오경(五京)의 하나.「2」고려 시대에 둔 사경(四京) 가운데 지금의 경주에 해당하는 행정 구역「3」‘도쿄’를 우리 한자음으로 읽은 이름."],["自力",["자력","자구","자수","자강"],1,"◎自力(자력): 자기 혼자의 힘."],["正面",["측면","정면","양면","수면"],2,"◎正面(정면):「1」똑바로 마주 보이는 면.「2」 사물에서, 앞쪽으로 향한 면.「3」에두르지 아니하고직접 마주 대함."],["原來",["원래","원체","원양","원미"],1,"◎原來(원래): 사물이 전하여 내려온 그 처음."],["高空",["고간","고강","고공","고가"],3,"◎高空(고공): 높은 공중. 흔히 높이 1,500～2,000미터 위의 하늘을 이른다."],["無時",["아무런 일이 없음","제철이 아닌 때","일정한 때가 없음","사람을 깔보거나 업신여김"],3,"◎無時(무시)."],["各別",["별도의 이름","서로 갈리어 떨어짐","사람이나 물건의 하나하나","마음가짐이나 자세 따위가 유달리 특별함"],4,"◎各別(각별)."],["見利",["이익을 봄","날카로운 칼","평소와는 다른 상태","실현하려고 하는 일이나 나아가는 방향"],1,"◎見利(견리)."],["야반 : 밤이 깊은 때.",["夜分","夜半","夜班","夜氣"],2,""],["가수 : 노래 부르는 것이 직업인 사람.",["歌家","歌水","歌首","歌手"],4,""],["하일 : 여름철의 날. 또는 그날의 날씨.",["春日","下日","夏日","秋日"],3,""],["부지런히 <u>新出</u>한자를 익히다.",["친출","근출","신생","신출"],4,"◎新出(신출):「1」새로 세상에 나옴. 또는 그런인물이나 물건.「2」곡식이나 과일 따위에서 그해에 들어 처음 거두어들인 것."],["항구의 새벽은 <u>活氣</u>에 넘쳤다.",["살기","설기","활기","활발"],3,"◎活氣(활기): 활동력이 있거나 활발한 기운."],["나는 그 <u>作家</u>의 소설을 전부 읽었다.",["작사","작품","작전","작가"],4,"◎作家(작가): 문학 작품, 사진, 그림, 조각 따위의 예술품을 창작하는 사람."],["그는 길눈이 어두워 <u>每番</u> 헤매곤 한다.",["매번","배번","양번","모번"],1,"◎每番(매번):「1」각각의 차례.「2」매 때마다."],["얼굴에 차츰 <u>화색</u>이 돌기 시작했다.",["死色","火色","花色","和色"],4,"◎和色(화색): 얼굴에 드러나는 온화하고 환한 빛."],["<u>전선</u>이 전봇대 사이에 복잡하게 걸쳐 있다.",["全線","前線","電線","田線"],3,"◎電線(전선): 전류가 흐르도록 하는 도체(導體) 로서 쓰는 선."],["검찰은 수사에 성역이 없다는 <u>입장</u>을 분명히 했다.",["立場","入場","立長","入長"],1,"◎立場(입장): 당면하고 있는 상황."],["‘앞 글자가 뒤 글자를 꾸며주는’ 어휘는?",["强弱","朝夕","有用","竹馬"],4,"◎强弱(강약, 강할 강·약할 약): 강하고 약함. 또는 그런 정도. ◎朝夕(조석): 아침과 저녁을 아울러이르는 말. 이상은 ‘병렬 관계’이다. ◎有用(유용, 있을 유·쓸 용): 쓸모가 있음. 이는 ～에～하다로 술보관계이다. ◎竹馬(죽마): 대말."],["‘休心’의 유의어는?",["民心","信心","安心","先心"],3,"◎休心(휴심): 모든 걱정을 떨쳐 버리고 마음을 편히 가짐 = ◎安心(안심): 모든 걱정을 떨쳐 버리고마음을 편히 가짐."],["‘長身’의 반의어는?",["人身","心身","短身","國人"],3,"◎長身(장신): 키가 큰 몸. ↔ ◎短身(단신): 작은 키의 몸"],["“九死一生”의 뜻으로 알맞은 것은?",["죽을 고비를 여러 차례 넘기고 겨우 살아남","외롭고 곤란한 지경에 빠진 형편을 이르는 말","매우 많은 것 가운데 극히 적은 수를 이르는 말","열 가운데 여덟이나 아홉 정도로 거의 대부분이거나 거의 틀림없음"],1,"◎九死一生(구사일생): 아홉 번 죽을 뻔하다 한번 살아난다는 뜻으로, 죽을 고비를 여러 차례 넘기고 겨우 살아남을 이르는 말."],["겨울에 해당하는 절기가 <u>아닌</u> 것은?",["소설","한로","동지","소한"],2,"◎한로(寒露)는 추분과 상강 사이에 들며, 가을의 절기에 해당한다. 태양의 황경(黃經)이 195도인 때이다. 10월 8일경이다."],["평소의 태도로 바르지 <u>않은</u> 것은?",["주어진 일에 책임 의식을 갖는다.","형제간에 우애있게 지내려고 노력한다.","부모님께서 걱정하실 일은 하지 않는다.","수업시간에 피곤하면 하품을 크게 한다."],4,""]],"lv":"5급"},{"id":"92","t":"제92회","ty":"가형","off":true,"qs":[["登",["이름 명","임금 왕","편할 편","오를 등"],4,"◎登(오를 등). 名(이름 명), 王(임금 왕), 便(편할 편)."],["場",["언덕 원","마당 장","마을 촌","집 실"],2,"◎場(마당 장). 原(언덕 원), 村(마을 촌), 室(집 실)."],["親",["줄 선","이제 금","친할 친","할아비 조"],3,"◎親(친할 친). 線(줄 선), 今(이제 금), 祖(할아비 조)."],["示",["조개 패","예 고","보일 시","끝 말"],3,"◎示(보일 시). 貝(조개 패), 古(예 고), 末(끝 말)."],["夏",["장인 공","몸 기","무거울 중","여름 하"],4,"◎夏(여름 하). 工(장인 공), 己(몸 기), 重(무거울 중)."],["計",["셀 계","절반 반","사귈 교","짧을 단"],1,"◎計(셀 계). 半(절반 반), 交(사귈 교), 短(짧을 단)."],["植",["수풀 림","심을 식","근본 본","쉴 휴"],2,"◎植(심을 식). 林(수풀 림), 本(근본 본), 休(쉴 휴)."],["太",["클 태","온전할 전","개 견","이로울 리"],1,"◎太(클 태). 全(온전할 전), 犬(개 견), 利(이로울 리)."],["쌀 미",["所","友","米","巾"],3,"◎米(쌀 미). 所(바 소), 友(벗 우), 巾(수건 건)."],["일만 만",["地","衣","川","萬"],4,"◎萬(일만 만). 地(땅 지), 衣(옷 의), 川(내 천)."],["각각 각",["各","左","冬","夕"],1,"◎各(각각 각). 左(왼 좌), 冬(겨울 동), 夕(저녁 석)."],["편안할 안",["央","室","弟","安"],4,"◎安(편안할 안). 央(가운데 앙), 室(집 실), 弟(아우 제)."],["갈 거",["士","去","毛","千"],2,"◎去(갈 거). 士(선비 사), 毛(털 모), 千(일천 천)."],["고을 읍",["邑","右","羊","今"],1,"◎邑(고을 읍). 右(오른 우), 羊(양 양), 今(이제 금)."],["몸 신",["足","耳","身","百"],3,"◎身(몸 신). 足(발 족), 耳(귀 이), 百(일백 백)."],["사람의 모습과 나무의 모습을 더한 글자로 ‘쉬다’가 본뜻인 한자는?",["大","休","林","竹"],2,"◎休(쉴 휴): 사람(亻)이 나무(木) 곁에서 쉬는 모습이에요."],["“自<u>白</u>”에서 밑줄 친 ‘白’의 훈음으로 알맞은 것은?",["희다 백","비단 백","말하다 백","부질없다 백"],3,"◎白은 ‘희다’ 외에 ‘아뢰다(말하다)’라는 뜻도 있어요. ◎自白(자백): 자기가 저지른 잘못을 스스로 털어놓음."],["“<u>校</u>正을 보다”에서 밑줄 친 ‘校’의 훈음으로 가장 알맞은 것은?",["빠르다 교","학교 교","갚다 교","바로잡다 교"],4,"◎校는 ‘학교’ 외에 ‘바로잡다, 헤아리다’의 뜻도 있어요. ◎校正(교정): 원고와 대조해 틀린 글자를 바르게 고침."],["‘意’을(를) 자전에서 찾을 때의 방법으로 바르지 <u>않은</u> 것은?",["총획으로 찾을 때는 ‘13획’에서 찾는다.","자음으로 찾을 때는 ‘의’음에서 찾는다.","부수로 찾을 때는 ‘立’부수 8획에서 찾는다.","부수로 찾을 때는 ‘心’부수 9획에서 찾는다."],3,"◎意(뜻 의): 心(마음 심, 4획)부수의 9획, 총 13획."],["‘洞’의 유의자는?",["古","口","力","里"],4,"◎洞(고을·마을 동) = 里(마을 리)."],["‘弱’의 반의자는?",["石","强","老","貝"],2,"◎弱(약할 약) ↔ 强(강할 강)."],["“日□, □作, □世代”에서 □안에 공통으로 들어갈 알맞은 한자는?",["明","詩","月","新"],4,"◎日新(일신): 날마다 새로워짐. ◎新作(신작): 새로 지은 작품. ◎新世代(신세대): 새로운 세대."],["古語",["고언","고어","구어","고시"],2,"◎古語(고어): 오늘날은 쓰지 않는 옛날의 말."],["草食",["조식","조반","초식","초가"],3,"◎草食(초식): 주로 풀이나 푸성귀만 먹고 삶."],["和合",["화급","화회","화합","구급"],3,"◎和合(화합): 화목하게 어울림."],["交信",["교신","교언","수신","수화"],1,"◎交信(교신): 우편·전화 따위로 정보나 의견을 주고받음."],["血氣",["혈색","열혈","혈맥","혈기"],4,"◎血氣(혈기): 힘을 쓰고 활동하게 하는 원기."],["軍歌",["거가","찬가","군가","가요"],3,"◎軍歌(군가): 군대의 사기를 북돋우기 위해 부르는 노래."],["科目",["과목","안목","안일","과일"],1,"◎科目(과목): 가르치거나 배워야 할 지식을 나눈 영역."],["同等",["동당","동등","동료","동창"],2,"◎同等(동등): 등급이나 정도가 같음."],["近來",["근자","근대","근시","근래"],4,"◎近來(근래): 가까운 요즈음."],["夜半",["초저녁","밤을 새우다","밤하늘","밤이 깊은 때"],4,"◎夜半(야반): 밤 야, 절반 반 → 밤이 깊은 때(한밤중)."],["放水",["물을 끌어다 댐","물을 흘려보냄","흐르는 물을 막음","물이 흘러가는 방향"],2,"◎放水(방수): 놓을 방, 물 수 → 물을 흘려보냄."],["多讀",["큰소리로 읽음","많이 읽음","처음부터 끝까지 훑어 읽음.","뜻을 새겨 가며 자세히 읽음."],2,"◎多讀(다독): 많을 다, 읽을 독 → 많이 읽음."],["시서: 시와 글씨를 아울러 이르는 말.",["時書","詩書","市西","首書"],2,"◎詩書(시서): 詩(시 시) + 書(글 서)."],["영원: 어떤 상태가 끝없이 이어짐.",["英遠","永原","英原","永遠"],4,"◎永遠(영원): 永(길 영) + 遠(멀 원)."],["공부: 학문이나 기술을 배우고 익힘.",["共夫","工父","工夫","共父"],3,"◎工夫(공부): 工(장인 공) + 夫(지아비 부)."],["고대 <u>文明</u>의 발상지.",["문자","문화","문명","문학"],3,"◎文明(문명): 인류가 이룩한 물질적·기술적·사회적 발전."],["무성한 <u>所聞</u>이 돌고 있다.",["소문","풍문","근문","소송"],1,"◎所聞(소문): 사람들 입에 오르내려 전하여 들리는 말."],["여름철이 되자 <u>電力</u> 소비량이 급격히 증가했다.",["전자","전기","전공","전력"],4,"◎電力(전력): 단위 시간에 사용되는 전기 에너지의 양."],["일제는 운요호 사건을 계기로 우리나라에 <u>開國</u>을 강요하였다.",["쇄국","개국","폐국","건국"],2,"◎開國(개국): 나라의 문을 열어 다른 나라와 교류함."],["<u>형편</u>이 여의치 않게 되었다.",["兄便","形色","兄色","形便"],4,"◎形便(형편): 일이 되어 가는 상태나 결과. 形(모양 형) + 便(편할 편)."],["맑던 하늘이 <u>오후</u>가 되면서 흐려졌다.",["玉後","五後","午後","牛後"],3,"◎午後(오후): 午(낮 오) + 後(뒤 후)."],["어린아이가 어찌나 고집<u>불통</u>인지 부모 말도 치불입이야.",["不通","不洞","分通","本洞"],1,"◎不通(불통): 서로 통하지 아니함. ◎固執不通(고집불통): 조금도 융통성 없이 자기주장만 내세움."],["앞 글자가 뒤 글자를 꾸며주는 것은?",["全心","出入","大小","男女"],1,"◎全心(전심): 온 마음 → 수식관계. 出入·大小·男女는 반대되는 뜻의 한자로 이루어진 병렬관계예요."],["‘高手’의 유의어는?",["中手","先手","下手","上手"],4,"◎高手(고수) = 上手(상수): 남보다 뛰어난 솜씨를 가진 사람."],["‘無言’의 반의어는?",["直言","手話","有心","有言"],4,"◎無言(무언): 말이 없음 ↔ 有言(유언): 말이 있음."],["“24절기는 기온이 아닌 <u>晝夜長短</u>에 따라 정해진 것이다”에서 밑줄 친 晝夜長短의 뜻으로 알맞은 것은?",["밤과 낮의 길고 짧음","밤낮으로 쉬지 아니함","길고 짧은 것은 대어 보아야 안다","아침에 일찍 일어나고 밤에 늦게 잠"],1,"◎晝夜長短(주야장단): 낮 주, 밤 야, 길 장, 짧을 단 → 밤과 낮의 길고 짧음."],["여름에 해당하는 절기가 <u>아닌</u> 것은?",["하지","소서","말복","망종"],3,"◎여름 절기: 입하, 소만, 망종, 하지, 소서, 대서. 말복은 절기가 아니라 삼복 중 마지막 복날이에요."],["앞으로 계승 발전시켜야 할 우리의 고유 민속놀이로 알맞지 <u>않은</u> 것은?",["강강술래","줄다리기","씨름","카드놀이"],4,"◎카드놀이는 우리 고유의 민속놀이가 아니에요."]],"lv":"5급"},{"id":"93","t":"제93회","ty":"가-1형","off":true,"qs":[["意",["설 립","밝을 명","뜻 의","많을 다"],3,"◎意(뜻   r.int = n => Math.floor(r() * n); r.pick = a => a[r.int(a.length)];
  r.shuf = a => { a = a.slice(); for (let i = a.length-1; i > 0; i--){ const j = r.int(i+1); [a[i],a[j]] = [a[j],a[i]]; } return a; };
  r.wpick = (a, w) => { const ws = a.map(w); let t = ws.reduce((x,y)=>x+y,0) * r(); for (let i = 0; i < a.length; i++){ t -= ws[i]; if (t <= 0) return a[i]; } return a[a.length-1]; };
  return r; }

function makePaper(seed){

  const put = (n, item) => { item.n = n; qs.push(item); };
  const bankOr = (n, slot, gen, p) => { let it = r() < p ? gen() : null; if (!it) it = gBank(r, slot, usedB); if (!it) it = gen(); put(n, it); };
  for (let n = 1; n <= 8; n++) put(n, gHun(r, usedC));
  for (let n = 9; n <= 15; n++) put(n, gHanja(r, usedJ));
  put(16, gBank(r, "자원", usedB)); put(17, gBank(r, "다음자", usedB)); bankOr(18, "다음자", () => gReadWrong(r), .35); put(19, gBank(r, "자전", usedB));
  bankOr(20, "유의자", () => gPair(r, "유의자"), .5); bankOr(21, "반의자", () => gPair(r, "반의자"), .5);
  put(22, gBank(r, "공통한자", usedB));
  const reads = r.shuf([1,1,1,1,1,1,0,0,0]);
  reads.forEach((g, i) => bankOr(23+i, "독음", () => gRead(r, usedV), g ? 1 : 0));
  r.shuf([1,1,0]).forEach((g, i) => bankOr(32+i, "뜻", () => gMean(r, usedV), g ? 1 : 0));
  r.shuf([1,1,0]).forEach((g, i) => bankOr(35+i, "낱말쓰기", () => gWrite(r, usedV), g ? 1 : 0));
  for (let n = 38; n <= 41; n++) put(n, gBank(r, "문장독음", usedB, r() < .6));
  for (let n = 42; n <= 44; n++) put(n, gBank(r, "문장한자", usedB, r() < .6));
  put(45, gBank(r, "짜임", usedB)); bankOr(46, "유의어", () => gWordPair(r, "유의어"), .6); bankOr(47, "반의어", () => gWordPair(r, "반의어"), .6);

}

async function connect(){

/* ===== 채점 ===== */
function grade(){
  const P = S.paper; if (!P || P.graded) return;
  const empty = P.qs.length - Object.keys(P.ans).length;
  if (empty && !P.confirmEmpty){ P.confirmEmpty = true; toast(`${empty}문제를 아직 안 골랐어요. 한 번 더 누르면 채점해요`); return; }
  let correct = 0; const byTag = {}, wrong = [];
  P.qs.forEach((q, i) => {
    const tag = (secOf(q.origN || q.n) || {}).tag || "기타";
    byTag[tag] = byTag[tag] || { c:0, t:0 }; byTag[tag].t++;
    S.seen[q.key] = (S.seen[q.key] || 0) + 1;
    const p = P.ans[i] || 0;
    const nk = "n" + hashKey(strip(q.q) + "|" + strip(q.o[q.a-1]));
    if (p === q.a){ correct++; byTag[tag].c++; if (S.notes[nk] && !S.notes[nk].fixed) S.notes[nk] = Object.assign({}, S.notes[nk], { fixed:true, fixedAt:Date.now() }); }
    else {
      wrong.push(i);
      const old = S.notes[nk] || { miss:0 };
      S.notes[nk] = { q:q.q, o:q.o, a:q.a, ex:q.ex || "", tag, origN:q.origN || q.n, src:q.src || `${P.title} ${q.n}번`, miss:(old.miss||0)+1, last:p, at:Date.now(), fixed:false };
    }
  });
  // 오답노트는 최근 400개까지
  const keys = Object.keys(S.notes); if (keys.length > 400) keys.sort((a,b) => (S.notes[a].at||0) - (S.notes[b].at||0)).slice(0, keys.length - 400).forEach(k => delete S.notes[k]);
  const score = Math.round(correct / P.qs.length * 100);
  P.graded = { score, correct, total:P.qs.length, byTag, wrong, sec:Math.floor((Date.now() - P.at)/1000), at:Date.now() };
  S.hist.push({ t:P.title + (P.kind === "mock" ? " 모의" : ""), s:score, k:P.kind, at:Date.now() }); S.hist = S.hist.slice(-40);
  S.showEx = true;
  persist(); LS.set("paper", P); render(); window.scrollTo({ top:0, behavior:"smooth" });
}
function hashKey(s){ let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }

    return cs.map(c => "h:"+c);
  }
  let vs = VOC.filter(v => v.m);
  if (WCATS.includes(f)) vs = vs.filter(v => v.cat === f);
  else if (f === "TOP40") vs = vs.filter(v => v.top).sort((a,b) => b.top - a.top);

const CTM = {

function makeCardTest(mode, keys, n = 20){
  const r = RNG((Date.now() ^ (Math.random()*1e9)) >>> 0);
  const pri = k => (S.known[k] === -1 ? 4 : S.known[k] == null ? 2 : 1);
  let pool = keys.slice(); if (!pool.length) return null;
  const pick = []; const left = pool.slice();
  while (pick.length < Math.min(n, pool.length)){ const k = r.wpick(left, pri); pick.push(k); left.splice(left.indexOf(k), 1); }
  const items = pick.map(k => {
    if (mode === "hun" || mode === "char"){
      const c = k.slice(2), h = CH[c][0], rd = rdOf(c);
      const cand = r.shuf((HOMO[rd] || []).filter(x => x !== c && CH[x][0] !== h)).slice(0, 1).concat(r.shuf(CHARS.filter(x => x !== c && CH[x][0] !== h && CH[x][2] === CH[c][2])));
      const dis = [...new Set(cand)].slice(0, 3);
      if (mode === "hun"){ const [o, a] = placeAns(r, h, dis.map(x => CH[x][0])); return { key:k, show:c, big:"big", o, a:a+1, hz:false, ex:`◎${c}(${h})${relOf(c) ? " · " + relOf(c) : ""}` }; }
      const [o, a] = placeAns(r, c, dis); return { key:k, show:h, big:"txt", o, a:a+1, hz:true, ex:`◎${c}(${h})` };
    }
    const v = VBY[k.slice(2)];
    if (mode === "read"){ const dis = readDistract(v, r); while (dis.length < 3) dis.push(rdOf(r.pick(CHARS)) + rdOf(r.pick(CHARS))); const [o, a] = placeAns(r, v.r, dis.slice(0,3)); return { key:k, show:v.w, big:"wbig", o, a:a+1, hz:false, ex:`◎${v.w}(${v.r}): ${v.m}` }; }
    const others = r.shuf(VOC.filter(x => x.m && x.w !== v.w && x.m !== v.m && (x.cat === v.cat || [...x.w].some(c => v.w.includes(c)))));
    const more = r.shuf(VOC.filter(x => x.m && x.w !== v.w && x.m !== v.m));
    const dis = [...new Map(others.concat(more).map(x => [x.w, x])).values()].slice(0, 3);
    if (mode === "mean"){ const [o, a] = placeAns(r, v.m, dis.map(x => x.m)); return { key:k, show:v.w, big:"wbig", o, a:a+1, hz:false, ex:`◎${v.w}(${v.r}): ${v.m}` }; }
    const [o, a] = placeAns(r, v.w, dis.map(x => x.w)); return { key:k, show:v.m, big:"txt", o, a:a+1, hz:true, ex:`◎${v.w}(${v.r}): ${v.m}` };
  });
  return { mode, title:`한자카드 시험 · ${CTM[mode].t}`, items, idx:0, ans:{}, at:Date.now(), done:null };
}
